# Measure-Distance experiment overlay
#
# Loaded by conductor when --experiment=measure-distance is passed.
# Overrides the review-runs step to:
#   - use this directory's review.md (stock prompt + measure-distance instructions)
#   - expose the script:measure-distance tool alongside vision
#
# Baseline (no --experiment flag) keeps the workflow's default prompt and
# tools list — vision only, no measure-distance mentioned.
name: measure-distance
description: Enable measure-distance ruler tool for clearance verification during review.
overrides:
  review-runs:
    prompt: review.md
    tools:
      - vision
      - script:measure-distance
