<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchoring without a SIR — a loose PDF from upload to the map</title>
<style>
/* ============================================================
   spec-kit v5.1  —  winston HTML spec design system
   Inline the ENTIRE contents of this file into the spec's style block.
   Canonical source: ~/.claude/skills/winston-spec/assets/spec-kit.css
   When you change this file, bump the version above and in COMPONENTS.md.
   v4: + sequence diagram (.seq*), + data table (.spectable), + prompt block (.prompt)
   v5: + system map (.sysmap/.sys, edges drawn by spec-kit.js), + decision flow (.dflow),
       + concept figure (figure.concept), + claim caption (.claim), + reference chip rows (.sys-refs),
       + spec reader page (body.reader; DESIGN-SPEC.md rendered by marked, built by inline-kit.py --spec)
   v5.1: pass-2 friction fixes — long identifiers wrap (.sys .t, .uc .nt, .ent .ty), .sysmap-scroll for
       6+ columns, state-neutral .sm pills, .dflow jump outcomes, legend 'new trigger' dot
       Colour rule: fill/border = change state only; kind = badge text + shape; legend is the
       complete list of colour meanings on the page.
   ============================================================ */

:root{
  /* steel-blue ramp (matches cityhall / Noetic report surfaces) */
  --p50:#f0f5f9;--p100:#dce8f1;--p200:#b9d2e5;--p300:#8cb4d1;--p400:#6397b8;
  --p500:#517e9e;--p600:#3f6582;--p700:#35526b;--p800:#2d4559;--p900:#273b4b;--p950:#182530;
  --bg:#f9f9f9;--card:#ffffff;--divider:#dfdfdf;--ink:#1f2937;--muted:#6b7280;--ember:#bb4d00;
  /* semantic: new / changed / retired */
  --new:#15803d;--newbg:#f0fdf4;--newbd:#bbf7d0;
  --chg:#b45309;--chgbg:#fffbeb;--chgbd:#fde68a;
  --ret:#b91c1c;--retbg:#fef2f2;--retbd:#fecaca;
  --sans:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --mono:'Fira Code','SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:15px}

/* ---------- masthead ---------- */
header.masthead{background:linear-gradient(135deg,var(--p800),var(--p600));color:#fff;padding:34px 32px 30px;position:relative;overflow:hidden}
header.masthead::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);pointer-events:none}
header.masthead .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--p200)}
header.masthead h1{font-family:var(--serif);font-weight:600;margin:.35em 0 .2em;font-size:29px;position:relative}
header.masthead p{margin:0;color:var(--p100);max-width:880px;font-size:15px}
header.masthead .meta{margin-top:14px;font-size:12.5px;color:var(--p200);font-family:var(--mono)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;background:var(--p950);padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-wrap:wrap}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--p200);font-family:var(--sans);font-size:14px;font-weight:500;padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
nav.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-right:7px}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.04)}
nav.tabs button.active{color:#fff;border-bottom-color:var(--ember);background:rgba(255,255,255,.06)}

/* ---------- layout ---------- */
main{max-width:1140px;margin:0 auto;padding:30px 26px 90px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2{font-family:var(--serif);font-weight:600;font-size:23px;margin:34px 0 6px;color:var(--p900)}
h2:first-child{margin-top:4px}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--p500);font-weight:400;margin-bottom:3px}
h3{font-size:16px;font-weight:600;margin:28px 0 8px;color:var(--p800);display:flex;align-items:center;gap:9px}
h3 .hn{font-family:var(--mono);font-size:12px;color:#fff;background:var(--p600);border-radius:5px;padding:2px 8px}
h4{font-size:14px;font-weight:600;margin:18px 0 6px;color:var(--p800)}
p{margin:.55em 0}
.lede{font-size:16px;color:var(--p800);border-left:3px solid var(--ember);padding-left:16px;margin:14px 0 20px}
ul{margin:.4em 0;padding-left:22px}li{margin:.28em 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--p50);border:1px solid var(--p100);border-radius:4px;padding:1px 5px;color:var(--p800)}

/* ---------- callout ---------- */
.callout{background:var(--p50);border:1px solid var(--p200);border-left:4px solid var(--p500);border-radius:8px;padding:13px 17px;margin:16px 0}
.callout.ember{background:#fdf6f0;border-color:#f0cba8;border-left-color:var(--ember)}
.callout.new{background:var(--newbg);border-color:var(--newbd);border-left-color:var(--new)}
.callout .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:600;display:block;margin-bottom:3px}
.callout.ember .lab{color:var(--ember)} .callout.new .lab{color:var(--new)}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:12px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.swatch{width:26px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}

/* ---------- shared field badges (used by entity rows + legend) ---------- */
.b{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;padding:1px 4px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.b-pk{background:#fef3c7;color:#92600a;border:1px solid #fde68a}
.b-fk{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.b-nn{background:#eef1f4;color:#4b5563;border:1px solid #d7dde3}
.b-new{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   ER / UML entity boxes
   ============================================================ */
.erd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:16px 0;background:#fbfcfd;border:1px solid var(--divider);border-radius:12px;padding:18px}
.ent{border:1px solid var(--divider);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:236px;flex:0 1 auto}
.ent .eh{padding:7px 12px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ent .eh .en{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.ent .eh .stereo{font-size:9.5px;font-family:var(--mono);opacity:.85;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ent.exist .eh{background:var(--p700)}
.ent.newt .eh{background:var(--new)}
.ent.changed .eh{background:var(--chg)}
.ent.retired .eh{background:#9ca3af}
.ent.retired{opacity:.72}
.ent .row{display:flex;align-items:center;gap:7px;padding:4px 11px;font-size:11.5px;border-top:1px solid #eef1f4}
.ent .row:first-of-type{border-top:0}
.ent .row .nm{font-family:var(--mono);font-size:11.5px;color:var(--p900);font-weight:600}
.ent .row .ty{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;text-align:right;max-width:60%;overflow-wrap:anywhere}
.ent .row.hi{background:#fff9f2}
.ent .row.strk .nm{text-decoration:line-through;color:var(--muted)}
.ent .note{padding:5px 11px;font-size:10px;color:var(--muted);font-style:italic;border-top:1px dashed #e5e9ee;background:#fbfcfd}
/* diff rows — show a table modification (column added / removed), git-style.
   Put a "+"/"−" marker in a .gut span at the start of the row. */
.ent .row .gut{flex:0 0 10px;width:10px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.ent .row.add{background:var(--newbg);box-shadow:inset 3px 0 0 var(--new)}
.ent .row.add .gut{color:var(--new)}
.ent .row.add .nm{color:#166534}
.ent .row.del{background:var(--retbg);box-shadow:inset 3px 0 0 var(--ret)}
.ent .row.del .gut{color:var(--ret)}
.ent .row.del .nm{color:var(--ret);text-decoration:line-through}

/* relationships panel — crow's-foot text notation */
.rels{background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:14px 0;font-family:var(--mono);font-size:12px;line-height:1.9}
.rels .rl{display:block;color:var(--p800)}
.rels .rl b{color:var(--ember)}
.rels .cf{color:var(--p500);font-weight:700}
.rels .cmt{color:var(--muted);font-style:normal;font-family:var(--sans);font-size:11.5px}
.rels .tag-new{color:var(--new);font-weight:700}
.rels .tag-ret{color:var(--ret);font-weight:700}
.rels-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:700;margin-bottom:6px}

/* ============================================================
   Use-case scene  (an action + its boxes-and-arrows diagram)
   ============================================================ */
.uc{margin:16px 0 22px;border:1px solid var(--divider);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.uc .uch{display:flex;align-items:center;gap:13px;padding:11px 16px;background:linear-gradient(135deg,var(--p700),var(--p600));color:#fff}
.uc .uch .ucn{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);font-family:var(--mono);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.uc .uch .uctxt{flex:1}
.uc .uch .actor{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--p100);display:block;margin-bottom:1px}
.uc .uch .uct{font-weight:600;font-size:15.5px;font-family:var(--serif)}
.uc .ucsub{padding:9px 16px;font-size:12.5px;color:var(--p800);background:var(--p50);border-bottom:1px solid var(--p100)}
.uc .ucdiag{padding:20px 16px 14px}
.ucnote{padding:2px 16px 14px;font-size:11.5px;color:var(--muted)}
.ucnote b{color:var(--p700);font-family:var(--mono);font-size:10.5px}

/* ============================================================
   Boxes-and-arrows flow
   Robustness rules baked in:
   - .dfg WRAPS (flex-wrap:wrap) so long chains never clip / never
     need horizontal scroll. Arrows reflow with the nodes.
   - .node is a flex COLUMN: the op-badge is an in-flow header row
     (never position:absolute), and .nt / .nf are block-level, so a
     table name and its fields can never smush onto one line.
   ============================================================ */
.dfg{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;margin:0}
.node{flex:0 0 auto;width:156px;background:#fff;border:1.5px solid var(--p300);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.node .op{align-self:flex-start;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid;color:#fff;margin-bottom:2px}
.node .nt{display:block;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--p900);line-height:1.3;overflow-wrap:anywhere}
.node .nf{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.45;word-break:break-word}
.node.created{border-color:var(--new);background:var(--newbg)} .node.created .op{background:var(--new);border-color:var(--new)}
.node.read{border-color:var(--p400);background:#eef4fb} .node.read .op{background:var(--p500);border-color:var(--p500)}
.node.event{border-color:var(--ember);background:#fdf6f0} .node.event .op{background:var(--ember);border-color:var(--ember)}
.node.store{border-style:dashed;border-color:var(--p500);background:#eef3f7} .node.store .op{background:var(--p700);border-color:var(--p700)}
.edge{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;max-width:104px;padding:0 4px}
.edge .el{font-size:9px;color:var(--p600);font-family:var(--mono);text-align:center;line-height:1.3;margin-bottom:2px}
.edge .ar{color:var(--p400);font-size:20px;font-weight:700;line-height:1}

/* ============================================================
   Card grid  (keep / change / drop comparisons)
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.erd{padding:12px}}
.card{background:var(--card);border:1px solid var(--divider);border-radius:9px;padding:14px 16px}
.card.keep{border-top:3px solid var(--new)} .card.change{border-top:3px solid var(--chg)} .card.drop{border-top:3px solid var(--ret)}
.card strong{display:block;margin-bottom:4px;font-size:13.5px}
.card ul{font-size:12.5px;margin:2px 0}

/* ============================================================
   Lifecycle / state machine
   ============================================================ */
.sm{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0}
.sm .s{border:1px solid var(--p300);background:var(--p50);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--p800);font-family:var(--mono)}
.sm .s .who{display:block;font-size:9px;font-family:var(--mono);color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.sm .s.client{border-color:var(--newbd);background:var(--newbg)}
.sm .s.cc{border-color:#f0cba8;background:#fdf6f0}
.sm .s.spec{border-color:var(--chgbd);background:var(--chgbg)}
.sm .a{color:var(--p400);font-weight:700}
/* state-neutral variants (v5.1): terminal-good / terminal-stop / dimmed. The .client/.cc/.spec
   colours mean "whose court" and need a legend if used. */
.sm .s.ok{border-color:var(--newbd);background:var(--newbg);color:var(--new)}
.sm .s.stop{border-color:var(--retbd);background:var(--retbg);color:var(--ret)}
.sm .s.dim{opacity:.6;border-style:dashed}

/* ============================================================
   Use-case catalog — grouped list of candidate use cases
   (a scoped list, NOT a diagram — for "what would we build" inventories)
   ============================================================ */
.catgrp{border:1px solid var(--divider);border-radius:10px;overflow:hidden;margin:14px 0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.catgrp .cath{background:var(--p700);color:#fff;padding:8px 14px;font-family:var(--serif);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
.catgrp .cath .cgl{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}
.uci{display:flex;gap:9px;align-items:baseline;padding:7px 13px;border-top:1px solid #eef1f4;font-size:13px}
.uci .uid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--p600);flex:0 0 26px}
.uci .utxt{flex:1;color:var(--ink);line-height:1.45}
.uci .utxt b{color:var(--p900)}
.uci .star{color:var(--ember);font-weight:700;font-size:12px;flex:0 0 auto;letter-spacing:-1px}
.uci.later{opacity:.66}
.utag{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}
.utag.t-orig{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.utag.t-add{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   Misc: storage strip, cross-reference box
   ============================================================ */
.storage{background:#eef3f7;border:1px dashed var(--p300);border-radius:8px;padding:9px 13px;font-family:var(--mono);font-size:12px;color:var(--p800);margin:12px 0}
.storage b{color:var(--ember)}
.xref{font-size:12px;color:var(--p600);background:var(--p50);border:1px solid var(--p100);border-radius:6px;padding:8px 12px;margin:10px 0}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--divider);color:var(--muted);font-size:12px;font-family:var(--mono)}

/* actor / repo chips (optional, for inline actor tags in prose) */
.rc{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid;vertical-align:middle;white-space:nowrap}
.r-ch{background:#eef4fb;color:#2456a8;border-color:#c3d8f2}
.r-sub{background:#f3eefb;color:#6b3fa0;border-color:#dcccf0}
.r-fa{background:#e9f7f2;color:#0f7a5f;border-color:#bfe8db}
.r-db{background:#eaeef2;color:#2d4559;border-color:#c7d2dd}
.r-store{background:#e6eef3;color:#35526b;border-color:#bcd0dd}
.r-user{background:#eefaf0;color:#15803d;border-color:#bbf7d0}
.r-mcp{background:#fdf0e6;color:#b5590d;border-color:#f2d3b3}

/* ============================================================
   Sequence diagram — swimlane message flow
   A CSS grid: col 1 = step number, then one column per actor lane.
   Each message is a grid item that SPANS grid-columns from its
   source lane to its target lane, so it always sits under the right
   headers and never smushes. Continuous lifelines are grid items
   spanning all rows (grid-row:1/-1) — so set .seq-body's
   grid-template-rows to repeat(STEP_COUNT, auto) for -1 to resolve.
   Wide diagrams scroll inside .seq-scroll, never the page body.
   Direction is an in-flow glyph (.dir ◂/▸) pushed to the target edge
   by justify-content:space-between — never position:absolute.
   ============================================================ */
.seq-scroll{overflow-x:auto;margin:16px 0;border:1px solid var(--divider);border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.seq{min-width:840px}
.seq-head,.seq-body{display:grid;grid-template-columns:30px repeat(6,minmax(104px,1fr))}
.seq-head{background:linear-gradient(135deg,var(--p800),var(--p700));padding:11px 12px}
.seq-h{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 4px}
.seq-h .role{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--p200)}
.seq-h .who{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:6px;padding:3px 9px}
.seq-body{position:relative;row-gap:11px;padding:16px 12px 20px}
.seq-life{width:2px;background:var(--p100);justify-self:center;border-radius:2px;z-index:0}
.seq-num{grid-column:1;justify-self:center;align-self:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--p600);min-width:19px;height:19px;padding:0 3px;border-radius:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.seq-msg{align-self:center;display:flex;flex-direction:row;align-items:center;gap:8px;justify-content:space-between;background:#fff;border:1.5px solid var(--p300);border-radius:7px;padding:5px 10px;z-index:1;min-width:0}
.seq-msg .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.seq-msg .m{font-family:var(--mono);font-size:10.5px;color:var(--p900);font-weight:700;line-height:1.32;word-break:break-word}
.seq-msg .m2{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.3;word-break:break-word}
.seq-msg .dir{font-size:14px;font-weight:700;color:var(--p500);flex:0 0 auto}
.seq-msg.write{border-color:var(--new);background:var(--newbg)} .seq-msg.write .dir{color:var(--new)}
.seq-msg.event{border-color:var(--ember);background:#fdf6f0} .seq-msg.event .dir{color:var(--ember)}
.seq-msg.ret{border-style:dashed;background:#f6f9fb} .seq-msg.ret .m{font-weight:500;color:var(--p600)}
.seq-msg.self{border-style:dashed;border-color:var(--p400);background:#eef3f7}
.seq-foot{display:flex;flex-wrap:wrap;gap:8px 15px;padding:9px 14px;border-top:1px solid var(--divider);background:#fbfcfd;font-size:10.5px;font-family:var(--mono);color:var(--muted);align-items:center}
.seq-foot .sw{display:inline-block;width:20px;height:11px;border-radius:3px;border:1.5px solid var(--p300);vertical-align:middle;margin-right:5px}
.seq-foot .sw.write{border-color:var(--new);background:var(--newbg)} .seq-foot .sw.event{border-color:var(--ember);background:#fdf6f0}
.seq-foot .sw.ret{border-style:dashed;background:#f6f9fb} .seq-foot .sw.self{border-style:dashed;border-color:var(--p400);background:#eef3f7}

/* ============================================================
   Data table — for step→entity maps and any tabular spec content.
   Wrap in .spectable-scroll so wide tables scroll, not the page.
   ============================================================ */
.spectable-scroll{overflow-x:auto;margin:14px 0}
.spectable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--divider);border-radius:10px;overflow:hidden}

## 1. Problem

### 1.1 What this is for

One sentence: **upload a site plan PDF to Cartographer, run `extract-geometry-v2`, run `anchor-geometry`, and see the result on the map** — with no SIR, no project, and no plan set anywhere in the loop.

That is north star §7's manual path, stated there as a design constraint rather than a feature: *"it must be possible to upload a loose PDF into Cartographer, carry it as far down the pipeline as the data allows, and see an anchored geometry on a map."* It is P2a (the anchoring target) and P2b (the manual path end-to-end).

### 1.2 The file this is specified against

Everything below is verified against one real file already in prod.

`cartographer_files.cc2e3a53-db9b-493f-b270-e9039b03284c` — `White Water Express Car Wash 071326.pdf`, 30 pages, 30,727,110 bytes, `status: processed`, `project_id: null`, `source_sir_artifact_id: null`, `content_sha256: ee1c0b6b…`. Autodesk Civil 3D 2021 vector output, 2592 × 1728 pt sheets.

So this file is **rung 3, `fitToRing`**. Rungs 1 and 2 are unavailable by construction. For rung 3 the county ring *is* the anchor, which is why §1.4 is about sourcing a ring and not only an EPSG code.

### 1.3 Why it cannot run today

The project this file belongs to (`project.7a697ef1-733f-4d3b-87e6-9cce995d8f1e`, *WhiteWater Express Car Wash - 78747*, `jurisdiction_slug: austin`) has **no `site_intelligence_report` row and no `geo` rows at all**. The only `workflow_runs` row for it is a completeness check (`116d55ac`, `submissionVersionId: 6688de93-71ba-4827-8092-8ec61d92c8b1`).

Three couplings stop the run, and they are of different difficulty:

| | Where | What the SIR supplies |

| **C-a** | `bureau/runbooks/anchor-geometry/steps/1.1-inputs/contract.test.ts:13` — `sir_id: z.string().uuid()` | the request will not validate without one |
| **C-b** | `cartographer/runbooks/anchor-geometry/scripts/fetch.ts:126` → `:144` | the **target CRS**, as the modal `srid_local` of the SIR's `county_api` parcel rows |
| **C-c** | `fetch.ts:152-156` → `:161` | the **fitting target**, as `sir_geo_in_srid(sir, srid)` → `inputs/parcels.json` |
| **C-d** | `publish.ts:119`, `geo_helpers.sql:326-328` and `:434-436` | the **output destination** — `cartographer_anchors.sir_id` is `NOT NULL`, `geo.sir_id` is `NOT NULL`, and both delete-keys are `(sir_id, properties->>'anchor_id')` |
| **C-e** | `cartographer/src/routes/anchored/+page.server.ts:67,92-93,106` | the **viewer** loops `sirIds` and calls `sir_parcels(p_sir)` per SIR |

**C-b already has an escape hatch that ships.** `target_srid` is optional on the request (`contract.test.ts:15`), passed through by `fetch.py:45-47`, and takes precedence at `fetch.ts:116-121` with `source: 'flag'`. It exists because SIRs researched before bureau#1812 have no `srid_local`.

But it does **not** remove the SIR. `sirId` is required unconditionally at `fetch.ts:46-48`, and `sir_geo_in_srid` is called unconditionally at `:152` *even when `target_srid` was supplied*. On White Water today, `target_srid: 2277` gets past `:144` and dies at `:161`: `SIR … has no geo rows; the anchor run needs at least the county parcel`.

### 1.4 The ring is the work, and it is already solved for SIRs

The one anchor run in existence, `cartographer_anchors.e94fae93-b3b6-42e5-9a24-fd16c476bee1` (car-wash plat, Jefferson County KY, target 3089, accepted 2026-09-28), is a **rung-1 `printed_coordinates`** anchor, class `survey`: the frame was placed from the plat's own coordinate boxes, and its two ring correspondences were targets for the metrics, not the thing it was fitted to. Those targets were two ordinary `county_api` rows:

| geo id | label | method | `source_doc` | area ft² |
|---|---|---|---|---|
| `71fd4e9f-d710-49b0-8235-e8b8117202a7` | 4401 Fegenbush Ln | `county_api` | `parcel-rings.geojson` | 44,558 |
| `22824c2a-fe7a-49c2-a042-4b4d4c81d4a2` | 4403 Fegenbush Ln | `county_api` | `parcel-rings.geojson` | 113,595 |

Those were written by `sir_add_parcel_geo` (`geo_helpers.sql:143`) at SIR publish, from the county ArcGIS fetch `site-research` had already staged. **The ring came from the county. The SIR was only the row it hung off.** So the *sourcing* pattern this spec needs is not new — it is the existing pattern with the owner removed.

What *is* new is the solver rung. `fitToRing` (rung 3) has never run end to end on real data: the one prod anchor is rung 1, and White Water cannot be anything but rung 3 (§1.2). §5 step 3 is therefore a first, not a regression test, and should be read that way.

Two findings from reading that run, both of which this spec acts on:

- **"8 figures, 1 anchor" verifies.** The plat had 8 figures and the SIR had only 2 county rings. LOT 2 (44,546 extracted) fitted 4401; LOT 3 (113,595) fitted 4403; the remaining six — LOT 1 at 168,282 ft², three ROW dedications, two easements — had **no target at all** and rode the frame's transform. North star §4.4 confirmed against real data.
- **`cartographer_anchors.target_geo_ids` already dangles.** It lists three ids; only two exist. `68ca747d-fc39-41a7-9187-5c54b093fa06` is gone from `geo`. It is a bare `uuid[]` with no foreign key and it has already rotted on the only anchor run we have. §3.6 gives it a job; **Q7** asks whether to constrain it.

The ring's edges against the plat's courses:

One more measured fact: `project.site_outline` for this project is **vertex-identical to that live fetch** — same seven points to ≤ 1.8 × 10⁻⁹ degrees, wound the opposite way. So the parcel is already resolved and already in the database, despite there being no SIR and no site-research run. What `site_outline` lacks is everything but the shape: no `parcel_id`, no legal description, no `native_geometry`, no `native_sr`. See **D10**'s rejected alternatives for why that is not good enough to build a `county_api` row from.

**Where the point came from, and what else finds the parcel (v1.2).** The `--lat --lon` above were the project's `site_address` geocoded by hand — nothing a loose file carries. A parcel layer answers a point query or an attribute query and never an address, so the routes that start from the plan set's own text were measured too (2026-10-14):

| route | input off the plan set | result |
|---|---|---|
| legal description → `arcgis_query.py where` on `…/AppraisalDistricts/MapServer/8` (OmniParcel, which has `LEGAL_DESCRIPTION`; layer 0 has only `PID_10`/`PROP_ID`) | `LOT 1 … LENOX SPRINGS SECTION III` (page 1, line 150) | 4 Lenox Springs rows, exactly one `SEC III`: `PARCEL_NUMBER 0436110202` — the same PID the point query returned |

The plat's legal description is the parcel's own name in the county's table and needs no geocoder; the address needs a locator the jurisdiction happens to publish; the one free national geocoder fails on precisely the new-plat case this spec is built for. That ordering is **D10a**.

### 1.6 Scope

**In:** making `anchor-geometry` run on a `cartographer_files` row that nothing owns, resolving the target SRID without an operator typing it, sourcing and persisting the fitting target, making `geo` and `cartographer_anchors` accept no owner or an optional one, and making `/anchored` draw the result.

**Out, deliberately:**

- **The sheet-linework reader.** Reading the *drawn* geometry off a vector plan sheet — tracing the dashed property line with `plan_vectors.py`, solving page-pixels → State Plane, and placing the building, pond, curbs and mains — is north star §6 / **P5**. It is where the value is on a plan set (metes-and-bounds prose gives you the boundary and, by construction, nothing else), and it looks tractable: on sheet 12 the heavy dashed property line merges across its 28 dashes into one run of **3475.00 px**, which at 300 dpi is **231.67 ft** against the plat's 231.66, and **15.0004 px/ft** — exactly 1″=20′, self-confirming. None of that is in this spec. §6 names only the seams it must not foreclose.
- Schema elegance. Duplicating an RPC is preferred to generalising one where generalising costs a migration on 56 live rows.
- Any change to `anchor.ts`, to `extract-geometry-v2`, or to steps 2.1, 3.1, 3.2, 3.3 and 4.1 of `anchor-geometry` — **five of nine steps are untouched**, because none of them has a SIR concept and they only read `inputs/parcels.json`, whose shape does not change.
- Backfilling the 56 existing `geo` rows to a new ownership model. All 56 derive a `project_id` cleanly (31 SIRs → 31 projects, 1:1, zero orphans) if that is ever wanted; **Q8**.

## 2. Decisions

### 2.1 Ownership

**D1. `geo.sir_id` becomes nullable, and `geo` gains a nullable `submission_version_id` and a nullable `file_id`.** A `geo` row may be owned by a SIR (today's rows, unchanged), by a site-plan submission version, or by **nothing**. Nothing is a first-class case — it is what a loose PDF produces, and it is the case this spec exists to serve.

Ownership and provenance are different questions *(v1.4)*. `sir_id` and `submission_version_id` say **who the row belongs to**; `file_id` → `cartographer_files` says **what produced it**, and every row the anchor runbook writes — the fitted lot and the county ring alike — traces to one file whether or not anyone owns that file. Today provenance is recorded as the string `source_doc = 'cartographer:' || file_id`; the column replaces the parse, and `source_doc` stays as the human-readable note. County rings site-research writes at SIR time keep `file_id` null, since no Cartographer file was involved.

| column | meaning | on a loose file |
|---|---|---|
| `sir_id` | owned by a SIR | null |
| `submission_version_id` | owned by a plan-set submission | null |
| `file_id` | produced from this Cartographer file | set |

`submission_version` is the right grain: for White Water, `submission_version.6688de93-71ba-4827-8092-8ec61d92c8b1` → `submission.38ddbfd8` → `project.7a697ef1`, and `plan_set_version.6b4c9887.submission_version_id = 6688de93`, so the join to the plan set already exists and nothing new is needed to reach the project.

There are **no RLS policies on `geo`, `cartographer_files`, `cartographer_geometries` or `cartographer_anchors`** (verified: `pg_policies` returns zero rows for all four), so this is a column change, not a policy rewrite.

**D2. `cartographer_anchors` takes the same treatment** — `sir_id` nullable, new nullable `submission_version_id`.

**D3. The run request's owner fields are all optional.** `1.1-inputs`'s `Request` becomes `{file, anchor_run_slug?, scope_note?, target_srid?, site_point?, sir_id?, submission_version_id?}`. The only required field is `file`. A request naming both owners is accepted (**Q2** asks whether to forbid it). `site_point` is `{lat, lon}` (WGS84), the operator's override for *where the parcel is* (D10a), the sibling of `target_srid`'s override for *which grid*; it is ignored on the SIR path, where the SIR's rows are the target.

### 2.2 Resolving the target SRID

**D4. The ladder is: the request, then the ring, then the county table, then stop.**

1. `request.target_srid` — the existing operator override (`contract.test.ts:15` → `fetch.py:45` → `fetch.ts:116`), unchanged, always wins.
2. **The fetched ring's native spatial reference** (D5). The parcel is found first (D10a); the layer returns `native_sr` with the feature. When it is projected, that is the target.
3. **The county table** (D6), only when the layer is published geographic: the county *by name* from the plat's prose → `spcs_lookup --state --county` → EPSG + unit.
4. **Fail fast** (D8). There is no silent fallback.

In every derived case the plat's own zone must agree with the result (D7).

**D5. The ring brings its own coordinate system.** §1.5's fetch returned `native_sr {wkid: 102739, latestWkid: 2277, projected: true, source: "layer"}` with the feature. `arcgis_query.py` already reports it, `sir_add_parcel_geo` already stores it as `srid_local`, and the SIR path's target CRS (C-b) is nothing but the modal `srid_local` of those rows. So the loose-file path derives the target the way the SIR path already does, from the layer rather than from the SIR's copy of the layer. No county id is involved. The v1.2 alternative — a county → zone table — was itself reconciled against this layer (its Travis row's note says so), so the table agreeing with the ring was partly the layer agreeing with itself.

**D6. The county is a name, used for two things: finding the layer, and the fallback.** It is read from page 1's prose — `line 150: … PUBLIC RECORDS TRAVIS COUNTY, TEXAS.` — which every recorded plat carries in its recording reference and certification block. `spcs_lookup.py --state TX --county Travis` already accepts a name; nothing needs a FIPS.

- *Finding the layer.* **Surveyor is the registry** *(v1.5; v1.3 said it could not be)*. Every source module carries `src/sources/<module>/layer-identity.json` — service URL, layer id, name and `native_sr` per layer — and `src/lib/source-tools.ts` already resolves a jurisdiction slug to its modules by loading `jurisdictions/<slug>.md`. For Austin, `coa-gis` pins TCAD Parcels at `Shared/AppraisalDistricts/MapServer/0` in 2277, the layer §1.5 measured, and `travis-county-gis` pins `DBO.Parcels`, also 2277. Across the repo: 177 modules, 95 with a parcel layer, 59 of those in a State Plane code and 36 in Web Mercator or unrecorded (the D6 fallback is therefore a third of jurisdictions, not a corner case). Two things are missing and both are small: a **`role` tag** on a layer entry (`parcels` · `legal_description` · `locator`), since today "the parcel layer" is a naming convention in the `note` field; and a **county-name → slug** convention (`TRAVIS COUNTY, TEXAS` → `travis-county-tx`, with the city module preferred when the plat's title block names one). The fetch reads the module's `parcels` entry and takes the ring and its `native_sr` from there. Nothing is built twice.
- *The precondition.* **This runbook runs only on a jurisdiction prospector has trained into surveyor tools.** A county name with no module is a D8 stop that says so; it is not a fallback to a request field or a constant. That is the same boundary site-research already lives inside.
- *The fallback.* When the ring layer is published geographic (4326) or in Web Mercator, `native_sr` names no State Plane and the county table is the only source: `spcs_lookup.py --state TX --county Travis` → `{"epsg":2277,"units":"ftUS","zone":"tx_central","basis":"ngs_zone"}`. Stdlib, zero network, already in bureau. This is the only case where the county matters for the SRID.

The FIRM panel number is **not read**. Its only advantage was a FIPS without a name lookup, which nothing needs; its costs are real — community-based panels carry a community id in the FIPS slot, panels get cited without their prefix, and flood notes are common on site plans but absent from a bare recorded plat, which is P2b's input.

**D7. The plat's zone is the check, not the source — no new vision call.** `extract-geometry-v2` already captured `basis_of_bearings` (§1.2), and `fetch.ts` already reads it into `inputs/README.md`; re-reading the PDF is not an option because **page 2 has 641 non-whitespace characters in its text layer** (the plat's lettering is vector outlines). A new reverse index in `spcs_lookup.py` maps a zone name and datum to the **set** of its codes — `("TEXAS CENTRAL ZONE", "NAD 83") → {2277 (ftUS), 32139 (m)}` — and the derived code must be a member. The set, not a code, because the bearing-basis note never states a unit (*"COORDINATES AND DISTANCES ARE SURFACE VALUES. COMBINED SCALE FACTOR IS 1.0000327271."*), which is why `distance_units` is `null` on the extracted row; the unit comes with the layer's code, so the ambiguity never has to be resolved by the plat. The check is recorded as a computed claim (D17) in three states: `agrees`, `disagrees` (a D8 stop), or `unavailable` when `basis_of_bearings.kind` is `assumed` or `deed` — the run proceeds in that case, since the ring's system is authoritative and `fitToRing` solves the rotation anyway, and the readout at `4.1` shows that no check was possible.

**D8. Disagreement is a hard stop.** The run parks at `1.2-fetch` with a message naming the readings and the fix (`target_srid` in `request.json`). The cases:

- the ring's code is projected but **not in the plat zone's set** — the plat says Texas Central and the layer stores 2278 South Central: the registry entry points at the wrong layer, or the parcel found is in the wrong county;
- the plat names a zone the reverse index does not know — a **low-distortion or county projection**, increasingly common on Texas plats — so the check cannot run and the plat's grid is not the layer's;
- the layer is geographic and `spcs_lookup` has no row for the county (split between zones, `_about.unassigned`), or page 1 names no county, or more than one (**Q6**);
- the PDF is a scan with no page-1 text layer and no `site_point` was given (a D10a stop).

A wrong SRID does not fail loudly. It produces a plausible similarity transform onto the wrong grid, and `fitToRing` will cheerfully report an IoU for it. The escape hatch already exists and costs the operator one number.

**How the stop is delivered.** "Parks" has one mechanism in conductor2 and it is not the script's exit code: *a step is parked when its contract exits 75 after the step wrote `BLOCKED.md`* (conductor2 README, "Exit 75 from a contract"; the pattern is in `bureau/runbooks/lib/contract-helpers.ts:764-787`). Today `fetch.py`'s no-target path is `sys.exit(message)` — exit 1, a **failed** step that `advance` will not retry and `status` shows as an error, not as `waiting`. So:

1. `fetch.ts` exits 3 (its existing `NO_TARGET` code) for every D8 case and prints a one-line reason and the fix to stderr, as it does now.
2. `fetch.py` catches 3, writes `fetch.log` as today **and** `BLOCKED.md` — the readings, the case, and the exact `request.json` key to set (`target_srid`, or `site_point` for a D10a stop) — then exits 0.
3. `1.2-fetch/contract.test.ts` answers 75 when `BLOCKED.md` exists and `ws/inputs/target.json` does not, so the pass ends `waiting`, `status` names the step with `BLOCKED.md` as its readout, and editing `request.json` and advancing relaunches the step cold.

The same path carries the D10a stops. Nothing here is new machinery: it is site-research's `1-resolve-site` browser-gone pattern applied to a script step.

**D9. `grid_or_surface` and `combined_scale_factor` stay in the solve — this is already the case; do not break it.** The plat's distances are **surface**; the target grid is not. `frames.ts:230-233` (`frameScaleFactor`) already lifts `combined_scale_factor` off every `surface` figure in a frame and hands it to `anchor.ts` as `statedScaleFactor` (`frames.ts:353` → `anchor.ts:683`), and on this file it is `1.0000327271`. Nothing in this spec touches that path; D9 exists so that the D4–D8 rewrite of `fetch.ts` does not drop the two fields from `inputs/geometries.json` on the way through. Discarding the factor would put the ring out by ~33 ppm (0.0076 ft on the 231.66 ft course) — negligible on a 1-acre lot, and exactly the class of thing that silently poisons a fit at scale.

### 2.3 Sourcing the fitting target

**D10. `1.2-fetch` fetches the county ring live and writes it into `geo` as a `county_api` row before solving.** This is the pattern that already runs (§1.4), with the owner removed. The write happens **before the `4.1` gate**, and a rejected fit leaves the ring in place, on purpose *(v1.4)*: the ring is true regardless of the fit, the viewer needs it to judge the overlay, and a re-run finds it by its key (D11) rather than writing it again. Concretely: find the parcel (D10a), fetch it with `arcgis_query.py … --geometry --native-ring`, then an RPC that is `sir_add_parcel_geo` with the ownership changed, then `fetch.ts` reads the row back and builds `inputs/parcels.json` exactly as it does today.

**D10a. Finding the parcel is a ladder, and the ladder ends in an area gate.** It runs **before** the target SRID exists, because the ring is where the SRID comes from (D5). The solver never needs a lat/lon; only the fetch does, and a loose file carries none (§1.5). The layer to query is the registry entry (Q3) for the county named in the prose (D6). The rungs, first match wins:

1. **`request.site_point`** (D3) → `arcgis_query.py point <layer> --lat --lon`. The operator override; always wins when present. This alone makes S1 runnable.
2. **The plat's legal description** → `arcgis_query.py where <layer> --where "<legal-description field> LIKE …"`. The page-1 reader (§3 item 4) already has the text layer open for the county name; it takes the lot/block/subdivision line beside it (`LOTS 1 OF LENOX SPRINGS SECTION III`). The query must return **exactly one** feature after section/phase disambiguation — on White Water, four Lenox Springs rows, one `SEC III`. This is the primary derived rung because it is the parcel's own name in the county's table, needs no geocoder, and is the thing a plat cannot omit.
3. **The address** → a locator → point → rung 1's query. Only when the jurisdiction publishes one (`Geocode/COA_Locator` for Austin). Never a national geocoder as the sole source: Census returns nothing for this 2021 plat.
4. **Stop** (D8's mechanism), naming what was read and the fix: `site_point` in `request.json`.

**The gate.** Whatever rung found the feature, `fetch.ts` compares the fetched ring's native area with the figure's `stated_area_sqft` (or `computed_area_sqft` when none is stated) and stops when they differ by more than the **Q12** tolerance. On White Water that is 43,557.77 vs 43,560. A rung-2 string match on the wrong section, or a rung-1 point in the neighbour's lot, fails here rather than producing a confident fit to the wrong parcel — the same reasoning as D8's "a wrong SRID does not fail loudly".

Each rung is a §2.5 claim: rung 2 is a **read** (page 1, bbox, verbatim, `basis: "legal_description"`); rungs 1 and 3 are **computed** (`{kind: "fetched", url, where | point, feature_count, pid, native_sr}`); the gate is a computed claim with both areas. The fetched claim's `native_sr` is also the D5 SRID source, so one claim serves both ladders.

Rung 2 is available only where the module records a `legal_description` layer *(v1.5)*. TCAD's geometry layer (`MapServer/0`) has only `PID_10` and `PROP_ID`; its sibling `MapServer/8` (OmniParcel) carries `LEGAL_DESCRIPTION`, and today only two of 177 modules record such a layer — Austin's does not. So Austin's `coa-gis` gets the entry by hand (§3 item 4b) and rung 2 lights up per jurisdiction as prospector records the layer; where it is absent the ladder skips to rung 3.

Three consequences, all wanted:

- `inputs/parcels.json` keeps its shape, so **`2.1-correspond` needs no changes** — it still reads `properties.legal_desc`, per-feature rings, and the county's own ids to make and quote its claims.
- `cartographer_anchors.target_geo_ids` points at real rows, which is what D11 needs.
- The project ends up with its county parcel ring in `geo`, which is `geo`'s dominant row type anyway (46 of 56).

Rejected alternatives:

- **Transient fetch** (no `geo` write): `target_geo_ids` would go empty and the viewer's context layer would be empty, so you would see an anchored lot floating on the aerial with nothing to judge it against — which is the entire point of looking at it on a map.
- **Promote `project.site_outline`**: zero network and present for 57 of 59 projects, but it is a collected, deduped geometry with no parcel id, no legal description, no `native_geometry` and no `native_sr`. `geom_local` would become a reprojection rather than the county's own digitisation — the exact distinction `sir_add_parcel_geo` goes to trouble to preserve (it Hausdorff-checks the native ring against the WGS84 one in a 50 m two-sided containment test before trusting it, `geo_helpers.sql` ~:190-215). Throwing that away to save one HTTP call is the wrong trade on the table that is meant to become the derived spatial layer. It also breaks correspond's evidence.

**D11. The idempotency key for an unowned `county_api` row is the cartographer file.**

Today's key (`geo_helpers.sql:172-175`) is:

```sql
where sir_id = p_sir and kind = p_kind
  and method = 'county_api' and label is not distinct from p_label
```

With `p_sir` NULL this is a **never-match**, not a wrong-match: `sir_id = NULL` is NULL, so the lookup finds nothing and always inserts. Run the anchor runbook twice on the same loose PDF and you get two county rings, then three, and `/anchored`'s context layer accumulates duplicates. The naive repair (`sir_id is not distinct from p_sir`) is worse — it makes every unowned county row collide with every *other* unowned county row sharing a kind and label, across unrelated sites.

So the new RPC keys on `(file_id, kind, label, method='county_api')`, with `file_id` the D1 column *(v1.4; v1.2 parsed it out of `source_doc`)*. It is stable across re-runs of both runbooks, and it makes "this file's county context" a single well-defined set regardless of whether anything owns it.

### 2.4 Publishing and the map

**D12. The delete-key for an anchor's rows becomes `properties->>'anchor_id'` alone.** It appears twice — `sir_put_anchored_geo` (`geo_helpers.sql:326-328`) and the reject path of `cartographer_anchor_decide` (`:434-436`) — and both are currently `(sir_id, anchor_id)`. `anchor_id` is already sufficient and unique; the `sir_id` conjunct is redundant today and wrong once `sir_id` is nullable. This is the one place where the decoupling makes the schema simpler rather than wider. The property gets an expression index, `create index on geo ((properties->>'anchor_id'))`, in the same migration *(v1.4)*: the old key used the indexed `sir_id` column, the new one must not fall back to a scan.

**D13. `/anchored` finds its context through the owner when there is one, and through the anchor when there is not.**

```
figures = geo WHERE properties->>'anchor_id' = anchor.id      -- unchanged (+page.server.ts:139)
context = anchor.sir_id IS NOT NULL                           -- v1.4
          ? sir_parcels(anchor.sir_id)                        -- the SIR path, unchanged
          : geo WHERE id = ANY(anchor.target_geo_ids)         -- the loose-file path
```

The SIR path is unchanged *(v1.4; v1.2 read `target_geo_ids` for both)*: on the car-wash SIR the full parcel set includes the neighbouring parcels and two `estimated` rows that are not anchor targets, and losing them from the map would be a regression for the case that already works. The loose-file branch works with zero owners and gives `target_geo_ids` its first real job; its integrity stays as it is for now (**Q7**). The SIR rail subtitle (`+page.server.ts:71`) becomes optional rather than per-anchor-required.

**D14. The `4.1-hitl` gate is unchanged.** It exists so a fit cannot publish itself. Even on the near-perfect car-wash run `auto_accept_suggested` was `false`, because of the C5 union-outline metric bug (north star **P0c** / winston#289 B3), so the gate is still the only real check. Removing it is a separate decision that depends on P0c.

### 2.5 Showing the work

`/processed` → `/geometry/[id]` gives an extracted figure a real evidence trail: every course, the stated area, the basis of bearings and the scale factor each carry a **verbatim**, a **page**, a **box**, a **crop** and a prose **grounds**, rendered over the source PDF. An anchor has nothing equivalent — `/anchored` is a flat list whose only link is to the file (`anchored/+page.svelte:183`). D4–D10 make that worse before they make it better: the run now *derives* its coordinate system instead of being handed one, and a derivation you cannot inspect is a guess with better manners.

**D15. Every fact the anchor run uses to place a frame is recorded as a claim**, and a claim is one of three kinds: **cited** (an evidence row the extract run already proved), **read** (something this run read off the PDF), or **computed** (a lookup or a fetch, with no page at all).

**D16. Cited claims are referenced by id, never copied.** The three facts D4–D9 depend on already exist on the White Water figure, with crops and grounds:

| role | verbatim | page | crop |
|---|---|---|---|
| `basis_of_bearings` | "HORIZONTAL DATUM BASED ON THE TEXAS STATE PLANE COORDINATE SYSTEM, NAD 83, TEXAS CENTRAL ZONE." | 2 | `6e77e887…jpg` |
| `scale_factor` | "COORDINATES AND DISTANCES ARE SURFACE VALUES." | 2 | `6e77e887…jpg` |
| `scale_factor` | "COMBINED SCALE FACTOR IS 1.0000327271." | 2 | `1cea8d28…jpg` |

Their `confidence.grounds` are already doing the argument's work and must be surfaced verbatim, because each names the exact limit this spec works around: the basis-of-bearings row says *"no zone number or datum realization is printed"* (which is why the ring, not the plat, is the SRID source — D5, D7), and the scale-factor row says *"the note does not say whether the factor takes grid to surface or surface to grid"* (which is a live caveat on D9, and should be shown next to the applied factor rather than buried).

So the anchor stores `{kind: "cited", evidence_id}` and the page renders that row's verbatim, grounds and crop. No new evidence machinery, no duplication of a reading, and the trail stays single-sourced — if a re-extraction corrects the note, the anchor page corrects with it.

**D17. Read and computed claims carry what they can, and are honest about what they cannot.**

- **read** — the county, off page 1's text layer (D6): `{kind: "read", value: {county: "Travis", state: "TX"}, page: 1, bbox, verbatim: "PUBLIC RECORDS TRAVIS COUNTY, TEXAS", basis: "recording_reference"}`, and the legal description for D10a rung 2. `pdftotext -bbox` gives the box, so these render **in situ** over page 1 — `PdfPageOverlay` takes normalized `[x0,y0,x1,y1]` fractions plus a `kind` for colour and needs no stored crop image. A stored crop stays optional (**Q10**).
- **computed** — the fetch and the check have no page and must not pretend to: `{kind: "fetched", url, where | point, pid: "0436110202", native_sr: {wkid: 102739, latestWkid: 2277, projected: true}, feature_count: 1, fetched_at}` is the SRID source (D5); `{kind: "computed", tool: "spcs_lookup.py --zone", input: {zone: "TEXAS CENTRAL ZONE", datum: "NAD 83"}, output: [2277, 32139], check: "agrees"}` is the D7 check; and, only when the fallback ran, `{kind: "computed", tool: "spcs_lookup.py", input: {state: "TX", county: "Travis"}, output: {epsg: 2277, units: "ftUS", zone: "tx_central"}, table_note: "…"}`. The page renders these as a request and a lookup, not as a reading.

The chain the page must make legible, end to end, is: *the plat says Texas Central / NAD 83 but prints no zone number and no unit* → *the plat's recording reference says Travis County, which picks the TCAD layer* → *the TCAD layer stores its parcels in 2277* → *2277 is a Texas Central code, so the plat agrees* → *no operator input was needed*.

**D18. The derivation record travels the path `correspondences.json` already takes.** `1.2-fetch` writes it into `inputs/target.json`; `5.1-publish` carries it into `cartographer_anchors.evidence.derivation`, beside the `correspondences` key `publish.ts` already assembles. No new table.

**D19. `/anchored`'s tile gains a link to a new `/anchor/[id]`**, mirroring `/processed` → `/geometry/[id]` (`processed/+page.svelte:420`), which is the prior art for the whole page — signed PDF, box overlay, a rail of claims, four queries and no joins.

**D20. The page reads in four sections, in this order.**

1. **How we got the system** — the D15 claim chain ending in EPSG 2277, each claim showing its kind, and the cited ones showing their crop and grounds. This is the section that did not exist before and the reason for the whole item.
2. **What we fitted to** — the ring fetch, and the correspondences. `evidence.correspondences` **already** stores the agent's prose justification per ring match and it has never been rendered: *"plat label 'LOT 2' = county parcel '4401 Fegenbush Ln' (PVA parcel_id 061801400000, role 'subject-vacant-pad'), whose PVA acres 1.023 equal both the plat's stated LOT 2 area and the SIR's own 'Lot 2' row"*.
3. **The solve** — rung and accuracy class, `params` (θ, scale, tE, tN, k_units), the residual table, the metrics, and the overlay PNG from `evidence.overlay_path`. `metrics.notes` already carries a prose reason per *unmatched* figure — *"'RIGHT-OF-WAY DEDICATION AREA 1' is a strip dedicated to the public road out of the lots' frontage; the SIR carries no right-of-way row … It rides on the frame through its own printed coordinate boxes"* — which is the clearest explanation of "8 figures, 1 anchor" we have and is currently invisible.
4. **The result** — the map, as `/anchored` draws it today.

Sections 2 and 3 are **almost entirely rendering data that already exists and is thrown away**: on the one anchor run in prod, `evidence` holds `correspondences`, `constraints_used`, `overlay_path`, `check_md` and `decision_note`, and `metrics` holds 28 control-point residuals, five prose notes, IoU, Hausdorff, area ratio, free scale and θ-vs-grid. The only genuinely new recording is §2.5's derivation.

One gap worth naming: **`evidence.check_md` is null on that run**, so the `3.3-check` vision readout — the step whose entire job is to say whether the overlay looks right — reached the database empty. Whether that is a publish bug or a step that wrote nothing is **Q11**.

## 5. Acceptance

Upload `White Water Express Car Wash 071326.pdf` to Cartographer as a loose file — **no project, no SIR, no plan set**. Run `extract-geometry-v2`. Run `anchor-geometry` with a request carrying only `{file, anchor_run_slug}`.

1. `1.2-fetch` reads **Travis County, Texas** off page 1, picks the TCAD layer, finds the parcel from the plat's **legal description** (D10a rung 2, no `site_point` in the request), fetches the ring (PID `0436110202`, `native_sr` 2277), passes the area gate (43,557.77 vs 43,560), and writes **one** `county_api` `geo` row with no owner.
2. It resolves **EPSG 2277** on its own from that ring, `source: "derived"`, with `fetch.log` naming the check: `basis_of_bearings` "TEXAS CENTRAL ZONE / NAD 83" → {2277, 32139}, agrees. No FIPS, no FIRM panel, no county table.
3. `3.1-solve` fits LOT 1 by `ring_fit` / `gis_fit`, with the stated surface scale factor applied. **This is `fitToRing`'s first run on real data** (§1.4); the near-exact TCAD ring (§1.5) is the easiest case it will ever get, so an IoU below ~0.99 here is a solver finding, not a data finding.
4. `/anchored` draws the anchored lot in marine over the county ring in amber.
5. **Re-running the whole thing produces one county row, not two.**

A deliberate negative: run it again with `target_srid: 32139` in the request and it must solve in metres and produce a visibly wrong result — the override has to still be an override. A second one for D8's mechanism: a file whose page 1 has no text layer (or a registry entry pointed at a layer whose code is not in the plat zone's set) must leave the run **`waiting`** at `1.2-fetch` with `BLOCKED.md` naming the fix, not **failed**; setting `site_point` (or `target_srid`) and advancing must relaunch the step and go through. A third, for D7: the same file with its `basis_of_bearings.kind` edited to `assumed` must **not** park — it proceeds, and the `4.1` readout shows the zone check as unavailable.

## 6. Seams this must not foreclose

Named only so the decoupling does not harden against north star **P5**. None is addressed here.

1. **Frame identity.** `frame_key` is per-document today (`frame-1` for all of White Water). A plan set has ~14 plan-view sheets, each its own viewport — on sheets 7 and 12 the same property line sits at different page coordinates — so a sheet reader needs one frame per sheet. Nothing links a frame to `sheet_version`. Do not make `frame_key` *mean* "document".
2. **Fixed scale.** `anchor.ts` fixes `s` at 1 or the stated combined factor, which is right for courses already in feet and wrong for page pixels. `freeScale` is already computed and reported but never applied.
3. **Units.** `DistanceUnits = ft | ftUS | varas | m` has no page-pixel member.
4. **Polygon-only.** `cartographer_geometries.polygon` is `{rings}` and `sir_put_anchored_geo` rejects anything not (Multi)Polygon after `ST_MakeValid`. Hydrants are points; mains and curbs are lines.
5. **Reading model.** `mete.courses` + `misclosure_feet` has no meaning for a traced polyline.
6. **Correspondence vocabulary.** `2.1-correspond` claims ring matches, vertex ties, edge ties and control points; a sheet's natural claims are "this run is the property line" and "this is the scale bar and it reads 20 ft".
7. **Posture.** `geo.method` ∈ `county_api | anchored | estimated` has no *recorded vs proposed* axis, and north star §1.3's headline use case measures between the two.
8. **Provenance.** `geo.file_id` names the file; a sheet reader wants the sheet. D1's `file_id` and `submission_version_id` are the first steps toward that.

## 7. Open questions

**Q1.** Does the new parcel RPC get a fresh name (`add_parcel_geo`) alongside `sir_add_parcel_geo`, or does `sir_add_parcel_geo` gain nullable owner params and keep its name? Duplication is cheap and explicitly acceptable; a rename touches `cityhall/src/lib/publish/sir.ts:382` (the repo is `noetic-inc/cityhall`; `cityhall-new` redirects to it) and both test doubles. *(v1.5, decided: a fresh `add_parcel_geo`; cityhall untouched.)*

**Q2.** Should `geo` forbid carrying both `sir_id` and `submission_version_id` (a CHECK), or are they independent provenance links with no XOR? *(v1.5, decided: no CHECK; independent links, as D1 and D3 already treat them.)*

**Q3.** Where does the **parcel layer URL** come from for a county we have not met? D10 needs one and there is no registry (D6). *(v1.3)* This is now the only real gap in the derivation: the county name is on every plat and the ring carries its own SRID, so everything else is a fetch. For v1 it can be a constant for Austin plus an optional request field — but that is the thing that stops this generalising, and it is the same gap north star **D11** names. *(v1.2)* The entry is now two things: the ring layer, and the **legal-description layer + field name** D10a rung 2 queries (Austin: `MapServer/8`, `LEGAL_DESCRIPTION`), plus optionally a locator URL for rung 3. *(v1.5, decided: **surveyor is the registry** — the module's `layer-identity.json` with a `role` tag, D6; no second registry; the runbook runs only on jurisdictions prospector has trained, and an untrained one is a D8 stop.)*

**Q4.** `/anchored` currently has one rail row per anchor with a SIR subtitle. With no owner, what labels an anchor — the file name alone, or `submission_version` → `submission` → `project.name` when the chain exists? *(v1.5, decided: the file name, with the project name appended when the chain exists.)*

**Q5.** Does a re-run under a *new* `anchor_run_slug` reuse the county row (D11 says yes, the key is the file) or mint a fresh one per anchor run so a run's context is immutable? *(v1.5, decided: reuse. The ring is the county's, not the run's; a run's own context is already snapshotted in `target_geo_ids`.)*

**Q6.** A plan set naming more than one county (a TxDOT note, an adjacent jurisdiction, a county-line subdivision). Stop and ask, or take the county in the recording reference specifically, since that is the one whose records hold the plat? *(v1.5, decided: the recording reference's county; stop only when that reference itself names two.)*

**Q7.** Should `cartographer_anchors.target_geo_ids` get referential integrity now that D13 reads the loose-file map through it? It has already dangled once on one row (§1.4). An array FK needs a trigger or a join table. *(v1.4, decided: not now.)* It stays a bare array; the loose-file viewer tolerates a missing id by drawing what exists. Revisit when there is more than one anchor run.

**Q8.** Backfill posture for the 56 existing `geo` rows. All 56 derive a `project_id` cleanly, so north star **D4** (project ownership) stays available — but this spec does not need it and does not do it. Does anything want it before P5? *(v1.5, decided: no backfill.)*

**Q9.** Does `/anchor/[id]` reuse `/geometry/[id]`'s PDF viewer wholesale, or is the anchor page's PDF read-only (no rotation, no zoom, no selection rail)? The extracted-figure page needs the full instrument because a reader is checking 5 courses against the drawing; an anchor cites three or four claims on two pages. Reuse is tempting and the component is already extracted (`PdfPageOverlay`), but `/geometry/[id]`'s 455 lines of page are mostly the rail and the controls around it. *(v1.5, decided: a read-only viewer on `PdfPageOverlay`; not the full instrument.)*

**Q10.** Does the **county read** (D17) get a stored crop like the extract run's readings do, or stay box-only? Box-only is free and renders identically in situ; a stored crop is what makes the two pages consistent, and is the only way the claim survives the source PDF being replaced. Storing one means writing a `cartographer_geometry_crops` row from a runbook that is not the extract runbook, against a `geometry_id` that is not really its parent — which may be a sign the crop table wants an owner other than a geometry. *(v1.5, decided: box-only in v1; a stored crop waits for the crop table to get an owner.)*

**Q11.** **Possible bug:** `evidence.check_md` is null on anchor `e94fae93`, so `3.3-check`'s vision readout — the step whose only job is to say whether the overlay looks right — reached the database empty. `publish.ts` reads `check.md` from the run directory and tolerates its absence. Did the step write nothing, or did the file not survive to publish? Worth settling before the page is built around showing it. *(v1.5, settled: the step wrote it — `3.3-check/check.md`, 15,605 bytes, on the `car-wash-anchor-1` run. `5.1-publish`'s `step.yaml` does not list `3.3-check` as an input and `publish.py` links only `anchors.json`, `correspondences.json` and `decisions.json` into `ws/`, so `publish.ts` found no `check.md` at the run root and wrote null, as it is allowed to. Fix is §3 item 15.)*

**Q12.** *(v1.2)* The D10a **area-gate tolerance**. White Water is 0.005 % off; north star §9.4's ±3 ft `gis_fit` case on an older parcel is a ~3 ft band around a ~840 ft perimeter, roughly 6 % of a 1-acre lot. A tolerance that admits the second without admitting the neighbour's lot is probably ~10 % — but the right number depends on how often adjacent lots in a subdivision are near-equal in area, which is exactly the plat case. Start at 10 %, record both areas in the claim either way, and tune on the first stop. *(v1.5, decided as written.)*

<script data-reader>
/* spec-kit v5 — spec reader. Renders the embedded markdown (#spec-md) with marked, assigns
   deep-link ids, builds the TOC, and highlights the :target.
   ids assigned:
     headings   → GitHub-style slug of the text, PLUS an alias  s<number> for numbered headings
                  ("### 3.2 Piece A" → #s3-2, "## 1. Problem" → #s1)
     tokens     → the first <strong> whose text starts with P0a / D12 / Q6 gets id="P0a" etc.
   So a companion page can link to  SPEC.html#s3-2 , #D12 , #P0a , #Q6 . */
(function(){
  const raw=document.getElementById('spec-md').textContent.replace(/<\\\/script/g,'</script').trim();
  const body=document.getElementById('spec-body');
  marked.use({gfm:true,breaks:false});
  // a run of **Label:** lines (the spec header block) is meant to stack: give each a hard break
  const md=raw.replace(/^(\*\*[^*\n]+:\*\*[^\n]*)$/gm,'$1  ');
  body.innerHTML=marked.parse(md);
  const used=new Set();
  const slug=t=>t.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  const uniq=id=>{let i=id,n=1;while(used.has(i))i=id+'-'+(n++);used.add(i);return i;};
  // headings
  body.querySelectorAll('h1,h2,h3,h4').forEach(h=>{
    const text=h.textContent.trim();
    h.id=uniq(slug(text));
    const m=text.match(/^(\d+(?:\.\d+)*)\.?\s/);
    if(m){const a=document.createElement('span');a.id=uniq('s'+m[1].replace(/\./g,'-'));a.className='anchor';h.before(a);}
  });
  // tokens: **D4.** / **P0a …** / **Q6.**
  body.querySelectorAll('strong,b').forEach(s=>{
    const m=s.textContent.trim().match(/^(P\d[a-z]?|D\d+|Q\d+)\b/);
    if(m&&!used.has(m[1])){s.id=m[1];used.add(m[1]);s.classList.add('tok');}
  });
  // tables scroll instead of the page
  body.querySelectorAll('table').forEach(t=>{t.classList.add('spectable');const w=document.createElement('div');w.className='spectable-scroll';t.before(w);w.appendChild(t);});
  // title + meta
  const h1=body.querySelector('h1'); if(h1){document.getElementById('reader-title').textContent=h1.textContent;document.title=h1.textContent;h1.remove();}
  const status=raw.match(/\*\*Status:\*\*\s*([^\n]+)/),date=raw.match(/\*\*Date:\*\*\s*([^\n]+)/);
  document.getElementById('reader-meta').textContent=[status&&status[1],date&&date[1]].filter(Boolean).join(' · ');
  // TOC from h2/h3
  const toc=document.getElementById('toc');
  body.querySelectorAll('h2,h3').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className='toc-'+h.tagName.toLowerCase();toc.appendChild(a);});
  // sibling .md links → their reader pages
  body.querySelectorAll('a[href$=".md"]').forEach(a=>{a.href=a.getAttribute('href').replace(/\.md$/,'.html');a.title='opens that spec\'s reader page (build it with inline-kit.py --spec)';});
  // scroll to :target after ids exist
  if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView({block:'start'});}
})();
