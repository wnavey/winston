# Review Workflow - N independent review passes with cross-run consolidation
name: review
description: Ensemble review — runs N independent Haiku passes and consolidates findings with confidence tiers
version: 5.2.0

# Resources to prepare in workspace/ before starting workflow
resources:
  bureau: true
  submissionVersion: "{{ input.submissionVersionId }}"
  python: true

# Input parameters
inputs:
  submissionVersionId:
    type: string
    required: true
    description: Submission version ID from Supabase
  jurisdiction:
    type: string
    required: true
    description: Jurisdiction slug (e.g., 'austin')
  guideCode:
    type: string
    required: true
    description: Discipline code (e.g., 'de', 'tr', 'fire')
  runs:
    type: number
    required: false
    default: 3
    description: Number of independent review runs
  model:
    type: string
    required: false
    default: claude-haiku-4-5-20251001
    description: Model to use for review runs (cheap model — ensemble trades cost per run for N repetitions)
  effort:
    type: string
    required: false
    description: Agent effort level (low, medium, high). Only applied for models that support it (4.6+).
  eval:
    type: boolean
    required: false
    default: false
    description: Run evaluation against atomic MCR after review completes
  structureComments:
    type: boolean
    required: false
    default: true
    description: Run comment-structuring agent to organize findings into formatted review comments
  priorReviewId:
    type: string
    required: false
    default: ""
    description: Prior review ID for re-review comparison. When set, produces amended comments showing resolved vs outstanding issues.

# Where to upload when done
upload:
  bucket: workflow-runs
  prefix: "review/{{ input.projectId }}/{{ input.guideCode }}/{{ datetime }}"

# Save eval scoring to workflow_runs.results (only written when file exists)
results: "{{ WORKSPACE_PATH }}/output/eval/scoring.json"

# Save review comments to reviews table (only when file exists)
review: "{{ WORKSPACE_PATH }}/output/review-comments.json"

# Named output schema — City Hall uses this to select the rendering component
review_schema: "2026-04-simplified"

# Context variables injected by Conductor (not declared as inputs):
#   hasPriorReview — set to 'true' when priorReviewId is valid, '' otherwise
#   bureauCommitHash — git commit hash of the cloned Bureau repo
#   prior-review-comments.json — written to workspace/output/ by Conductor when hasPriorReview is true

# Sequential steps
steps:
  # Step 1: Run N independent review passes in parallel across all checklist items
  - name: review-runs
    agent:
      model: "{{ input.model }}"
      effort: "{{ input.effort }}"
      prompt: review.md
    tools:
      - vision
    checklistItems: "{{ WORKSPACE_PATH }}/bureau/jurisdictions/{{ input.jurisdiction }}/review-guides/{{ input.guideCode }}/*.md"
    runs: "{{ input.runs }}"
    schema: review.schema.json
    output: "{{ WORKSPACE_PATH }}/output/runs/{{ runIndex }}/findings/{{ checklistItem }}.json"
    retries: 5
    maxWorkers: 30

  # Step 2: Cross-run consolidation — flatten per-item findings, match across runs, assign confidence tiers
  - name: cross-run-consolidate
    script:
      name: cross-run-consolidate
      args:
        runsDir: "{{ WORKSPACE_PATH }}/output/runs"
        outputPath: "{{ WORKSPACE_PATH }}/output/consolidated-findings.json"
        runCount: "{{ input.runs }}"

  # Step 3: Download atomic MCR for evaluation (conditional - only if eval=true)
  # Uses atomic-mcr-2.json — the discipline-keyed version (matches guideCode input)
  - name: download-atomic-mcr
    if: "{{ input.eval }}"
    script:
      name: download-atomic-mcr
      args:
        projectId: "{{ input.projectId }}"
        outputPath: "{{ WORKSPACE_PATH }}/atomic-mcr.json"
        filename: "atomic-mcr-2.json"
    retries: 2

  # ─── First-review path (no prior review) ───────────────────────────

  # Step 4: Split consolidated findings into per-grouping files for synthesis
  - name: split-by-grouping
    if: "{{ input.structureComments }} && !{{ hasPriorReview }}"
    script:
      name: split-by-grouping
      args:
        inputFile: "{{ WORKSPACE_PATH }}/output/consolidated-findings.json"
        outputFolder: "{{ outputPath }}/04-synthesis-input"

  # Step 5: Parallel agents synthesize flat comments per grouping (no sections yet)
  - name: synthesize-comments
    if: "{{ input.structureComments }} && !{{ hasPriorReview }}"
    agent:
      model: claude-haiku-4-5-20251001
      prompt: synthesize-simplified.md
    inject:
      groupData:
        file: "{{ outputPath }}/04-synthesis-input/{{ checklistItem }}"
    checklistItems: "{{ outputPath }}/04-synthesis-input/*.json"
    schema: synthesize-simplified.schema.json
    output: "{{ outputPath }}/05-synthesis/{{ checklistItem }}"
    maxWorkers: 20
    retries: 2

  # Step 6: Build manifest from flat comments for section organizer
  - name: build-simplified-manifest
    if: "{{ input.structureComments }} && !{{ hasPriorReview }}"
    script:
      name: build-simplified-manifest
      args:
        synthesizedFolder: "{{ outputPath }}/05-synthesis"
        outputFile: "{{ outputPath }}/06-manifest.json"

  # Step 7: LLM assigns comments to sections with labels and summaries
  - name: organize-sections-simplified
    if: "{{ input.structureComments }} && !{{ hasPriorReview }}"
    agent:
      model: claude-haiku-4-5-20251001
      prompt: organize-sections-simplified.md
    schema: section-assignments-simplified.schema.json
    output: "{{ outputPath }}/07-section-assignments.json"
    retries: 2

  # Step 8: Deterministic merge — group comments into sections, assemble final output
  - name: merge-simplified-comments
    if: "{{ input.structureComments }} && !{{ hasPriorReview }}"
    script:
      name: merge-simplified-comments
      args:
        synthesizedFolder: "{{ outputPath }}/05-synthesis"
        sectionAssignmentsFile: "{{ outputPath }}/07-section-assignments.json"
        factsFile: "{{ WORKSPACE_PATH }}/projects/{{ input.projectId }}/facts.md"
        outputFile: "{{ outputPath }}/review-comments.json"
        bureauCommitHash: "{{ bureauCommitHash }}"
        bureauArtifactPath: "jurisdictions/{{ input.jurisdiction }}/review-guides/{{ input.guideCode }}"

  # ─── Re-review path (prior review exists) ──────────────────────────

  # Step 4r: Compare new findings against prior review comments
  - name: compare-prior-review
    if: "{{ hasPriorReview }}"
    script:
      name: compare-prior-review
      args:
        consolidatedFile: "{{ WORKSPACE_PATH }}/output/consolidated-findings.json"
        priorCommentsFile: "{{ WORKSPACE_PATH }}/output/prior-review-comments.json"
        outputFile: "{{ outputPath }}/comparison-result.json"

  # Step 5r: Split new findings (not in prior review) for synthesis
  - name: split-new-findings
    if: "{{ hasPriorReview }}"
    script:
      name: split-new-findings
      args:
        comparisonFile: "{{ outputPath }}/comparison-result.json"
        outputFolder: "{{ outputPath }}/04-synthesis-input"

  # Step 6r: Synthesize only NEW findings (skipped if glob matches nothing)
  - name: synthesize-new-comments
    if: "{{ hasPriorReview }}"
    agent:
      model: claude-haiku-4-5-20251001
      prompt: synthesize-simplified.md
    inject:
      groupData:
        file: "{{ outputPath }}/04-synthesis-input/{{ checklistItem }}"
    checklistItems: "{{ outputPath }}/04-synthesis-input/*.json"
    schema: synthesize-simplified.schema.json
    output: "{{ outputPath }}/05-synthesis/{{ checklistItem }}"
    maxWorkers: 20
    retries: 2

  # Step 7r: LLM rewrites headlines/summaries for reconciled prior comments
  - name: rewrite-re-review-comments
    if: "{{ hasPriorReview }}"
    agent:
      model: claude-haiku-4-5-20251001
      prompt: rewrite-re-review-comments.md
    inject:
      comparisonData:
        file: "{{ outputPath }}/comparison-result.json"
    schema: rewrite-re-review.schema.json
    output: "{{ outputPath }}/reconciled-comments-rewritten.json"
    retries: 2

  # Step 8r: Final assembly — merge reconciled + new comments into review-comments.json
  - name: assemble-re-review
    if: "{{ hasPriorReview }}"
    script:
      name: assemble-re-review
      args:
        comparisonFile: "{{ outputPath }}/comparison-result.json"
        rewrittenFile: "{{ outputPath }}/reconciled-comments-rewritten.json"
        newSynthesisFolder: "{{ outputPath }}/05-synthesis"
        factsFile: "{{ WORKSPACE_PATH }}/projects/{{ input.projectId }}/facts.md"
        outputFile: "{{ outputPath }}/review-comments.json"
        bureauCommitHash: "{{ bureauCommitHash }}"
        bureauArtifactPath: "jurisdictions/{{ input.jurisdiction }}/review-guides/{{ input.guideCode }}"
        priorReviewId: "{{ input.priorReviewId }}"

  # ─── Evaluation (both paths) ───────────────────────────────────────

  # Step 9: Per-run evaluations — score each independent run against atomic MCR (parallel)
  - name: evaluate-per-run
    if: "{{ input.eval }}"
    agent:
      model: claude-opus-4-6
      prompt: eval-per-run.md
    checklistSource: "{{ WORKSPACE_PATH }}/output/runs/runs-manifest.json"
    checklistKey: runs
    schema: eval.schema.json
    output: "{{ WORKSPACE_PATH }}/output/eval/scoring-{{ checklistItem }}.json"
    retries: 2
    maxWorkers: 4

  # Step 10: Merge per-run evals and compute union recall deterministically
  # Union = issue caught if ANY run caught it
  - name: merge-and-score-evals
    if: "{{ input.eval }}"
    script:
      name: merge-and-score-evals
      args:
        runsDir: "{{ WORKSPACE_PATH }}/output/eval"
        outputPath: "{{ WORKSPACE_PATH }}/output/eval/scoring.json"
        runCount: "{{ input.runs }}"
