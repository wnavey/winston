<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>measure-distance debugger</title>
<style>
  :root {
    --bg: #fafafa;
    --panel: #fff;
    --border: #e3e3e3;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2e7d32;
    --accent-bg: rgba(46, 204, 113, 0.18);
    --accent-stroke: rgba(46, 204, 113, 0.9);
    --accent-active-bg: rgba(46, 204, 113, 0.38);
    --bad: #c0392b;
    --warn: #d68910;
    --good: #1e8449;
    --blue: #3b82f6;
    --blue-bg: #eff6ff;
    --purple: #9333ea;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  body { display: flex; height: 100vh; overflow: hidden; }

  /* -- Run Tree (left panel) -- */
  #run-tree { width: 200px; flex: 0 0 200px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0; font-size: 12px; }
  #run-tree h1 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 12px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .run-group { margin-bottom: 2px; }
  .run-head { padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 4px; user-select: none; }
  .run-head:hover { background: #f3f4f6; }
  .run-head .arrow { font-size: 10px; color: var(--muted); width: 12px; display: inline-block; }
  .run-head .tag { font-size: 9px; color: var(--blue); margin-left: auto; }
  .run-cases { display: none; }
  .run-cases.open { display: block; }
  .session-group { margin: 0; }
  .session-head { padding: 4px 8px 4px 12px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 3px; user-select: none; }
  .session-head:hover { background: #f3f4f6; }
  .session-head .arrow { font-size: 9px; width: 10px; display: inline-block; }
  .session-head .count { font-size: 9px; color: var(--blue); margin-left: auto; }
  .session-cases { display: none; }
  .session-cases.open { display: block; }
  .run-cases li, .session-cases li { list-style: none; padding: 5px 8px 5px 20px; cursor: pointer; font-family: var(--mono); font-size: 11px; line-height: 1.3; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-cases li:hover, .session-cases li:hover { background: #f3f4f6; }
  .run-cases li.active, .session-cases li.active { background: #eef6f0; border-left-color: var(--accent); }
  .pill { display: inline-block; padding: 1px 5px; border-radius: 8px; font-size: 9px; font-weight: 600; letter-spacing: 0.02em; margin-left: 4px; vertical-align: middle; }
  .pill.good { background: #e7f5ea; color: var(--good); }
  .pill.bad { background: #fdecea; color: var(--bad); }
  .pill.warn { background: #fdf3e0; color: var(--warn); }

  /* -- Steps panel -- */
  #steps-panel { width: 180px; flex: 0 0 180px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0; }
  #steps-panel h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 14px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #steps-panel .step-item { padding: 7px 14px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; color: var(--text); border-left: 3px solid transparent; }
  #steps-panel .step-item:hover { background: #f3f4f6; }
  #steps-panel .step-item.active { background: #eef6f0; border-left-color: var(--accent); font-weight: 600; }
  #steps-panel .step-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  #steps-panel .step-item.active .dot { background: var(--accent); }
  #steps-panel .empty-msg { color: var(--muted); font-size: 11px; padding: 20px 14px; text-align: center; }

  /* -- Content area -- */
  #content { flex: 1; overflow-y: auto; padding: 20px 28px; background: var(--bg); }
  #content .empty { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 13px; }

  /* -- Shared content styles -- */
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .kv-grid { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; font-size: 12px; line-height: 1.6; }
  .kv-grid .k { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .kv-grid .v { font-family: var(--mono); font-size: 11px; word-break: break-word; }
  .kv-grid .v.plain { font-family: inherit; font-size: 12px; }

  .reasoning-box { background: #f0f7ff; border-left: 3px solid var(--blue); padding: 10px 14px; font-size: 12px; line-height: 1.5; border-radius: 0 4px 4px 0; margin-top: 4px; }
  .checklist-tag { display: inline-block; background: #eef0f4; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-family: var(--mono); color: #374151; margin: 2px 4px 2px 0; }
  .checklist-tag.agent { background: var(--blue-bg); border-color: #93c5fd; color: #1e40af; }

  pre.code-block { background: #f7f7f8; border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-size: 11px; line-height: 1.45; overflow-x: auto; margin: 4px 0; max-height: 400px; overflow-y: auto; font-family: var(--mono); white-space: pre-wrap; word-break: break-word; }
  .warn-note { background: #fff7e6; border: 1px solid #f7c77a; color: #7a4f00; padding: 8px 12px; font-size: 12px; line-height: 1.5; border-radius: 4px; margin-top: 8px; }
  .err-note { background: #fdecea; border: 1px solid #f1a39a; color: var(--bad); padding: 8px 12px; font-size: 12px; line-height: 1.5; border-radius: 4px; margin-top: 8px; font-family: var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
  .info-note { background: var(--blue-bg); border: 1px solid #93c5fd; color: #1e40af; padding: 8px 12px; font-size: 12px; line-height: 1.5; border-radius: 4px; margin-top: 8px; }

  .image-container { margin: 10px 0; background: #2b2b2b; border-radius: 6px; padding: 12px; display: inline-block; max-width: 100%; }
  .image-container img { display: block; max-width: 100%; height: auto; border-radius: 3px; }
  .image-container .label { color: #aaa; font-size: 10px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* -- Canvas overlay -- */
  .canvas-stage { background: #2b2b2b; border-radius: 6px; padding: 12px; margin: 10px 0; display: inline-block; max-width: 100%; }
  .canvas-stage .toolbar { display: flex; gap: 14px; margin-bottom: 8px; font-size: 12px; color: #ccc; }
  .canvas-stage .toolbar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .canvas-wrap { position: relative; display: inline-block; }
  .canvas-wrap img { display: block; max-width: 100%; height: auto; border-radius: 3px; }
  .canvas-wrap canvas { position: absolute; inset: 0; cursor: default; }

  .object-card { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; background: var(--panel); }
  .object-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .object-card .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .object-card .swatch.a { background: rgba(30, 132, 73, 0.3); border: 1px solid #1e8449; }
  .object-card .swatch.b { background: rgba(15, 90, 140, 0.3); border: 1px solid #0f5a8c; }
  .object-card .label { font-weight: 600; font-size: 13px; }
  .object-card .desc { font-size: 12px; color: var(--muted); margin: 4px 0; line-height: 1.4; }
  .object-card code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 11px; }

  .result-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-top: 10px; }
  .result-big { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .result-big.error { color: var(--bad); font-size: 18px; }

  .call-toggle { display: flex; gap: 0; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .call-toggle button { flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 500; border: none; background: var(--panel); color: var(--muted); cursor: pointer; border-right: 1px solid var(--border); }
  .call-toggle button:last-child { border-right: none; }
  .call-toggle button:hover { background: #f3f4f6; }
  .call-toggle button.active { background: var(--accent); color: #fff; }
  .call-toggle button .dpi-tag { font-size: 10px; opacity: 0.8; margin-left: 4px; }

  /* -- Resizable dividers -- */
  .divider { width: 4px; flex: 0 0 4px; cursor: col-resize; background: transparent; position: relative; z-index: 10; }
  .divider:hover, .divider.dragging { background: var(--accent-stroke); }
  .divider::after { content: ''; position: absolute; inset: -2px; }
</style>
</head>
<body>

  <nav id="run-tree">
    <h1>measure-distance</h1>
    <div id="run-tree-content"><div class="empty-msg" style="padding:20px 12px; color:var(--muted); font-size:11px;">loading...</div></div>
  </nav>

  <div class="divider" id="divider-1"></div>

  <div id="steps-panel">
    <h2>Steps</h2>
    <div id="steps-content"><div class="empty-msg">select a case</div></div>
  </div>

  <div class="divider" id="divider-2"></div>

  <main id="content">
    <div class="empty">Select a run and case from the left panel to begin debugging.</div>
  </main>

<script>
// ── State ──
let manifest = null;
let state = { runIdx: -1, caseIdx: -1, stepIdx: 0, callView: 'final' }; // callView: 'call1' | 'call2' | 'final'
const fileCache = {};

const STEPS = [
  { num: 0, label: 'Summary' },
  { num: 1, label: 'Asset Download & Crop' },
  { num: 2, label: 'Legend Context' },
  { num: 3, label: 'Detection & Distance' },
  { num: 4, label: 'Final Results' },
];

const GEMINI_COLORS = {
  fill: 'rgba(46, 204, 113, 0.18)',
  stroke: 'rgba(46, 204, 113, 0.9)',
};
const PURPLE = '#9333ea';
const LABEL_COLORS = { A: '#1e8449', B: '#0f5a8c' };

// ── Utils ──
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function kv(key, value, opts = {}) {
  if (value == null || value === undefined) {
    return `<span class="k">${escapeHtml(key)}</span><span class="v" style="color:#bbb">&mdash;</span>`;
  }
  const s = typeof value === 'object' ? JSON.stringify(value) : String(value);
  const cls = opts.plain ? 'v plain' : 'v';
  return `<span class="k">${escapeHtml(key)}</span><span class="${cls}">${escapeHtml(s)}</span>`;
}

function outcomePill(c) {
  if (c.outcome === 'success') return '<span class="pill good">ok</span>';
  if (c.outcome === 'compute_error') return '<span class="pill bad">err</span>';
  if (c.outcome === 'gemini_failed') return '<span class="pill bad">fail</span>';
  if (c.outcome === 'no_calldir') return '<span class="pill warn">no dir</span>';
  return '<span class="pill warn">?</span>';
}

async function fetchFile(path) {
  if (!path) return null;
  if (fileCache[path] !== undefined) return fileCache[path];
  try {
    const res = await fetch('../' + path);
    if (!res.ok) { fileCache[path] = null; return null; }
    const text = await res.text();
    fileCache[path] = text;
    return text;
  } catch { fileCache[path] = null; return null; }
}

function currentCase() {
  if (state.runIdx < 0 || state.caseIdx < 0) return null;
  return manifest.runs[state.runIdx].cases[state.caseIdx];
}

// ── Load ──
async function loadManifest() {
  try {
    const res = await fetch('manifest.json');
    if (!res.ok) throw new Error('not found');
    manifest = await res.json();
  } catch {
    document.getElementById('run-tree-content').innerHTML = '<div class="empty-msg">manifest.json not found. Run <code>python3 build-manifest.py</code></div>';
    return;
  }
  renderRunTree();
}

// ── Run Tree ──
/** Extract the session ID from a case ID (strip -pN suffix) */
function sessionIdFromCase(caseId) {
  const m = caseId.match(/^(.+)-p(\d+)$/);
  return m ? m[1] : caseId;
}

/** Short display label for a case (just the -pN or full id if no suffix) */
function caseSuffix(caseId) {
  const m = caseId.match(/-p(\d+)$/);
  return m ? `pair ${m[1]}` : caseId.split('-').slice(-3).join('-');
}

function renderRunTree() {
  const container = document.getElementById('run-tree-content');
  let html = '';

  // Group runs by version → guide
  const tree = new Map(); // version → Map(guide → [{run, ri}])
  manifest.runs.forEach((run, ri) => {
    const ver = run.version || 'ungrouped';
    const guide = run.guide || '';
    if (!tree.has(ver)) tree.set(ver, new Map());
    const guides = tree.get(ver);
    if (!guides.has(guide)) guides.set(guide, []);
    guides.get(guide).push({ run, ri });
  });

  for (const [version, guides] of tree) {
    if (version !== 'ungrouped' && tree.size > 1) {
      html += `<div style="padding:6px 12px 2px;font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.06em;">${escapeHtml(version)}</div>`;
    }
    for (const [guide, runs] of guides) {
      if (guide) {
        html += `<div style="padding:3px 12px 1px 16px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.03em;">${escapeHtml(guide)}</div>`;
      }
    runs.forEach(({ run, ri }) => {
    // Group cases by session
    const groups = new Map();
    run.cases.forEach((c, ci) => {
      const sid = sessionIdFromCase(c.id);
      if (!groups.has(sid)) groups.set(sid, []);
      groups.get(sid).push({ c, ci });
    });

    let casesHtml = '';
    if (groups.size === run.cases.length) {
      // No grouping needed (each case is its own session, e.g., test-script runs)
      casesHtml = run.cases.map((c, ci) =>
        `<li data-ri="${ri}" data-ci="${ci}">${escapeHtml(c.id)} ${outcomePill(c)}</li>`
      ).join('');
    } else {
      // Grouped by session
      for (const [sid, cases] of groups) {
        const shortSid = sid.split('-').slice(-3).join('-'); // e.g., "run-2-13"
        if (cases.length === 1) {
          // Single case — still show as a collapsible group for consistency
          const { c, ci } = cases[0];
          const innerItem = `<li data-ri="${ri}" data-ci="${ci}">${escapeHtml(caseSuffix(c.id))} ${outcomePill(c)}</li>`;
          casesHtml += `
            <div class="session-group">
              <div class="session-head" data-ri="${ri}" data-sid="${escapeHtml(sid)}">
                <span class="arrow">&#9656;</span>
                <span>${escapeHtml(shortSid)}</span>
                <span class="count">1</span>
              </div>
              <ul class="session-cases" data-sid="${escapeHtml(sid)}">${innerItem}</ul>
            </div>`;
        } else {
          // Multi-pair session — collapsible sub-group
          const innerItems = cases.map(({ c, ci }) =>
            `<li data-ri="${ri}" data-ci="${ci}">${escapeHtml(caseSuffix(c.id))} ${outcomePill(c)}</li>`
          ).join('');
          casesHtml += `
            <div class="session-group">
              <div class="session-head" data-ri="${ri}" data-sid="${escapeHtml(sid)}">
                <span class="arrow">&#9656;</span>
                <span>${escapeHtml(shortSid)}</span>
                <span class="count">${cases.length}</span>
              </div>
              <ul class="session-cases" data-sid="${escapeHtml(sid)}">${innerItems}</ul>
            </div>`;
        }
      }
    }

    html += `<div class="run-group">
      <div class="run-head" data-ri="${ri}">
        <span class="arrow">&#9656;</span>
        <span>${escapeHtml(run.id)}</span>
        ${run.source === 'experiment' ? '<span class="tag">exp</span>' : ''}
      </div>
      <ul class="run-cases" data-ri="${ri}">${casesHtml}</ul>
    </div>`;
    });
    }
  }
  container.innerHTML = html;

  // Run head click → expand + show run overview
  container.querySelectorAll('.run-head').forEach(el => {
    el.addEventListener('click', () => {
      const ri = +el.dataset.ri;
      const cases = container.querySelector(`.run-cases[data-ri="${ri}"]`);
      if (!cases.classList.contains('open')) {
        cases.classList.add('open');
        el.querySelector('.arrow').innerHTML = '&#9662;';
      }
      selectRun(ri);
    });
  });

  // Session head click → toggle sub-group + show session summary
  container.querySelectorAll('.session-head').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const sid = el.dataset.sid;
      const ri = +el.dataset.ri;
      const subcases = container.querySelector(`.session-cases[data-sid="${CSS.escape(sid)}"]`);
      const isOpen = subcases.classList.toggle('open');
      el.querySelector('.arrow').innerHTML = isOpen ? '&#9662;' : '&#9656;';
      selectSession(ri, sid);
    });
  });

  // Case click → select individual case
  container.querySelectorAll('.run-cases li, .session-cases li').forEach(el => {
    if (el.dataset.ri !== undefined && el.dataset.ci !== undefined) {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectCase(+el.dataset.ri, +el.dataset.ci);
      });
    }
  });
}

function selectSession(ri, sessionId) {
  state = { runIdx: ri, caseIdx: -1, stepIdx: 0 };

  // Clear case highlight
  document.querySelectorAll('.run-cases li, .session-cases li').forEach(el => el.classList.remove('active'));

  // Clear steps panel
  document.getElementById('steps-content').innerHTML = '<div class="empty-msg">select a case or browse below</div>';

  // Render session summary
  const run = manifest.runs[ri];
  const sessionCases = run.cases.filter(c => sessionIdFromCase(c.id) === sessionId);
  renderSessionSummary(ri, sessionId, sessionCases);
}

function renderSessionSummary(ri, sessionId, cases) {
  const area = document.getElementById('content');
  const shortSid = sessionId.split('-').slice(-3).join('-');

  // Shared context from first case
  const first = cases[0] || {};
  const meta = first.metadata || {};

  let html = `<div class="section">
    <h3>${escapeHtml(shortSid)} — ${cases.length} measurement${cases.length !== 1 ? 's' : ''}</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:4px;">Session: ${escapeHtml(sessionId)}</div>
  </div>`;

  // Agent reasoning (shared across the session)
  if (first.reasoning) {
    html += `<div class="section"><h3>Agent Reasoning</h3>
      <div class="reasoning-box">${escapeHtml(first.reasoning)}</div>
    </div>`;
  }

  // Applicable checklist items (shared)
  const aci = first.applicableChecklistItems || [];
  if (aci.length) {
    html += `<div class="section"><h3>Applicable Checklist Items</h3>
      ${aci.map(item => `<div style="margin-bottom:8px;">
        <span class="checklist-tag agent">${escapeHtml(item.checklist_id || item.checklistId || '')}</span>
        <span style="font-size:12px;color:var(--text);">${escapeHtml(item.checklist_deficiency_text || item.checklistText || '')}</span>
      </div>`).join('')}</div>`;
  }

  // Per-pair results table
  html += `<div class="section"><h3>Measurements</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid var(--border);text-align:left;">
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Pair</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Object A</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Object B</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Sheet</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Scale</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Distance</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Confidence</th>
        </tr>
      </thead>
      <tbody>
        ${cases.map((c, i) => {
          const f = c.finalResult || {};
          const inp = c.inputs || {};
          return `
          <tr data-ri="${ri}" data-ci="${manifest.runs[ri].cases.indexOf(c)}"
              style="border-bottom:1px solid var(--border);cursor:pointer;"
              onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background=''">
            <td style="padding:6px 8px;font-family:var(--mono);font-size:11px;">${escapeHtml(caseSuffix(c.id))}</td>
            <td style="padding:6px 8px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(inp.objectA || '')}">${escapeHtml((inp.objectA || '').slice(0, 60))}</td>
            <td style="padding:6px 8px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(inp.objectB || '')}">${escapeHtml((inp.objectB || '').slice(0, 60))}</td>
            <td style="padding:6px 8px;font-family:var(--mono);">${escapeHtml(String(inp.sheetNum || ''))}</td>
            <td style="padding:6px 8px;font-family:var(--mono);">${escapeHtml(String(inp.scaleInchesPerFoot || ''))}</td>
            <td style="padding:6px 8px;font-family:var(--mono);font-weight:600;">${f.distanceFeet != null ? f.distanceFeet + ' ft' : '—'}</td>
            <td style="padding:6px 8px;">${outcomePill(c)} ${f.confidence || ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  area.innerHTML = html;

  // Wire up row clicks to select individual cases
  area.querySelectorAll('tr[data-ri]').forEach(row => {
    row.addEventListener('click', () => selectCase(+row.dataset.ri, +row.dataset.ci));
  });
}

function selectRun(ri) {
  state = { runIdx: ri, caseIdx: -1, stepIdx: 0 };

  // Clear case selection highlight
  document.querySelectorAll('.run-cases li, .session-cases li').forEach(el => el.classList.remove('active'));

  // Clear steps panel
  document.getElementById('steps-content').innerHTML = '<div class="empty-msg">select a case or browse below</div>';

  // Render run overview
  renderRunOverview(ri);
}

function renderRunOverview(ri) {
  const run = manifest.runs[ri];
  const area = document.getElementById('content');

  // Build table rows: checklist items → case IDs
  // Group by checklist items from applicableChecklistItems
  const rows = [];
  run.cases.forEach((c, ci) => {
    const aci = c.applicableChecklistItems || [];
    if (aci.length) {
      aci.forEach(item => {
        rows.push({
          checklistId: item.checklist_id || item.checklistId || '',
          checklistText: item.checklist_deficiency_text || item.checklistText || '',
          caseId: c.id,
          caseIdx: ci,
          outcome: c.outcome,
          distanceFeet: c.finalResult?.distanceFeet,
          objectA: c.inputs?.objectA || '',
          objectB: c.inputs?.objectB || '',
        });
      });
    } else {
      rows.push({
        checklistId: '—',
        checklistText: '(no checklist items declared)',
        caseId: c.id,
        caseIdx: ci,
        outcome: c.outcome,
        distanceFeet: c.finalResult?.distanceFeet,
        objectA: c.inputs?.objectA || '',
        objectB: c.inputs?.objectB || '',
      });
    }
  });

  // Sort by checklist ID
  rows.sort((a, b) => a.checklistId.localeCompare(b.checklistId, undefined, { numeric: true }));

  const filterHtml = `
    <div style="margin-bottom:16px;">
      <input type="text" id="run-overview-filter" placeholder="Filter by checklist ID (e.g. EL-13)"
        style="padding:6px 12px;font-size:13px;border:1px solid var(--border);border-radius:4px;width:300px;font-family:var(--mono);" />
    </div>`;

  const tableHtml = `
    <table style="width:100%;border-collapse:collapse;font-size:12px;" id="run-overview-table">
      <thead>
        <tr style="border-bottom:2px solid var(--border);text-align:left;">
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Checklist ID</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Deficiency</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Case</th>
          <th style="padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;">Result</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr class="run-overview-row" data-ri="${ri}" data-ci="${r.caseIdx}" data-checklist-id="${escapeHtml(r.checklistId)}"
              style="border-bottom:1px solid var(--border);cursor:pointer;"
              onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background=''">
            <td style="padding:6px 8px;font-family:var(--mono);font-weight:600;color:var(--accent);white-space:nowrap;">${escapeHtml(r.checklistId)}</td>
            <td style="padding:6px 8px;color:var(--text);line-height:1.4;max-width:400px;">${escapeHtml(r.checklistText).slice(0, 120)}${r.checklistText.length > 120 ? '…' : ''}</td>
            <td style="padding:6px 8px;font-family:var(--mono);font-size:11px;white-space:nowrap;">${escapeHtml(r.caseId)} ${outcomePill(r)}</td>
            <td style="padding:6px 8px;font-family:var(--mono);white-space:nowrap;">${r.distanceFeet != null ? r.distanceFeet + ' ft' : '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;

  area.innerHTML = `
    <div class="section">
      <h3>${escapeHtml(run.id)} — ${run.cases.length} cases</h3>
      <div style="color:var(--muted);font-size:12px;margin-bottom:12px;">
        ${run.source === 'experiment' ? 'Experiment run' : 'Test-script replay'} ·
        ${rows.length} checklist item associations
      </div>
      ${filterHtml}
      ${tableHtml}
    </div>`;

  // Wire up row clicks
  area.querySelectorAll('.run-overview-row').forEach(row => {
    row.addEventListener('click', () => selectCase(+row.dataset.ri, +row.dataset.ci));
  });

  // Wire up filter
  const filterInput = document.getElementById('run-overview-filter');
  if (filterInput) {
    filterInput.addEventListener('input', () => {
      const query = filterInput.value.toLowerCase().trim();
      area.querySelectorAll('.run-overview-row').forEach(row => {
        const id = (row.dataset.checklistId || '').toLowerCase();
        row.style.display = !query || id.includes(query) ? '' : 'none';
      });
    });
    filterInput.focus();
  }
}

function selectCase(ri, ci) {
  state = { runIdx: ri, caseIdx: ci, stepIdx: 0 };

  const cases = document.querySelector(`.run-cases[data-ri="${ri}"]`);
  if (cases && !cases.classList.contains('open')) {
    cases.classList.add('open');
    const head = document.querySelector(`.run-head[data-ri="${ri}"]`);
    if (head) head.querySelector('.arrow').innerHTML = '&#9662;';
  }

  document.querySelectorAll('.run-cases li, .session-cases li').forEach(el => {
    el.classList.toggle('active', +el.dataset.ri === ri && +el.dataset.ci === ci);
  });

  renderSteps();
  renderContent();
}

// ── Steps Panel ──
function renderSteps() {
  const container = document.getElementById('steps-content');
  container.innerHTML = STEPS.map((s, i) =>
    `<div class="step-item${i === state.stepIdx ? ' active' : ''}" data-si="${i}">
      <span class="dot"></span>
      <span>${s.num} ${escapeHtml(s.label)}</span>
    </div>`
  ).join('');
  container.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => {
      state.stepIdx = +el.dataset.si;
      renderSteps();
      renderContent();
    });
  });
}

// ── Content Dispatch ──
async function renderContent() {
  const c = currentCase();
  const area = document.getElementById('content');
  if (!c) { area.innerHTML = '<div class="empty">Select a case</div>'; return; }

  area.innerHTML = '<div class="empty">Loading...</div>';

  switch (state.stepIdx) {
    case 0: area.innerHTML = renderStepSummary(c); break;
    case 1: area.innerHTML = await renderStepAssets(c); break;
    case 2: area.innerHTML = await renderStepLegend(c); break;
    case 3: area.innerHTML = await renderStepDetection(c); setupDetectionCanvas(c); break;
    case 4: area.innerHTML = renderStepFinal(c); break;
  }
}

// ── Step 0: Summary (merged with old Inputs) ──
function renderStepSummary(c) {
  const meta = c.metadata || {};
  const final = c.finalResult;
  const aci = c.applicableChecklistItems || [];
  const lci = c.likelyChecklistItems || [];
  const loc = c.localization || {};
  const assets = meta.assets || {};

  // Pipeline status dots
  const steps = [
    { name: 'Asset Download', ok: !!c.sheetJpegPath || !!assets.pdfStoragePath },
    { name: 'Drawing Crop', ok: !!c.croppedJpegPath },
    { name: 'Legend Context', ok: assets.legendSource && assets.legendSource !== 'none' },
    { name: 'Gemini Vision', ok: !!(meta.optionB || {}).success },
    { name: 'Python Compute', ok: !!final && !meta.error },
    { name: 'Final Result', ok: !!final && final.distanceFeet != null },
  ];

  const pipelineHtml = steps.map(s =>
    `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;">
      <span style="width:8px;height:8px;border-radius:50%;background:${s.ok ? 'var(--good)' : 'var(--bad)'};flex-shrink:0;"></span>
      <span>${escapeHtml(s.name)}</span>
    </div>`
  ).join('');

  // Result headline
  let resultHtml = '';
  if (final) {
    const dist = final.distanceFeet != null ? `${final.distanceFeet} ft` : '\u2014';
    resultHtml = `
      <div class="result-card">
        <div class="result-big">${escapeHtml(dist)}</div>
        <div class="kv-grid">
          ${kv('confidence', final.confidence)}
          ${kv('method', final.method || (final.localization || {}).method)}
          ${kv('scaleUsed', final.scaleUsed)}
          ${kv('elapsed', meta.elapsedMs ? (meta.elapsedMs / 1000).toFixed(1) + 's' : '\u2014')}
        </div>
      </div>`;
  } else {
    resultHtml = `<div class="result-card"><div class="result-big error">${escapeHtml(c.outcome || 'no result')}</div>
      ${meta.error ? `<div class="err-note">${escapeHtml(String(meta.error).slice(0, 400))}</div>` : ''}
    </div>`;
  }

  // Full MCP Tool Inputs (merged from old Step 1)
  const inputsHtml = `
    <div class="section"><h3>MCP Tool Inputs</h3>
      <div class="kv-grid">
        ${kv('callId', meta.callId)}
        ${kv('documentId', c.inputs.documentId)}
        ${kv('sheetNum', c.inputs.sheetNum)}
        ${kv('objectA', c.inputs.objectA, { plain: true })}
        ${kv('objectB', c.inputs.objectB, { plain: true })}
        ${kv('scaleInchesPerFoot', c.inputs.scaleInchesPerFoot)}
        ${kv('strategy', meta.strategy)}
      </div>
    </div>`;

  // Agent reasoning
  const reasoningHtml = c.reasoning
    ? `<div class="section"><h3>Agent Reasoning</h3><div class="reasoning-box">${escapeHtml(c.reasoning)}</div></div>`
    : '';

  // Checklist items
  let checklistHtml = '';
  if (aci.length) {
    checklistHtml += `<div class="section"><h3>Applicable Checklist Items (agent)</h3>
      ${aci.map(item => `<div style="margin-bottom:8px;">
        <span class="checklist-tag agent">${escapeHtml(item.checklist_id || item.checklistId || '')}</span>
        <span style="font-size:12px;color:var(--text);">${escapeHtml(item.checklist_deficiency_text || item.checklistText || '')}</span>
      </div>`).join('')}</div>`;
  }
  if (lci.length) {
    checklistHtml += `<div class="section"><h3>Likely Checklist Items</h3>
      ${lci.map(item => `<div style="margin-bottom:8px;">
        <span class="checklist-tag">${escapeHtml(item.checklistId || item.checklist_id || '')}</span>
        <span style="font-size:12px;color:var(--text);">${escapeHtml(item.checklistText || item.checklist_deficiency_text || '')}</span>
      </div>`).join('')}</div>`;
  }

  return `
    <div class="section"><h3>Result</h3>${resultHtml}</div>
    ${inputsHtml}
    ${reasoningHtml}
    ${checklistHtml}
    <div class="section">
      <h3>Pipeline Status</h3>
      ${pipelineHtml}
    </div>
    <div class="section">
      <h3>Gemini Confidence</h3>
      <div class="kv-grid">
        ${kv('objectA found', loc.objectA?.found ?? '\u2014')}
        ${kv('objectA confidence', loc.objectA?.confidence ?? '\u2014')}
        ${kv('objectB found', loc.objectB?.found ?? '\u2014')}
        ${kv('objectB confidence', loc.objectB?.confidence ?? '\u2014')}
        ${kv('legendSource', assets.legendSource)}
        ${kv('drawingBbox', assets.drawingBbox ? 'yes' : 'none')}
      </div>
    </div>
  `;
}

// ── Step 1: Asset Download & Crop (merged old Steps 2+3) ──
async function renderStepAssets(c) {
  const assets = (c.metadata || {}).assets || {};
  const bbox = assets.drawingBbox;
  const isFullPage = !bbox || (bbox.x0 === 0 && bbox.y0 === 0 && bbox.x1 === 1 && bbox.y1 === 1);

  let html = `<div class="section"><h3>Supabase Storage Paths</h3>
    <div class="kv-grid">
      ${kv('bucket', assets.bucket)}
      ${kv('pdfStoragePath', assets.pdfStoragePath)}
      ${kv('jpegStoragePath', assets.jpegStoragePath)}
    </div>
  </div>`;

  if (c.sheetPdfPath) {
    html += `<div class="section"><h3>Sheet PDF</h3>
      <object data="../${escapeHtml(c.sheetPdfPath)}" type="application/pdf" width="100%" height="600" style="border:1px solid var(--border); border-radius:4px;">
        <p>PDF preview not available. <a href="../${escapeHtml(c.sheetPdfPath)}" target="_blank">Download PDF</a></p>
      </object>
    </div>`;
  }

  if (c.sheetJpegPath) {
    html += `<div class="section"><h3>Full-Page JPEG</h3>
      <div class="image-container">
        <div class="label">sheet.jpg</div>
        <img src="../${escapeHtml(c.sheetJpegPath)}" alt="full page JPEG" />
      </div>
    </div>`;
  }

  if (!c.sheetPdfPath && !c.sheetJpegPath) {
    html += `<div class="warn-note">tmp/ files not archived for this run &mdash; sheet PDF and JPEG are not available locally.</div>`;
  }

  // Drawing crop section (from old Step 3)
  html += `<div class="section"><h3>Drawing Block BBox (normalized)</h3>
    <pre class="code-block">${escapeHtml(JSON.stringify(bbox, null, 2))}</pre>
  </div>`;

  if (isFullPage) {
    html += `<div class="warn-note">No drawing block found &mdash; full page was sent to Gemini (no crop applied).</div>`;
  }

  if (c.croppedJpegPath) {
    html += `<div class="section"><h3>Cropped Image (sent to Gemini)</h3>
      <div class="image-container">
        <div class="label">cropped.jpg</div>
        <img src="../${escapeHtml(c.croppedJpegPath)}" alt="cropped drawing" />
      </div>
    </div>`;
  } else {
    html += `<div class="warn-note">No cropped image available.</div>`;
  }

  return html;
}

// ── Step 2: Legend Context ──
async function renderStepLegend(c) {
  const assets = (c.metadata || {}).assets || {};
  let html = `<div class="section"><h3>Legend Source</h3>
    <div class="kv-grid">${kv('legendSource', assets.legendSource)}</div>
  </div>`;

  if (assets.legendSource === 'none') {
    html += `<div class="warn-note">No legend context was available for this measurement. The model had to interpret scale markings and symbols without legend reference.</div>`;
  }

  if (c.legendPath) {
    const content = await fetchFile(c.legendPath);
    if (content) {
      html += `<div class="section"><h3>Legend Content</h3>
        <pre class="code-block">${escapeHtml(content)}</pre>
      </div>`;
    }
  }

  return html;
}

// ── Step 3: Detection & Distance Computation (merged old Steps 6+7) ──

/** Get the localization, image path, prompt path, and response path for the currently selected call view. */
function getCallViewData(c) {
  const v = state.callView;
  if (c.twoCallMode && v === 'call1' && c.call1) {
    return {
      loc: c.call1.localization || {},
      imgPath: c.call1.croppedJpegPath,
      promptPath: c.call1.promptPath,
      responsePath: c.call1.responsePath,
      label: 'Call 1 — Coarse (120 DPI)',
    };
  }
  if (c.twoCallMode && v === 'call2' && c.call2) {
    return {
      loc: c.call2.localization || {},
      imgPath: c.call2.croppedJpegPath,
      promptPath: c.call2.promptPath,
      responsePath: c.call2.responsePath,
      label: 'Call 2 — Refined (300 DPI)',
    };
  }
  // 'final' or legacy single-call
  return {
    loc: c.localization || {},
    imgPath: c.croppedJpegPath,
    promptPath: c.promptPath,
    responsePath: c.responsePath,
    label: c.twoCallMode ? 'Final (used for measurement)' : 'Gemini Vision',
  };
}

async function renderStepDetection(c) {
  const meta = c.metadata || {};
  const final = c.finalResult || {};
  const vd = getCallViewData(c);
  const loc = vd.loc;

  // Call toggle (only shown for two-call mode)
  let toggleHtml = '';
  if (c.twoCallMode) {
    const mkBtn = (val, label, dpi) => {
      const active = state.callView === val ? ' active' : '';
      const dpiTag = dpi ? `<span class="dpi-tag">${dpi}</span>` : '';
      return `<button class="cv-btn${active}" data-cv="${val}">${escapeHtml(label)}${dpiTag}</button>`;
    };
    toggleHtml = `<div class="call-toggle">
      ${mkBtn('call1', 'Call 1 — Coarse', '120 DPI')}
      ${mkBtn('call2', 'Call 2 — Refined', '300 DPI')}
      ${mkBtn('final', 'Final', '')}
    </div>`;
  }

  // Center: single canvas with layered overlays
  let centerHtml = '';
  if (vd.imgPath) {
    centerHtml = `
      ${toggleHtml}
      <div class="canvas-stage">
        <div class="toolbar">
          <label><input type="checkbox" id="det-toggle-gemini" checked /> Gemini Bounding Boxes</label>
          <label><input type="checkbox" id="det-toggle-python" checked /> Python Distance</label>
          <label title="Gemini returns coords in [y,x] order — uncheck to test [x,y] interpretation"><input type="checkbox" id="det-toggle-yx" checked /> swap axes</label>
        </div>
        <div class="canvas-wrap" id="det-wrap">
          <img id="det-img" src="../${escapeHtml(vd.imgPath)}" alt="${escapeHtml(vd.label)}" />
          <canvas id="det-canvas"></canvas>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">
        <b>${escapeHtml(vd.label)}</b> &mdash;
        Coordinates in Gemini 0&ndash;1000 space. Green = Gemini bboxes, purple = Python nearestPoint + distance line.
      </div>`;
  } else {
    centerHtml = toggleHtml + '<div class="warn-note">No cropped image available for this call view.</div>';
  }

  // Right panel: combined Gemini + Python data
  let rightHtml = '';

  // Section: Gemini Localization
  rightHtml += `<div class="section"><h3>Gemini Localization${c.twoCallMode ? ` <span style="font-weight:normal;color:var(--muted);">(${escapeHtml(vd.label)})</span>` : ''}</h3>`;
  rightHtml += objectCardHtml('A', loc.objectA);
  rightHtml += objectCardHtml('B', loc.objectB);
  if (!loc.objectA && !loc.objectB) rightHtml += '<div style="color:var(--muted);font-size:12px">No localization data</div>';
  rightHtml += `</div>`;

  // Section: Gemini Prompt
  if (vd.promptPath) {
    const prompt = await fetchFile(vd.promptPath);
    if (prompt) {
      rightHtml += `<div class="section"><h3>Gemini Prompt</h3>
        <pre class="code-block" style="max-height:250px;">${escapeHtml(prompt)}</pre>
      </div>`;
    }
  }

  // Section: Gemini Response
  if (vd.responsePath) {
    const response = await fetchFile(vd.responsePath);
    if (response) {
      rightHtml += `<div class="section"><h3>Gemini Response</h3>
        <pre class="code-block">${escapeHtml(response)}</pre>
      </div>`;
    }
  }

  // Call comparison (show both call confidences when in two-call mode)
  if (c.twoCallMode) {
    const c1 = (c.call1 || {}).localization || {};
    const c2 = (c.call2 || {}).localization || {};
    rightHtml += `<div class="section"><h3>Call Comparison</h3>
      <div class="kv-grid">
        ${kv('call1 A conf', (c1.objectA || {}).confidence)}
        ${kv('call1 B conf', (c1.objectB || {}).confidence)}
        ${kv('call2 A conf', (c2.objectA || {}).confidence)}
        ${kv('call2 B conf', (c2.objectB || {}).confidence)}
        ${kv('used for result', state.callView === 'final' ? (c.call2 ? 'call2' : 'call1') : state.callView)}
      </div>
    </div>`;
  }

  // Section: Python Computation
  rightHtml += `<div class="section"><h3>Python Computation</h3>
    <div class="kv-grid">
      ${kv('strategy', meta.strategy)}
      ${kv('scaleInchesPerFoot', c.inputs.scaleInchesPerFoot)}
      ${kv('objectA', c.inputs.objectA, { plain: true })}
      ${kv('objectB', c.inputs.objectB, { plain: true })}
    </div>
    <pre class="code-block" style="max-height:300px;margin-top:8px;">${escapeHtml(JSON.stringify(loc, null, 2))}</pre>
  </div>`;

  // Section: Result
  rightHtml += `<div class="section"><h3>Result</h3>`;
  if (final.distanceFeet != null) {
    rightHtml += `
      <div class="result-card">
        <div class="result-big">${escapeHtml(String(final.distanceFeet))} ft</div>
        <div class="kv-grid">
          ${kv('distanceInches', final.distanceInches)}
          ${kv('confidence', final.confidence)}
          ${kv('method', final.method || (final.localization || {}).method)}
          ${kv('fallbackUsed', (final.localization || {}).fallbackUsed)}
        </div>
      </div>`;
  } else {
    rightHtml += `<div class="warn-note">No computation result &mdash; Python may have failed.</div>
      ${meta.error ? `<div class="err-note">${escapeHtml(String(meta.error).slice(0, 400))}</div>` : ''}`;
  }
  rightHtml += `</div>`;

  return `<div style="display:flex;gap:20px;align-items:flex-start;">
    <div style="flex:1;min-width:0;">${centerHtml}</div>
    <div style="width:360px;flex:0 0 360px;overflow-y:auto;max-height:calc(100vh - 60px);">${rightHtml}</div>
  </div>`;
}

function objectCardHtml(label, obj) {
  if (!obj) return '';
  const swatchCls = label === 'A' ? 'a' : 'b';
  return `
    <div class="object-card">
      <div class="head">
        <span class="swatch ${swatchCls}"></span>
        <span class="label">Object ${escapeHtml(label)}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">conf ${obj.confidence ?? '&mdash;'}</span>
      </div>
      <div class="desc">${escapeHtml(obj.description || '')}</div>
      <div class="kv-grid" style="margin-top:6px">
        ${kv('bbox', obj.bbox ? '[' + obj.bbox.join(', ') + ']' : null)}
        ${kv('nearestPoint', obj.nearestPoint ? '[' + obj.nearestPoint.join(', ') + ']' : null)}
        ${kv('found', obj.found)}
      </div>
    </div>`;
}

// ── Detection Canvas Setup (single canvas, two overlay layers) ──
function setupDetectionCanvas(c) {
  const img = document.getElementById('det-img');
  const canvas = document.getElementById('det-canvas');
  if (!img || !canvas) return;

  const draw = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.style.width = img.clientWidth + 'px';
    canvas.style.height = img.clientHeight + 'px';
    renderDetectionOverlay(c, canvas);
  };

  if (img.complete && img.naturalWidth) draw();
  else img.onload = draw;

  ['det-toggle-gemini', 'det-toggle-python', 'det-toggle-yx'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => renderDetectionOverlay(c, canvas));
  });

  // Call-toggle buttons (two-call mode)
  document.querySelectorAll('.cv-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.callView = btn.dataset.cv;
      renderContent();  // full re-render to swap image + data
    });
  });

  const resizeObs = new ResizeObserver(() => {
    if (img.clientWidth) {
      canvas.style.width = img.clientWidth + 'px';
      canvas.style.height = img.clientHeight + 'px';
    }
  });
  resizeObs.observe(img);
}

function renderDetectionOverlay(c, canvas) {
  const vd = getCallViewData(c);
  const loc = vd.loc;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!loc) return;

  const showGemini = document.getElementById('det-toggle-gemini')?.checked ?? true;
  const showPython = document.getElementById('det-toggle-python')?.checked ?? true;
  const swapAxes = document.getElementById('det-toggle-yx')?.checked ?? false;

  const W = canvas.width, H = canvas.height;
  const denorm = (v, dim) => (v / 1000) * dim;

  // Layer 1: Green Gemini bounding boxes (drawn first, underneath)
  if (showGemini) {
    ['objectA', 'objectB'].forEach(key => {
      const obj = loc[key];
      if (!obj || !obj.found || !obj.bbox) return;
      const [a0, b0, a1, b1] = obj.bbox;
      const [x0, y0, x1, y1] = swapAxes ? [b0, a0, b1, a1] : [a0, b0, a1, b1];
      const px = denorm(x0, W), py = denorm(y0, H);
      const pw = denorm(x1 - x0, W), ph = denorm(y1 - y0, H);

      ctx.fillStyle = GEMINI_COLORS.fill;
      ctx.strokeStyle = GEMINI_COLORS.stroke;
      ctx.lineWidth = 2;
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeRect(px, py, pw, ph);

      // A/B label
      ctx.fillStyle = LABEL_COLORS[key.slice(-1)] || GEMINI_COLORS.stroke;
      ctx.font = 'bold 22px -apple-system, sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(key.slice(-1), px + 6, py + 4);
    });
  }

  // Layer 2: Purple Python nearestPoint dots + dashed distance line (drawn on top)
  if (showPython) {
    const points = {};
    ['objectA', 'objectB'].forEach(key => {
      const obj = loc[key];
      if (!obj || !obj.found || !obj.nearestPoint) return;
      const [a, b] = obj.nearestPoint;
      const [npX, npY] = swapAxes ? [b, a] : [a, b];
      const ppx = denorm(npX, W), ppy = denorm(npY, H);
      points[key] = { x: ppx, y: ppy };

      ctx.beginPath();
      ctx.arc(ppx, ppy, 8, 0, Math.PI * 2);
      ctx.fillStyle = PURPLE;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // Dashed line between nearest points
    if (points.objectA && points.objectB) {
      ctx.beginPath();
      ctx.moveTo(points.objectA.x, points.objectA.y);
      ctx.lineTo(points.objectB.x, points.objectB.y);
      ctx.strokeStyle = PURPLE;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// ── Step 4: Final Results ──
function renderStepFinal(c) {
  const final = c.finalResult;
  const meta = c.metadata || {};

  let resultHtml;
  if (final) {
    const ft = final.distanceFeet ?? '?';
    const inches = final.distanceInches ?? '?';
    resultHtml = `
      <div class="result-card">
        <div class="result-big">${escapeHtml(String(ft))} ft (${escapeHtml(String(inches))} in)</div>
        <div class="kv-grid">
          ${kv('confidence', final.confidence)}
          ${kv('scaleUsed', final.scaleUsed)}
          ${kv('method', final.method || (final.localization || {}).method)}
          ${kv('fallbackUsed', (final.localization || {}).fallbackUsed)}
          ${kv('legendSource', (final.localization || {}).legendSource)}
        </div>
      </div>`;
  } else {
    resultHtml = `
      <div class="result-card">
        <div class="result-big error">No Result</div>
        <div style="font-size:12px;color:var(--muted)">Pipeline did not produce a measure-distance.json</div>
      </div>`;
  }

  let html = `<div class="section"><h3>Final Result</h3>${resultHtml}</div>`;

  html += `<div class="section"><h3>Timing &amp; Status</h3>
    <div class="kv-grid">
      ${kv('outcome', c.outcome)}
      ${kv('elapsedMs', meta.elapsedMs)}
      ${kv('startedAt', meta.startedAt)}
      ${kv('callId', meta.callId)}
    </div>
  </div>`;

  if (meta.error) {
    html += `<div class="section"><h3>Error</h3>
      <div class="err-note">${escapeHtml(String(meta.error).slice(0, 1200))}${String(meta.error).length > 1200 ? '...' : ''}</div>
    </div>`;
  }

  // Provenance
  const prov = c.provenance || {};
  const captured = prov.capturedOutcome || {};
  if (prov.sourceTool_use_id || prov.sourceRunIndex) {
    html += `<div class="section"><h3>Provenance</h3>
      <div class="kv-grid">
        ${kv('tool_use_id', prov.sourceTool_use_id)}
        ${kv('runIndex', prov.sourceRunIndex)}
        ${kv('checklistItem', prov.sourceChecklistItem)}
        ${kv('orig reachedScript', captured.reachedScript)}
        ${kv('orig optionB_success', captured.optionB_success)}
        ${kv('orig optionB_confidence', captured.optionB_geminiConfidence)}
      </div>
    </div>`;
  }

  return html;
}

// ── Resizable dividers ──
function setupDivider(dividerId, leftPanelId) {
  const divider = document.getElementById(dividerId);
  const panel = document.getElementById(leftPanelId);
  if (!divider || !panel) return;

  let startX, startW;
  function onMouseMove(e) {
    const delta = e.clientX - startX;
    const newW = Math.max(100, Math.min(500, startW + delta));
    panel.style.width = newW + 'px';
    panel.style.flex = `0 0 ${newW}px`;
  }
  function onMouseUp() {
    divider.classList.remove('dragging');
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  divider.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startW = panel.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
}

// ── Init ──
loadManifest();
setupDivider('divider-1', 'run-tree');
setupDivider('divider-2', 'steps-panel');
</script>
