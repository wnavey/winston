<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block names: a drafter-style name on every content block</title>
<style>
/* ============================================================
   spec-kit v5.1  —  winston HTML spec design system
   Inline the ENTIRE contents of this file into the spec's style block.
   Canonical source: ~/.claude/skills/winston-spec/assets/spec-kit.css
   When you change this file, bump the version above and in COMPONENTS.md.
   v4: + sequence diagram (.seq*), + data table (.spectable), + prompt block (.prompt)
   v5: + system map (.sysmap/.sys, edges drawn by spec-kit.js), + decision flow (.dflow),
       + concept figure (figure.concept), + claim caption (.claim), + reference chip rows (.sys-refs),
       + spec reader page (body.reader; DESIGN-SPEC.md rendered by marked, built by inline-kit.py --spec)
   v5.1: pass-2 friction fixes — long identifiers wrap (.sys .t, .uc .nt, .ent .ty), .sysmap-scroll for
       6+ columns, state-neutral .sm pills, .dflow jump outcomes, legend 'new trigger' dot
       Colour rule: fill/border = change state only; kind = badge text + shape; legend is the
       complete list of colour meanings on the page.
   ============================================================ */

:root{
  /* steel-blue ramp (matches cityhall / Noetic report surfaces) */
  --p50:#f0f5f9;--p100:#dce8f1;--p200:#b9d2e5;--p300:#8cb4d1;--p400:#6397b8;
  --p500:#517e9e;--p600:#3f6582;--p700:#35526b;--p800:#2d4559;--p900:#273b4b;--p950:#182530;
  --bg:#f9f9f9;--card:#ffffff;--divider:#dfdfdf;--ink:#1f2937;--muted:#6b7280;--ember:#bb4d00;
  /* semantic: new / changed / retired */
  --new:#15803d;--newbg:#f0fdf4;--newbd:#bbf7d0;
  --chg:#b45309;--chgbg:#fffbeb;--chgbd:#fde68a;
  --ret:#b91c1c;--retbg:#fef2f2;--retbd:#fecaca;
  --sans:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --mono:'Fira Code','SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:15px}

/* ---------- masthead ---------- */
header.masthead{background:linear-gradient(135deg,var(--p800),var(--p600));color:#fff;padding:34px 32px 30px;position:relative;overflow:hidden}
header.masthead::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);pointer-events:none}
header.masthead .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--p200)}
header.masthead h1{font-family:var(--serif);font-weight:600;margin:.35em 0 .2em;font-size:29px;position:relative}
header.masthead p{margin:0;color:var(--p100);max-width:880px;font-size:15px}
header.masthead .meta{margin-top:14px;font-size:12.5px;color:var(--p200);font-family:var(--mono)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;background:var(--p950);padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-wrap:wrap}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--p200);font-family:var(--sans);font-size:14px;font-weight:500;padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
nav.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-right:7px}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.04)}
nav.tabs button.active{color:#fff;border-bottom-color:var(--ember);background:rgba(255,255,255,.06)}

/* ---------- layout ---------- */
main{max-width:1140px;margin:0 auto;padding:30px 26px 90px}
.panel{display:none;animation:fade .25s ease}
main [id]{scroll-margin-top:74px} /* deep-link targets clear the sticky tab bar */
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Section heading: the h2 text is the PLAIN NAME of the thing the tab is about (v5.1 — it used to
   carry a tagline while the small eyebrow carried the name; that was backwards). .eyebrow = the
   tab number / section label, small. .sub = one plain sentence saying what is on the tab. */
h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:34px 0 10px;color:var(--p950)}
h2:first-child{margin-top:4px}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--p500);font-weight:400;margin-bottom:6px}
h2 .sub{display:block;font-family:var(--sans);font-size:14px;font-weight:400;letter-spacing:0;line-height:1.5;color:var(--muted);margin-top:6px}
h3{font-size:16px;font-weight:600;margin:28px 0 8px;color:var(--p800);display:flex;align-items:center;gap:9px}
h3 .hn{font-family:var(--mono);font-size:12px;color:#fff;background:var(--p600);border-radius:5px;padding:2px 8px}
h4{font-size:14px;font-weight:600;margin:18px 0 6px;color:var(--p800)}
p{margin:.55em 0}
.lede{font-size:15px;color:var(--p800);border-left:3px solid var(--ember);padding-left:16px;margin:12px 0 20px}
ul{margin:.4em 0;padding-left:22px}li{margin:.28em 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--p50);border:1px solid var(--p100);border-radius:4px;padding:1px 5px;color:var(--p800)}

/* ---------- callout ---------- */
.callout{background:var(--p50);border:1px solid var(--p200);border-left:4px solid var(--p500);border-radius:8px;padding:13px 17px;margin:16px 0}
.callout.ember{background:#fdf6f0;border-color:#f0cba8;border-left-color:var(--ember)}
.callout.new{background:var(--newbg);border-color:var(--newbd);border-left-color:var(--new)}
.callout .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:600;display:block;margin-bottom:3px}
.callout.ember .lab{color:var(--ember)} .callout.new .lab{color:var(--new)}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:12px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.swatch{width:26px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}

/* ---------- shared field badges (used by entity rows + legend) ---------- */
.b{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;padding:1px 4px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.b-pk{background:#fef3c7;color:#92600a;border:1px solid #fde68a}
.b-fk{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.b-nn{background:#eef1f4;color:#4b5563;border:1px solid #d7dde3}
.b-new{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   ER / UML entity boxes
   ============================================================ */
.erd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:16px 0;background:#fbfcfd;border:1px solid var(--divider);border-radius:12px;padding:18px}
.ent{border:1px solid var(--divider);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:236px;flex:0 1 auto}
.ent .eh{padding:7px 12px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ent .eh .en{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.ent .eh .stereo{font-size:9.5px;font-family:var(--mono);opacity:.85;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ent.exist .eh{background:var(--p700)}
.ent.newt .eh{background:var(--new)}
.ent.changed .eh{background:var(--chg)}
.ent.retired .eh{background:#9ca3af}
.ent.retired{opacity:.72}
.ent .row{display:flex;align-items:center;gap:7px;padding:4px 11px;font-size:11.5px;border-top:1px solid #eef1f4}
.ent .row:first-of-type{border-top:0}
.ent .row .nm{font-family:var(--mono);font-size:11.5px;color:var(--p900);font-weight:600}
.ent .row .ty{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;text-align:right;max-width:60%;overflow-wrap:anywhere}
.ent .row.hi{background:#fff9f2}
.ent .row.strk .nm{text-decoration:line-through;color:var(--muted)}
.ent .note{padding:5px 11px;font-size:10px;color:var(--muted);font-style:italic;border-top:1px dashed #e5e9ee;background:#fbfcfd}
/* diff rows — show a table modification (column added / removed), git-style.
   Put a "+"/"−" marker in a .gut span at the start of the row. */
.ent .row .gut{flex:0 0 10px;width:10px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.ent .row.add{background:var(--newbg);box-shadow:inset 3px 0 0 var(--new)}
.ent .row.add .gut{color:var(--new)}
.ent .row.add .nm{color:#166534}
.ent .row.del{background:var(--retbg);box-shadow:inset 3px 0 0 var(--ret)}
.ent .row.del .gut{color:var(--ret)}
.ent .row.del .nm{color:var(--ret);text-decoration:line-through}

/* relationships panel — crow's-foot text notation */
.rels{background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:14px 0;font-family:var(--mono);font-size:12px;line-height:1.9}
.rels .rl{display:block;color:var(--p800)}
.rels .rl b{color:var(--ember)}
.rels .cf{color:var(--p500);font-weight:700}
.rels .cmt{color:var(--muted);font-style:normal;font-family:var(--sans);font-size:11.5px}
.rels .tag-new{color:var(--new);font-weight:700}
.rels .tag-ret{color:var(--ret);font-weight:700}
.rels-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:700;margin-bottom:6px}

/* ============================================================
   Use-case scene  (an action + its boxes-and-arrows diagram)
   ============================================================ */
.uc{margin:16px 0 22px;border:1px solid var(--divider);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.uc .uch{display:flex;align-items:center;gap:13px;padding:11px 16px;background:linear-gradient(135deg,var(--p700),var(--p600));color:#fff}
.uc .uch .ucn{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);font-family:var(--mono);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.uc .uch .uctxt{flex:1}
.uc .uch .actor{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--p100);display:block;margin-bottom:1px}
.uc .uch .uct{font-weight:600;font-size:15.5px;font-family:var(--serif)}
.uc .ucsub{padding:9px 16px;font-size:12.5px;color:var(--p800);background:var(--p50);border-bottom:1px solid var(--p100)}
.uc .ucdiag{padding:20px 16px 14px}
.ucnote{padding:2px 16px 14px;font-size:11.5px;color:var(--muted)}
.ucnote b{color:var(--p700);font-family:var(--mono);font-size:10.5px}

/* ============================================================
   Boxes-and-arrows flow
   Robustness rules baked in:
   - .dfg WRAPS (flex-wrap:wrap) so long chains never clip / never
     need horizontal scroll. Arrows reflow with the nodes.
   - .node is a flex COLUMN: the op-badge is an in-flow header row
     (never position:absolute), and .nt / .nf are block-level, so a
     table name and its fields can never smush onto one line.
   ============================================================ */
.dfg{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;margin:0}
.node{flex:0 0 auto;width:156px;background:#fff;border:1.5px solid var(--p300);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.node .op{align-self:flex-start;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid;color:#fff;margin-bottom:2px}
.node .nt{display:block;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--p900);line-height:1.3;overflow-wrap:anywhere}
.node .nf{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.45;word-break:break-word}
.node.created{border-color:var(--new);background:var(--newbg)} .node.created .op{background:var(--new);border-color:var(--new)}
.node.read{border-color:var(--p400);background:#eef4fb} .node.read .op{background:var(--p500);border-color:var(--p500)}
.node.event{border-color:var(--ember);background:#fdf6f0} .node.event .op{background:var(--ember);border-color:var(--ember)}
.node.store{border-style:dashed;border-color:var(--p500);background:#eef3f7} .node.store .op{background:var(--p700);border-color:var(--p700)}
.edge{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;max-width:104px;padding:0 4px}
.edge .el{font-size:9px;color:var(--p600);font-family:var(--mono);text-align:center;line-height:1.3;margin-bottom:2px}
.edge .ar{color:var(--p400);font-size:20px;font-weight:700;line-height:1}

/* ============================================================
   Card grid  (keep / change / drop comparisons)
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.erd{padding:12px}}
.card{background:var(--card);border:1px solid var(--divider);border-radius:9px;padding:14px 16px}
.card.keep{border-top:3px solid var(--new)} .card.change{border-top:3px solid var(--chg)} .card.drop{border-top:3px solid var(--ret)}
.card strong{display:block;margin-bottom:4px;font-size:13.5px}
.card ul{font-size:12.5px;margin:2px 0}

/* ============================================================
   Lifecycle / state machine
   ============================================================ */
.sm{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0}
.sm .s{border:1px solid var(--p300);background:var(--p50);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--p800);font-family:var(--mono)}
.sm .s .who{display:block;font-size:9px;font-family:var(--mono);color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.sm .s.client{border-color:var(--newbd);background:var(--newbg)}
.sm .s.cc{border-color:#f0cba8;background:#fdf6f0}
.sm .s.spec{border-color:var(--chgbd);background:var(--chgbg)}
.sm .a{color:var(--p400);font-weight:700}
/* state-neutral variants (v5.1): terminal-good / terminal-stop / dimmed. The .client/.cc/.spec
   colours mean "whose court" and need a legend if used. */
.sm .s.ok{border-color:var(--newbd);background:var(--newbg);color:var(--new)}
.sm .s.stop{border-color:var(--retbd);background:var(--retbg);color:var(--ret)}
.sm .s.dim{opacity:.6;border-style:dashed}

/* ============================================================
   Use-case catalog — grouped list of candidate use cases
   (a scoped list, NOT a diagram — for "what would we build" inventories)
   ============================================================ */
.catgrp{border:1px solid var(--divider);border-radius:10px;overflow:hidden;margin:14px 0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.catgrp .cath{background:var(--p700);color:#fff;padding:8px 14px;font-family:var(--serif);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
.catgrp .cath .cgl{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}
.uci{display:flex;gap:9px;align-items:baseline;padding:7px 13px;border-top:1px solid #eef1f4;font-size:13px}
.uci .uid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--p600);flex:0 0 26px}
.uci .utxt{flex:1;color:var(--ink);line-height:1.45}
.uci .utxt b{color:var(--p900)}
.uci .star{color:var(--ember);font-weight:700;font-size:12px;flex:0 0 auto;letter-spacing:-1px}
.uci.later{opacity:.66}
.utag{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}
.utag.t-orig{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.utag.t-add{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   Misc: storage strip, cross-reference box
   ============================================================ */
.storage{background:#eef3f7;border:1px dashed var(--p300);border-radius:8px;padding:9px 13px;font-family:var(--mono);font-size:12px;color:var(--p800);margin:12px 0}
.storage b{color:var(--ember)}
.xref{font-size:12px;color:var(--p600);background:var(--p50);border:1px solid var(--p100);border-radius:6px;padding:8px 12px;margin:10px 0}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--divider);color:var(--muted);font-size:12px;font-family:var(--mono)}

/* actor / repo chips (optional, for inline actor tags in prose) */
.rc{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid;vertical-align:middle;white-space:nowrap}
.r-ch{background:#eef4fb;color:#2456a8;border-color:#c3d8f2}
.r-sub{background:#f3eefb;color:#6b3fa0;border-color:#dcccf0}
.r-fa{background:#e9f7f2;color:#0f7a5f;border-color:#bfe8db}
.r-db{background:#eaeef2;color:#2d4559;border-color:#c7d2dd}
.r-store{background:#e6eef3;color:#35526b;border-color:#bcd0dd}
.r-user{background:#eefaf0;color:#15803d;border-color:#bbf7d0}
.r-mcp{background:#fdf0e6;color:#b5590d;border-color:#f2d3b3}

/* ============================================================
   Sequence diagram — swimlane message flow
   A CSS grid: col 1 = step number, then one column per actor lane.
   Each message is a grid item that SPANS grid-columns from its
   source lane to its target lane, so it always sits under the right
   headers and never smushes. Continuous lifelines are grid items
   spanning all rows (grid-row:1/-1) — so set .seq-body's
   grid-template-rows to repeat(STEP_COUNT, auto) for -1 to resolve.
   Wide diagrams scroll inside .seq-scroll, never the page body.
   Direction is an in-flow glyph (.dir ◂/▸) pushed to the target edge
   by justify-content:space-between — never position:absolute.
   ============================================================ */
.seq-scroll{overflow-x:auto;margin:16px 0;border:1px solid var(--divider);border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.seq{min-width:840px}
.seq-head,.seq-body{display:grid;grid-template-columns:30px repeat(6,minmax(104px,1fr))}
.seq-head{background:linear-gradient(135deg,var(--p800),var(--p700));padding:11px 12px}
.seq-h{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 4px}
.seq-h .role{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--p200)}
.seq-h .who{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:6px;padding:3px 9px}
.seq-body{position:relative;row-gap:11px;padding:16px 12px 20px}
.seq-life{width:2px;background:var(--p100);justify-self:center;border-radius:2px;z-index:0}
.seq-num{grid-column:1;justify-self:center;align-self:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--p600);min-width:19px;height:19px;padding:0 3px;border-radius:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.seq-msg{align-self:center;display:flex;flex-direction:row;align-items:center;gap:8px;justify-content:space-between;background:#fff;border:1.5px solid var(--p300);border-radius:7px;padding:5px 10px;z-index:1;min-width:0}
.seq-msg .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.seq-msg .m{font-family:var(--mono);font-size:10.5px;color:var(--p900);font-weight:700;line-height:1.32;word-break:break-word}
.seq-msg .m2{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.3;word-break:break-word}
.seq-msg .dir{font-size:14px;font-weight:700;color:var(--p500);flex:0 0 auto}
.seq-msg.write{border-color:var(--new);background:var(--newbg)} .seq-msg.write .dir{color:var(--new)}
.seq-msg.event{border-color:var(--ember);background:#fdf6f0} .seq-msg.event .dir{color:var(--ember)}
.seq-msg.ret{border-style:dashed;background:#f6f9fb} .seq-msg.ret .m{font-weight:500;color:var(--p600)}
.seq-msg.self{border-style:dashed;border-color:var(--p400);background:#eef3f7}
.seq-foot{display:flex;flex-wrap:wrap;gap:8px 15px;padding:9px 14px;border-top:1px solid var(--divider);background:#fbfcfd;font-size:10.5px;font-family:var(--mono);color:var(--muted);align-items:center}
.seq-foot .sw{display:inline-block;width:20px;height:11px;border-radius:3px;border:1.5px solid var(--p300);vertical-align:middle;margin-right:5px}
.seq-foot .sw.write{border-color:var(--new);background:var(--newbg)} .seq-foot .sw.event{border-color:var(--ember);background:#fdf6f0}

# Block names: a drafter-style name on every content block

**Status:** Draft v3
**Date:** 2026-09-29
**Companion:** `block-names.html` (same folder): the diagrams for everything below.
**Prompted by:** the CC PDF redesign (Will's mockup, 2026-09-29): evidence chips read `S37 · Site Details (1 of 2) · Block 4`, and the report goes to the City of Austin as a PDF with no link back to the app, so "Block 4" is meaningless to its reader.
**Repos touched:** `substation` (one column, the publish RPC, the carry-forward copy, both search RPCs, generated types), `bureau` (the preprocessing-v4 sheet reader emits `name`; the assemble → normalize → publish chain carries it; a new `name-blocks` backfill runbook; conductor-side and Python-side workspace renderers show it), `conductor` (block select + `blocks.md` rendering + manifest), `cityhall` (lightbox title, sheet page, evidence-chip name; generated types), `inspector-general` (artifact type + one parity check).
> **Revision note (v2, 2026-09-29, Will's answers to §9):** Q1 → searchable, but as a **phase 2** (new P5, D14): not in the first batch. Q2 → PPv4 is the preprocessing convention; the legacy Inngest writer is left alone and its retirement is out of scope (D8 stands). Q3 → the backfill's model is **Sonnet 5** (§6.2 `namer`). Q4 → **Title Case**, not as-printed caps (D2 stands). Q5 → yes, the reader names the `title_block` too (D3 amended). Q7 → **no fallback**: a null name renders the chip as `S{n} · {sheet label}` and nothing else; the label-then-position fallback in v1 §3.2 is removed (D11 amended). Q8 → the backfill records itself in `execution_metadata` (D10 amended). Q6 is still open pending Will's pick.
>
> **Revision note (v3, 2026-09-29):** Q6 → **stamp at write time only** (D15). The evidence gate copies `content_block.name` from the block manifest into `sheetReferences[].blockName`; cityhall chips and the PDF read that field and run no lookup of their own; the lightbox keeps the live query it already makes for the bounding box. Reviews written before the gate ships stay unnamed until re-run. §7.3–§7.5 rewritten accordingly.

**Repos NOT touched:** `claude-plugins`, `radar`, `navalbase`, `quarry`, `dsd` (the RDS chip partial is the PDF-redesign spec's job; this spec only makes the name available to it).

---

## 1. Problem

### 1.1 The chip cites an internal number

Every review comment cites its evidence as `sheetReferences[] = {documentId, sheetNumber, blockNumber?, label}` (bureau `workflows/completeness-check/schemas/completeness.schema.json:69-93`; the CRC twin `crc.schema.json:49-66` is the same shape). `blockNumber` is `content_block.short_id`, a reading-order ordinal `1..N` per sheet version (substation migration `20260701140000_add_content_block_short_id.sql`). In the app that number is a deep-link target: `SheetLightbox.svelte:243-287` walks `submission_plan_set → plan_set_version → sheet_version → content_block(short_id, bounding_box)` and draws the box. It is never meant to be read.

The Completeness Check PDF is the one surface where it has to be read. The report is issued to the City of Austin as a PDF; there is no app to click through to. The redesign mockup wants each sheet chip to say *where on the sheet* the evidence is: `S37 · North & East Overall Elevation · title block`, not `· Block 4`.

### 1.2 What a block carries today

`public.content_block` (substation `supabase/migrations/00000000000000_baseline.sql:555-579`, plus `short_id`) stores, per block: `category`, `description`, `content`, `bounding_box`, `embedding`, `embedding_text`, `short_id`. No name, no location word. Checked against Lamar + Collier v4 (`submission_version 6b9b85ed-…`, project `23301a8a-…`) on 2026-09-29:

| Sheet · block | category | description (verbatim, truncated) | bbox x, y |
|---|---|---|---|
| S1 · 2 | table | "A comprehensive index of all sheets in the plan set, listing sheet titles and their corresponding sheet numbers (from 01 to 52)." | 0.80, 0.07 |
| S1 · 10 | seal | "The seal and signature of the engineer, Shelly Mitchell, certifying the engineering work." | 0.62, 0.74 |
| S1 · 12 | form | "A form for releasing the site plan, including case number, application date, approval status (administratively or by commission), and expira…" | 0.84, 0.80 |
| S14 · 5 | table | "Table defining compatibility setback lines and allowable building heights based on distance from the property line." | 0.69, 0.46 |
| S29 · 5 | diagram | "Cross-section showing the detention vault, sedimentation basin, overflow weir, and concrete bottom with elevations." | 0.04, 0.53 |
| S55 · 9 | notes | "A certificate signed and sealed by a Registered Professional Land Surveyor, certifying the accuracy of the plat and survey." | 0.38, 0.80 |

`description` is one or two sentences of prose (prod averages: `text_block` 91 chars, `table` 149, `diagram` 167, `drawing` 309). It has the right semantics and the wrong shape for a chip. `category` is semi-controlled: the v4 reader enumerates 11 values (`title_block, drawing, diagram, text_block, notes, table, form, legend, doc_embed, seal, other`, `steps/2.2-sheets/steps/read/contract.test.ts:11`), but prod carries about 150 distinct values from older pipelines (`revision_block`, `north_arrow`, `key_map`, `standard-detail`, …). Prod size on 2026-09-29: **17,723 blocks** across 1,655 sheet versions; 3,338 of them (284 sheet versions) come from the 20 registered v2/v4 runs, the rest from the legacy Inngest pipeline.

### 1.3 The name already exists, informally

The v4 sheet reader is already asked for it twice, and throws it away both times:

- Read 3's description rule (`steps/2.2-sheets/steps/read/prompt.md:88`): *"Include labels and callout numbers ("DETAIL 3-A: Valley Gutter", "General Notes", "Site Plan") and any keyword a review agent would search for."* The name is buried in the sentence.
- Read 4's reading guide (`prompt.md:107`): *"Block 3: diagram — Outlet Structure Detail"*. The phrase after the dash is a name. The contract parses only `Block N: <category>` (`contract.test.ts:98`), so the phrase is free text that nothing stores.

Review agents cite it a third way: roughly half of today's evidence labels already carry an element name after the sheet title ("Cover Sheet, Sheet Index block"; "Dimensional Control & Site Plan, Compatibility Setback Table"), written from the same `blocks.md` heading. Nobody asked for it consistently, so it is there about half the time.

### 1.4 How reviewers name a place on a sheet

Drafting practice names the element, not the position: the **title block** (the strip along the right or bottom carrying firm, seal, sheet number and the revision block), the **legend**, the **notes** column, **key map**, **north arrow**, and **details** by number. Austin's own reviewers, in the requirements behind the CRC v5 run (`review ed5e7ba9-…`), write "the Site Plan Approval block on the cover sheet", "in the Legend", "on detail conforming to City standard 430S-1", and reach for position only when the element has no name ("in the lower right-hand corner reserved for the permitting batch stamp"). The National CAD Standard's coordinate grid ("A1") only works when the set draws the grid, which Austin civil sets do not; "NW quadrant" is a site-geography term and would read as a place on the ground. So the chip's third segment is a **name**; position words are not used at all (D11).

---

## 2. Decisions

**D1. One nullable column.** `public.content_block.name text NULL`. No CHECK, no uniqueness, no index. Nullable because 17,723 existing rows have no name until the backfill runs, and because the legacy Inngest writer (D8) keeps inserting without one.

**D2. The name rule.** A short noun phrase a drafter would use for the element, in Title Case, 2–6 words: the element's **printed heading when it has one** ("Sheet Index", "General Notes", "Legend", "Meter Notice", "Compatibility Setback Table", "Detail 3-A Valley Gutter"), otherwise the **drafter's name for what it is** ("Engineer's Seal", "Site Plan Release Form", "Revision Table", "Vicinity Map", "Curve Table"). Never `Block N`, never the sheet's own title, never a sentence, never this runbook's process vocabulary (`AGENTS.md` rule 16 applies to `name` as it does to `description`). A bare category word ("Notes") is allowed only when the block really has no heading and no better name. The full rule text is §3.1 and is shared by the v4 reader prompt and the backfill prompt (D9).

**D3. Produced in Read 3 of the v4 sheet reader, next to `description`.** Read 2a (discover) only sees the whole sheet at low resolution and records `category` + a rough box; Read 3 (transcribe) reads each block from a 300-DPI crop, which is where the printed heading is legible. `name` is **required, non-null** in the reader's output contract (`contract.test.ts:15-20` `Block` zod object gains `name: z.string().min(1).max(60)` plus a Title Case check modelled on the `label` rule at lines 84-87). In the published artifact schema it is `["string","null"]` and **not required**, so artifacts written before this spec still validate (§4). The reader names every block it discovers, the `title_block` included (it is dropped with the rest at publish, `prompt.md:38`; naming it keeps the contract uniform — Q5, resolved yes).

**D4. The name flows through the assemble → normalize → publish chain by explicit addition at every whitelist.** Four places silently drop unknown block keys today and each is edited: `assemble.py:34` `BLOCK_KEYS`, `lib/parity.ts` `RawBlock`/`OrderedBlock` + `normalizeAndOrderBlocks`, `normalize.ts:42-50`, `lib/artifact.ts` `ArtifactBlock`; and `artifact-schema.json` `definitions/block` (`additionalProperties:false` at line 59) gains the property. `preprocessing-v3/artifact-schema.json` is byte-identical and v3 runs v4's `scripts/`, so it gets the same edit (§4).

**D5. `embedding_text` does not change.** It is a pinned parity contract with substation and IG (`lib/embeddings.ts:1-14`: `text = content ? \`${description}\n${content}\` : description`), and changing it means re-embedding every block for consistency. The name is returned by the search RPCs (D11) but not embedded. Revisit as Q1.

**D6. The reading guide's block phrase is the name.** Read 4's `"Block 3: diagram — Outlet Structure Detail"` (`prompt.md:107`) becomes `"Block 3: <name> (diagram)"` so the guide, `blocks.md` and the chip all say the same words for the same block.

**D7. Publish inserts it; carry-forward copies it.** `publish_preprocessing_run.sql:185-197` adds `name` to the column list and `NULLIF(b->>'name','')` to the SELECT. `plan-set.logic.ts:168` selects it and `:195-204` copies it onto the new sheet version. Publish stays clear-then-apply; a v4 artifact with names re-publishes with names.

**D8. The legacy Inngest block writer is not taught to name.** `sheet.logic.ts:150-170` keeps inserting `name = NULL`. That path is the pre-runbook pipeline; blocks it creates get names from the backfill (D9), which can be re-run at any time over `name IS NULL`. Q2 asks whether to retire this position later.

**D9. Backfill = a bespoke `name-blocks` runbook, not a partial preprocessing-v4 run.** A scoped v4 run cannot do it (§6.1): v4 has no from-step or re-caption mode, every in-scope sheet gets all four reads from pixels on Opus (2 h budget per sheet, `runbook.yaml:11`), and staging the existing blocks is barred by design (`steps/1.2-stage/step.yaml:6-7`, core rule 19). The backfill reads existing rows, names them with the same rule (§3.1) on a Sonnet-class model, validates, and writes by id. It never touches boxes, descriptions or embeddings.

**D10. The backfill also patches the stored artifact of every registered run it names.** Publish clears and re-inserts blocks (`publish.ts:14-15`, README:72), so a re-publish of a registered run from its stored `artifact.json` (`publish.ts --run <id>`) would wipe DB-only names. The backfill writes `name` into the artifact's `sheets[].content_blocks[]` by `short_id` for the 20 registered runs (3,338 blocks) and re-uploads it; the other 14,385 blocks have no artifact to keep in sync. Each patched run records `execution_metadata.names_backfilled_at` and the `name-blocks` run id (Q8, resolved).

**D11. Consumers show the name when it exists and nothing when it is null; the agent's `label` does not change.** The block name is canonical data, so chips, the lightbox title and the PDF read it from `content_block` (or from a `blockName` the bureau gate stamps onto `sheetReferences` from the manifest, §7.3) rather than asking the review agent to write it into `label`. `blocks.md` headings render the name so agents see it, which improves the labels they already write, but nothing downstream depends on that. **No fallback**: when `name` is null the chip is `S{n} · {sheet label}`, exactly what cityhall#714 renders today; no label-derived or position-derived third segment is ever synthesised (Q7, resolved).

**D12. Both search RPCs return `name`.** `search_content_blocks_hybrid` / `_keyword` gain a `name text` column in `RETURNS TABLE`. Adding a column changes the return type, which `CREATE OR REPLACE` rejects, so the migration drops and recreates both, then restores the grants, `search_path` and ownership that three later migrations set (§5.4). `name` is **not** added to the tsvector or the GIN index in the first batch; that is D14.

**D13. IG's run-validation suite checks the name.** `inspector-general` `preprocessing-validation.ts` adds: every v4 artifact block has a non-empty `name` that passes the rule's mechanical checks (word count, Title Case, no `Block N`), and artifact `name` equals DB `name` after publish.

**D15. The block name reaches consumers by being stamped at write time, once, by a script.** The review agent never sees or writes a `blockName`; its output is unchanged (`{documentId, sheetNumber, blockNumber, label}`). After the agent finishes, `block-number-gate.ts` (which already loads `block-manifest.json`, built by conductor from the database at workspace download) copies `manifest.blockNames[blockNumber]` onto each validated sheet reference. `review_comments.output_json.sheetReferences[]` therefore carries `{documentId, sheetNumber, blockNumber, blockName, label}`, and every consumer reads one field it already parses. No consumer joins to `content_block` for the name; the one exception is the lightbox, which already queries the row for its bounding box and reads `name` in that same query. Consequence, accepted: reviews written before the gate ships have no `blockName` and render `S{n} · {label}` until re-run; a later rename of a block does not propagate into old reviews (Q6, resolved).

**D14. The name becomes keyword-searchable in a second phase (P5), after the backfill has run.** `COALESCE(name,'')` joins the tsvector expression in both search RPCs and the GIN index `idx_content_block_text_search`, so the hybrid RPC's keyword leg finds "Meter Notice" by its heading. Sequenced after P3 so the index is built over real names, not 17,723 nulls (Q1, resolved: yes, phase 2).

## 3. The name

### 3.1 The rule (shared prompt fragment)

Lives once, at `bureau/runbooks/lib/block-name-rule.md`, and is included verbatim by the v4 reader prompt (Read 3) and the backfill prompt (§6.2). Text:

```
name — a short noun phrase a plan reviewer would use to point at this element on the sheet.
  · 2–6 words, Title Case, no trailing period.
  · Use the element's PRINTED HEADING when it has one, as printed: "Sheet Index",
    "General Notes", "Legend", "Meter Notice", "Compatibility Setback Table",
    "Detail 3-A Valley Gutter", "Erosion Control Notes".
  · Otherwise use the drafter's name for what it is: "Engineer's Seal", "Surveyor's
    Certificate", "Site Plan Release Form", "Revision Table", "Vicinity Map", "Curve Table",
    "North Elevation", "Sheet Layout Key Map".
  · Never "Block N", never the sheet's own title, never a sentence, never our process
    words (block, crop, read, step, contract). A bare category word ("Notes", "Table") only
    when there is truly no heading and nothing better to call it.
  · Two blocks on one sheet may share a name only when they are genuinely the same kind of
    element ("General Notes" continued in a second column); otherwise qualify them
    ("General Notes 1–11", "General Notes 12–20").
```

### 3.2 What the rule produces on real blocks

Applied by hand to the §1.2 rows, so the reader can judge the target:

| Sheet · block | category | name |
|---|---|---|
| S1 · 2 | table | Sheet Index |
| S1 · 10 | seal | Engineer's Seal |
| S1 · 12 | form | Site Plan Release Form |
| S14 · 5 | table | Compatibility Setback Table |
| S29 · 5 | diagram | Detention Vault Section |
| S55 · 9 | notes | Surveyor's Certificate |

And the chip the PDF redesign wants, composed at render time from data this spec makes available: `S{sheet_number} · {sheet_version.label} · {content_block.name}` → `S14 · Dimensional Control & Site Plan (1 of 2) · Compatibility Setback Table`. When `name` is null (pre-backfill rows, legacy-writer rows) the chip is `S{sheet_number} · {sheet_version.label}` and stops there (D11). Position words from the bounding box are not derived anywhere.

### 3.3 Mechanical checks (the contract and the backfill validator share them)

- non-empty, ≤ 60 characters, 2–6 whitespace-separated words (a single word passes only if it is a heading-like category word: Legend, Notes, Table, Seal, Schedule);
- Title Case: no word starts lower-case except articles/prepositions inside the phrase (`of`, `and`, `for`, `to`, `the`, `on`, `in`);
- does not match `/\bblock\s*\d/i`, does not equal the sheet's `label` case-insensitively, contains none of `crop|read \d|step|contract|worker`;
- not a sentence: no terminal period, fewer than 7 words.

## 6. Backfill

### 6.1 Why not a partial preprocessing-v4 run

Three facts about v4 rule it out (bureau `runbooks/preprocessing-v4/`):

1. **There is no partial mode.** The request contract (`steps/1.1-inputs/contract.test.ts:11-37`) has `scope.sheets`, `scope.tracks`, `scope.documents`, `publish`, `directives`; no from-step, no "re-caption only". The only re-read path is `revise` at the 3.3 gate (README:61-70), which re-runs a sheet's reader in full over its prior `sheet.json` inside the same run folder.
2. **Every in-scope sheet is read from pixels, four reads, on Opus** (`runbook.yaml:11`, 2 h budget per sheet). Naming 1,655 sheet versions that way is a full re-preprocessing of the corpus to add one field.
3. **Staging existing blocks is barred by design.** `steps/1.2-stage/step.yaml:6-7`: *"The prior reading of this submission (summaries, labels, guides, blocks) is deliberately NOT staged: it is a previous run's answer (core rule 19)"*; `scripts/stage.py:21-24` says the same. A reader that could see the blocks it is supposed to name would be anchored, which is exactly what v4's comparison discipline forbids.

So the organic path (D3) names every block **from now on**, and a separate, cheap, read-the-rows-and-name-them runbook covers **everything before now**. The two share one rule (§3.1) so their output is indistinguishable.

### 6.2 The `name-blocks` runbook

`bureau/runbooks/name-blocks/`, conductor2-shaped like `smoke/` (runner presets in `runbook.yaml`, one `steps/*/step.yaml` per step, fan-out with `foreach`). Zero-token script steps bracket one cheap model step.

| Step | runner | What it does | Output |
|---|---|---|---|
| `1.1-inputs` | none | `request.json`: `{scope: "unnamed" \| {submission_version_ids[]} \| {sheet_version_ids[]}, publish: {allowed}, patch_artifacts: bool}` | `request.json` |
| `1.2-roster` | script | Reads `sheet_version` + `sheet.label` + `content_block(id, short_id, category, description, content, bounding_box)` for every sheet version in scope where any block has `name IS NULL` (`runbooks/lib/submission_db.py:266-282` `content_blocks()` already does the block read). Writes one item file per sheet version with `content` capped at 1,500 chars per block. | `items/<sheet_version_id>.json` |
| `2.1-name/<sheet_version_id>` | `namer` = `{harness: gateway, model: claude-sonnet-5}` (Q3, resolved) | One call per sheet version: the §3.1 fragment + the sheet label + the block list (short_id, category, description, content head, bbox as "upper-left / right margin / …" words). Returns `{ "<block id>": "<name>" }` for every block. Sees the whole sheet's blocks at once so sibling blocks get distinct names (rule's last bullet). | `names.json` |
| `2.2-check` | script | §3.3 mechanical checks per name; a failure rewrites the offender as `null` and lists it in `check.md`; a sheet with > 20 % failures is voided back to `2.1-name` once (`conductor void … --findings`) with the failures as notes. | `checked/<sheet_version_id>.json`, `check.md` |
| `2.3-hitl` | none | A sample: 30 random (sheet, block, name) rows with the block crop path, plus the failure list. `approved \| revise`. Skippable by `directives.decide` for unattended runs after the first few. | `decision.md` |
| `3.1-apply` | script, `control_plane: true` | `PATCH content_block?id=eq.<id> {name}` through PostgREST with the service role, 200 rows per batch, idempotent (`name IS DISTINCT FROM` guard in a preceding read). For every touched `sheet_version.preprocessing_run_id`, download that run's `artifact.json` from `runbook_output_storage_path`, set `sheets[].content_blocks[].name` by `short_id`, re-upload (D10). | `apply-record.json` |

Roster and cost, from prod on 2026-09-29: 1,655 sheet versions, 17,723 blocks, average 10.7 blocks per sheet version, `content` averaging 611 chars. With content capped at 1,500 chars a sheet call is roughly 5 k input tokens and 200 output, so the whole corpus is on the order of **8 M input tokens**: tens of dollars at Sonnet 5 pricing. Wall-clock is bounded by concurrency, not tokens; 1,655 short calls at 10-wide fan-out is under an hour.

Rule-19 posture: this runbook's input **is** Noetic's prior output, by design; it derives a label from a transcription, it does not answer a review question. Under the per-runbook conventions spec (winston#285) it declares the core fragments it takes and leaves the answer-bar fragment out; until that lands, its `AGENTS.md` says so in one line.

### 6.3 Re-runs and drift

- Re-running with `scope: "unnamed"` is the standing way to name legacy-writer rows (D8) and any sheet version whose publish landed a null name. It is idempotent.
- A v4 re-publish of a registered run restores the artifact's names (D10). A **legacy** carry-forward (`plan-set.logic.ts`) copies names (D7). The only path that reintroduces nulls is the legacy discovery writer, which the standing re-run covers.
- Names are not versioned. A re-run over `scope: {sheet_version_ids}` overwrites; the apply record keeps the previous value for audit.

| **P5** (phase 2) | substation | D14: `COALESCE(name,'')` into both search RPCs' tsvector and the GIN index; one migration. | P3 complete (index built over real names) |

Deploy order that matters: **P0 before P1** (a v4 publish carrying `name` against a database without the column fails the INSERT); **P0 before P2/P4** (selecting a column that does not exist errors). P3 and P4 are independent of each other; P5 waits for P3.

---

## 9. Open questions

**Q1. Should `name` be searchable?** **Resolved (Will, 2026-09-29): yes, as phase 2.** Not in the first batch; D14 / P5, after the backfill.

**Q2. Retire the legacy Inngest block writer's exemption (D8)?** **Resolved: no.** Preprocessing-v4 is the convention; retiring legacy paths is not this spec's job. The standing backfill re-run covers anything the legacy writer still creates.

**Q3. Backfill model.** **Resolved: Sonnet 5** (`namer` runner, §6.2).

**Q4. Title Case vs as-printed.** **Resolved: Title Case**, never the sheet's all-caps (D2 stands; one rule, one contract test).

**Q5. Should the reader emit `name` for the `title_block` block?** **Resolved: yes** (D3 amended).

**Q6. `blockName` stamped at write time (§7.3) versus resolved at read time.** **Resolved (Will, 2026-09-29): stamp at write time only** (D15). For the record, the two options were: Stamping: the evidence gate copies the name into `sheetReferences[].blockName` when the review is written; chips and the PDF read it from the comment with no lookup; reviews written before the gate ships never show names unless re-run, and a rename does not propagate. Resolving: cityhall and the PDF look up `content_block.name` by sheet version + `short_id` at render; always current, old reviews light up after the backfill, but every render joins and the cityhall loader gains a query. Chosen: stamp only; the lightbox keeps its own live lookup (it already fetches the bbox) and reads `name` in the same query. Neither option lets the agent write the name; both read it from `content_block` via a script or a query.

**Q7. Position fallback words.** **Resolved: no fallback of any kind.** A null name renders `S{n} · {sheet label}` (D11 amended, §3.2 rewritten).

**Q8. Artifact patch scope (D10).** **Resolved: patch, and record it** in `execution_metadata` (`names_backfilled_at` + the `name-blocks` run id).

---

## 10. Out of scope

- The RDS `EvidenceChip` partial and the PDF layout: the CC PDF redesign spec.
- Block-level evidence on non-plan-set documents: `content_block` is sheet-only (`sheet_version_id NOT NULL`), documents have `document_section` with no geometry; a separate spec (parked 2026-09-29).
- Range chips (`S2–3`), grouping consecutive sheet references: renderer logic, no data change.
- Renaming or re-boxing existing blocks; changing `category` vocabulary across the legacy long tail.
- Retiring the legacy Inngest block writer or any other pre-PPv4 path (Q2).
- Any synthesised third chip segment when `name` is null: no label parsing, no bounding-box position words (Q7).

<script data-reader>
/* spec-kit v5 — spec reader. Renders the embedded markdown (#spec-md) with marked, assigns
   deep-link ids, builds the TOC, and highlights the :target.
   ids assigned:
     headings   → GitHub-style slug of the text, PLUS an alias  s<number> for numbered headings
                  ("### 3.2 Piece A" → #s3-2, "## 1. Problem" → #s1)
     tokens     → the first <strong> whose text starts with P0a / D12 / Q6 gets id="P0a" etc.
   So a companion page can link to  SPEC.html#s3-2 , #D12 , #P0a , #Q6 . */
(function(){
  const raw=document.getElementById('spec-md').textContent.replace(/<\\\/script/g,'</script').trim();
  const body=document.getElementById('spec-body');
  marked.use({gfm:true,breaks:false});
  // a run of **Label:** lines (the spec header block) is meant to stack: give each a hard break
  const md=raw.replace(/^(\*\*[^*\n]+:\*\*[^\n]*)$/gm,'$1  ');
  body.innerHTML=marked.parse(md);
  const used=new Set();
  const slug=t=>t.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  const uniq=id=>{let i=id,n=1;while(used.has(i))i=id+'-'+(n++);used.add(i);return i;};
  // headings
  body.querySelectorAll('h1,h2,h3,h4').forEach(h=>{
    const text=h.textContent.trim();
    h.id=uniq(slug(text));
    const m=text.match(/^(\d+(?:\.\d+)*)\.?\s/);
    if(m){const a=document.createElement('span');a.id=uniq('s'+m[1].replace(/\./g,'-'));a.className='anchor';h.before(a);}
  });
  // tokens: **D4.** / **P0a …** / **Q6.**
  body.querySelectorAll('strong,b').forEach(s=>{
    const m=s.textContent.trim().match(/^(P\d[a-z]?|D\d+|Q\d+)\b/);
    if(m&&!used.has(m[1])){s.id=m[1];used.add(m[1]);s.classList.add('tok');}
  });
  // tables scroll instead of the page
  body.querySelectorAll('table').forEach(t=>{t.classList.add('spectable');const w=document.createElement('div');w.className='spectable-scroll';t.before(w);w.appendChild(t);});
  // title + meta
  const h1=body.querySelector('h1'); if(h1){document.getElementById('reader-title').textContent=h1.textContent;document.title=h1.textContent;h1.remove();}
  const status=raw.match(/\*\*Status:\*\*\s*([^\n]+)/),date=raw.match(/\*\*Date:\*\*\s*([^\n]+)/);
  document.getElementById('reader-meta').textContent=[status&&status[1],date&&date[1]].filter(Boolean).join(' · ');
  // TOC from h2/h3
  const toc=document.getElementById('toc');
  body.querySelectorAll('h2,h3').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className='toc-'+h.tagName.toLowerCase();toc.appendChild(a);});
  // sibling .md links stay .md (GitHub renders them; a reader for them may not be built). If a
  // sibling reader IS built, link to it explicitly from the markdown as .html.
  // scroll to :target after ids exist
  if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView({block:'start'});}
})();
