<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Verdict / Triage Split and Appeal</title>
<style>
/* ============================================================
   spec-kit v5.1  —  winston HTML spec design system
   Inline the ENTIRE contents of this file into the spec's style block.
   Canonical source: ~/.claude/skills/winston-spec/assets/spec-kit.css
   When you change this file, bump the version above and in COMPONENTS.md.
   v4: + sequence diagram (.seq*), + data table (.spectable), + prompt block (.prompt)
   v5: + system map (.sysmap/.sys, edges drawn by spec-kit.js), + decision flow (.dflow),
       + concept figure (figure.concept), + claim caption (.claim), + reference chip rows (.sys-refs),
       + spec reader page (body.reader; DESIGN-SPEC.md rendered by marked, built by inline-kit.py --spec)
   v5.1: pass-2 friction fixes — long identifiers wrap (.sys .t, .uc .nt, .ent .ty), .sysmap-scroll for
       6+ columns, state-neutral .sm pills, .dflow jump outcomes, legend 'new trigger' dot
       Colour rule: fill/border = change state only; kind = badge text + shape; legend is the
       complete list of colour meanings on the page.
   ============================================================ */

:root{
  /* steel-blue ramp (matches cityhall / Noetic report surfaces) */
  --p50:#f0f5f9;--p100:#dce8f1;--p200:#b9d2e5;--p300:#8cb4d1;--p400:#6397b8;
  --p500:#517e9e;--p600:#3f6582;--p700:#35526b;--p800:#2d4559;--p900:#273b4b;--p950:#182530;
  --bg:#f9f9f9;--card:#ffffff;--divider:#dfdfdf;--ink:#1f2937;--muted:#6b7280;--ember:#bb4d00;
  /* semantic: new / changed / retired */
  --new:#15803d;--newbg:#f0fdf4;--newbd:#bbf7d0;
  --chg:#b45309;--chgbg:#fffbeb;--chgbd:#fde68a;
  --ret:#b91c1c;--retbg:#fef2f2;--retbd:#fecaca;
  --sans:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --mono:'Fira Code','SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:15px}

/* ---------- masthead ---------- */
header.masthead{background:linear-gradient(135deg,var(--p800),var(--p600));color:#fff;padding:34px 32px 30px;position:relative;overflow:hidden}
header.masthead::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);pointer-events:none}
header.masthead .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--p200)}
header.masthead h1{font-family:var(--serif);font-weight:600;margin:.35em 0 .2em;font-size:29px;position:relative}
header.masthead p{margin:0;color:var(--p100);max-width:880px;font-size:15px}
header.masthead .meta{margin-top:14px;font-size:12.5px;color:var(--p200);font-family:var(--mono)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;background:var(--p950);padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-wrap:wrap}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--p200);font-family:var(--sans);font-size:14px;font-weight:500;padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
nav.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-right:7px}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.04)}
nav.tabs button.active{color:#fff;border-bottom-color:var(--ember);background:rgba(255,255,255,.06)}

/* ---------- layout ---------- */
main{max-width:1140px;margin:0 auto;padding:30px 26px 90px}
.panel{display:none;animation:fade .25s ease}
main [id]{scroll-margin-top:74px} /* deep-link targets clear the sticky tab bar */
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Section heading: the h2 text is the PLAIN NAME of the thing the tab is about (v5.1 — it used to
   carry a tagline while the small eyebrow carried the name; that was backwards). .eyebrow = the
   tab number / section label, small. .sub = one plain sentence saying what is on the tab. */
h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:34px 0 10px;color:var(--p950)}
h2:first-child{margin-top:4px}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--p500);font-weight:400;margin-bottom:6px}
h2 .sub{display:block;font-family:var(--sans);font-size:14px;font-weight:400;letter-spacing:0;line-height:1.5;color:var(--muted);margin-top:6px}
h3{font-size:16px;font-weight:600;margin:28px 0 8px;color:var(--p800);display:flex;align-items:center;gap:9px}
h3 .hn{font-family:var(--mono);font-size:12px;color:#fff;background:var(--p600);border-radius:5px;padding:2px 8px}
h4{font-size:14px;font-weight:600;margin:18px 0 6px;color:var(--p800)}
p{margin:.55em 0}
.lede{font-size:15px;color:var(--p800);border-left:3px solid var(--ember);padding-left:16px;margin:12px 0 20px}
ul{margin:.4em 0;padding-left:22px}li{margin:.28em 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--p50);border:1px solid var(--p100);border-radius:4px;padding:1px 5px;color:var(--p800)}

/* ---------- callout ---------- */
.callout{background:var(--p50);border:1px solid var(--p200);border-left:4px solid var(--p500);border-radius:8px;padding:13px 17px;margin:16px 0}
.callout.ember{background:#fdf6f0;border-color:#f0cba8;border-left-color:var(--ember)}
.callout.new{background:var(--newbg);border-color:var(--newbd);border-left-color:var(--new)}
.callout .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:600;display:block;margin-bottom:3px}
.callout.ember .lab{color:var(--ember)} .callout.new .lab{color:var(--new)}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:12px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.swatch{width:26px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}

/* ---------- shared field badges (used by entity rows + legend) ---------- */
.b{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;padding:1px 4px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.b-pk{background:#fef3c7;color:#92600a;border:1px solid #fde68a}
.b-fk{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.b-nn{background:#eef1f4;color:#4b5563;border:1px solid #d7dde3}
.b-new{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   ER / UML entity boxes
   ============================================================ */
.erd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:16px 0;background:#fbfcfd;border:1px solid var(--divider);border-radius:12px;padding:18px}
.ent{border:1px solid var(--divider);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:236px;flex:0 1 auto}
.ent .eh{padding:7px 12px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ent .eh .en{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.ent .eh .stereo{font-size:9.5px;font-family:var(--mono);opacity:.85;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ent.exist .eh{background:var(--p700)}
.ent.newt .eh{background:var(--new)}
.ent.changed .eh{background:var(--chg)}
.ent.retired .eh{background:#9ca3af}
.ent.retired{opacity:.72}
.ent .row{display:flex;align-items:center;gap:7px;padding:4px 11px;font-size:11.5px;border-top:1px solid #eef1f4}
.ent .row:first-of-type{border-top:0}
.ent .row .nm{font-family:var(--mono);font-size:11.5px;color:var(--p900);font-weight:600}
.ent .row .ty{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;text-align:right;max-width:60%;overflow-wrap:anywhere}
.ent .row.hi{background:#fff9f2}
.ent .row.strk .nm{text-decoration:line-through;color:var(--muted)}
.ent .note{padding:5px 11px;font-size:10px;color:var(--muted);font-style:italic;border-top:1px dashed #e5e9ee;background:#fbfcfd}
/* diff rows — show a table modification (column added / removed), git-style.
   Put a "+"/"−" marker in a .gut span at the start of the row. */
.ent .row .gut{flex:0 0 10px;width:10px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.ent .row.add{background:var(--newbg);box-shadow:inset 3px 0 0 var(--new)}
.ent .row.add .gut{color:var(--new)}
.ent .row.add .nm{color:#166534}
.ent .row.del{background:var(--retbg);box-shadow:inset 3px 0 0 var(--ret)}
.ent .row.del .gut{color:var(--ret)}
.ent .row.del .nm{color:var(--ret);text-decoration:line-through}

/* relationships panel — crow's-foot text notation */
.rels{background:#fff;border:1px solid var(--divider);border-radius:10px;padding:12px 16px;margin:14px 0;font-family:var(--mono);font-size:12px;line-height:1.9}
.rels .rl{display:block;color:var(--p800)}
.rels .rl b{color:var(--ember)}
.rels .cf{color:var(--p500);font-weight:700}
.rels .cmt{color:var(--muted);font-style:normal;font-family:var(--sans);font-size:11.5px}
.rels .tag-new{color:var(--new);font-weight:700}
.rels .tag-ret{color:var(--ret);font-weight:700}
.rels-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--p600);font-weight:700;margin-bottom:6px}

/* ============================================================
   Use-case scene  (an action + its boxes-and-arrows diagram)
   ============================================================ */
.uc{margin:16px 0 22px;border:1px solid var(--divider);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.uc .uch{display:flex;align-items:center;gap:13px;padding:11px 16px;background:linear-gradient(135deg,var(--p700),var(--p600));color:#fff}
.uc .uch .ucn{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);font-family:var(--mono);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.uc .uch .uctxt{flex:1}
.uc .uch .actor{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--p100);display:block;margin-bottom:1px}
.uc .uch .uct{font-weight:600;font-size:15.5px;font-family:var(--serif)}
.uc .ucsub{padding:9px 16px;font-size:12.5px;color:var(--p800);background:var(--p50);border-bottom:1px solid var(--p100)}
.uc .ucdiag{padding:20px 16px 14px}
.ucnote{padding:2px 16px 14px;font-size:11.5px;color:var(--muted)}
.ucnote b{color:var(--p700);font-family:var(--mono);font-size:10.5px}

/* ============================================================
   Boxes-and-arrows flow
   Robustness rules baked in:
   - .dfg WRAPS (flex-wrap:wrap) so long chains never clip / never
     need horizontal scroll. Arrows reflow with the nodes.
   - .node is a flex COLUMN: the op-badge is an in-flow header row
     (never position:absolute), and .nt / .nf are block-level, so a
     table name and its fields can never smush onto one line.
   ============================================================ */
.dfg{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;margin:0}
.node{flex:0 0 auto;width:156px;background:#fff;border:1.5px solid var(--p300);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.node .op{align-self:flex-start;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid;color:#fff;margin-bottom:2px}
.node .nt{display:block;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--p900);line-height:1.3;overflow-wrap:anywhere}
.node .nf{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.45;word-break:break-word}
.node.created{border-color:var(--new);background:var(--newbg)} .node.created .op{background:var(--new);border-color:var(--new)}
.node.read{border-color:var(--p400);background:#eef4fb} .node.read .op{background:var(--p500);border-color:var(--p500)}
.node.event{border-color:var(--ember);background:#fdf6f0} .node.event .op{background:var(--ember);border-color:var(--ember)}
.node.store{border-style:dashed;border-color:var(--p500);background:#eef3f7} .node.store .op{background:var(--p700);border-color:var(--p700)}
.edge{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;max-width:104px;padding:0 4px}
.edge .el{font-size:9px;color:var(--p600);font-family:var(--mono);text-align:center;line-height:1.3;margin-bottom:2px}
.edge .ar{color:var(--p400);font-size:20px;font-weight:700;line-height:1}

/* ============================================================
   Card grid  (keep / change / drop comparisons)
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.erd{padding:12px}}
.card{background:var(--card);border:1px solid var(--divider);border-radius:9px;padding:14px 16px}
.card.keep{border-top:3px solid var(--new)} .card.change{border-top:3px solid var(--chg)} .card.drop{border-top:3px solid var(--ret)}
.card strong{display:block;margin-bottom:4px;font-size:13.5px}
.card ul{font-size:12.5px;margin:2px 0}

/* ============================================================
   Lifecycle / state machine
   ============================================================ */
.sm{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0}
.sm .s{border:1px solid var(--p300);background:var(--p50);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--p800);font-family:var(--mono)}
.sm .s .who{display:block;font-size:9px;font-family:var(--mono);color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.sm .s.client{border-color:var(--newbd);background:var(--newbg)}
.sm .s.cc{border-color:#f0cba8;background:#fdf6f0}
.sm .s.spec{border-color:var(--chgbd);background:var(--chgbg)}
.sm .a{color:var(--p400);font-weight:700}
/* state-neutral variants (v5.1): terminal-good / terminal-stop / dimmed. The .client/.cc/.spec
   colours mean "whose court" and need a legend if used. */
.sm .s.ok{border-color:var(--newbd);background:var(--newbg);color:var(--new)}
.sm .s.stop{border-color:var(--retbd);background:var(--retbg);color:var(--ret)}
.sm .s.dim{opacity:.6;border-style:dashed}

/* ============================================================
   Use-case catalog — grouped list of candidate use cases
   (a scoped list, NOT a diagram — for "what would we build" inventories)
   ============================================================ */
.catgrp{border:1px solid var(--divider);border-radius:10px;overflow:hidden;margin:14px 0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.catgrp .cath{background:var(--p700);color:#fff;padding:8px 14px;font-family:var(--serif);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
.catgrp .cath .cgl{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}
.uci{display:flex;gap:9px;align-items:baseline;padding:7px 13px;border-top:1px solid #eef1f4;font-size:13px}
.uci .uid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--p600);flex:0 0 26px}
.uci .utxt{flex:1;color:var(--ink);line-height:1.45}
.uci .utxt b{color:var(--p900)}
.uci .star{color:var(--ember);font-weight:700;font-size:12px;flex:0 0 auto;letter-spacing:-1px}
.uci.later{opacity:.66}
.utag{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}
.utag.t-orig{background:#e0edfb;color:#2456a8;border:1px solid #c3d8f2}
.utag.t-add{background:var(--newbg);color:var(--new);border:1px solid var(--newbd)}

/* ============================================================
   Misc: storage strip, cross-reference box
   ============================================================ */
.storage{background:#eef3f7;border:1px dashed var(--p300);border-radius:8px;padding:9px 13px;font-family:var(--mono);font-size:12px;color:var(--p800);margin:12px 0}
.storage b{color:var(--ember)}
.xref{font-size:12px;color:var(--p600);background:var(--p50);border:1px solid var(--p100);border-radius:6px;padding:8px 12px;margin:10px 0}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--divider);color:var(--muted);font-size:12px;font-family:var(--mono)}

/* actor / repo chips (optional, for inline actor tags in prose) */
.rc{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid;vertical-align:middle;white-space:nowrap}
.r-ch{background:#eef4fb;color:#2456a8;border-color:#c3d8f2}
.r-sub{background:#f3eefb;color:#6b3fa0;border-color:#dcccf0}
.r-fa{background:#e9f7f2;color:#0f7a5f;border-color:#bfe8db}
.r-db{background:#eaeef2;color:#2d4559;border-color:#c7d2dd}
.r-store{background:#e6eef3;color:#35526b;border-color:#bcd0dd}
.r-user{background:#eefaf0;color:#15803d;border-color:#bbf7d0}
.r-mcp{background:#fdf0e6;color:#b5590d;border-color:#f2d3b3}

/* ============================================================
   Sequence diagram — swimlane message flow
   A CSS grid: col 1 = step number, then one column per actor lane.
   Each message is a grid item that SPANS grid-columns from its
   source lane to its target lane, so it always sits under the right
   headers and never smushes. Continuous lifelines are grid items
   spanning all rows (grid-row:1/-1) — so set .seq-body's
   grid-template-rows to repeat(STEP_COUNT, auto) for -1 to resolve.
   Wide diagrams scroll inside .seq-scroll, never the page body.
   Direction is an in-flow glyph (.dir ◂/▸) pushed to the target edge
   by justify-content:space-between — never position:absolute.
   ============================================================ */
.seq-scroll{overflow-x:auto;margin:16px 0;border:1px solid var(--divider);border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.seq{min-width:840px}
.seq-head,.seq-body{display:grid;grid-template-columns:30px repeat(6,minmax(104px,1fr))}
.seq-head{background:linear-gradient(135deg,var(--p800),var(--p700));padding:11px 12px}
.seq-h{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 4px}
.seq-h .role{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--p200)}
.seq-h .who{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:6px;padding:3px 9px}
.seq-body{position:relative;row-gap:11px;padding:16px 12px 20px}
.seq-life{width:2px;background:var(--p100);justify-self:center;border-radius:2px;z-index:0}
.seq-num{grid-column:1;justify-self:center;align-self:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--p600);min-width:19px;height:19px;padding:0 3px;border-radius:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.seq-msg{align-self:center;display:flex;flex-direction:row;align-items:center;gap:8px;justify-content:space-between;background:#fff;border:1.5px solid var(--p300);border-radius:7px;padding:5px 10px;z-index:1;min-width:0}
.seq-msg .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.seq-msg .m{font-family:var(--mono);font-size:10.5px;color:var(--p900);font-weight:700;line-height:1.32;word-break:break-word}
.seq-msg .m2{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.3;word-break:break-word}
.seq-msg .dir{font-size:14px;font-weight:700;color:var(--p500);flex:0 0 auto}
.seq-msg.write{border-color:var(--new);background:var(--newbg)} .seq-msg.write .dir{color:var(--new)}
.seq-msg.event{border-color:var(--ember);background:#fdf6f0} .seq-msg.event .dir{color:var(--ember)}
.seq-msg.ret{border-style:dashed;background:#f6f9fb} .seq-msg.ret .m{font-weight:500;color:var(--p600)}
.seq-msg.self{border-style:dashed;border-color:var(--p400);background:#eef3f7}
.seq-foot{display:flex;flex-wrap:wrap;gap:8px 15px;padding:9px 14px;border-top:1px solid var(--divider);background:#fbfcfd;font-size:10.5px;font-family:var(--mono);color:var(--muted);align-items:center}
.seq-foot .sw{display:inline-block;width:20px;height:11px;border-radius:3px;border:1.5px solid var(--p300);vertical-align:middle;margin-right:5px}
.seq-foot .sw.write{border-color:var(--new);background:var(--newbg)} .seq-foot .sw.event{border-color:var(--ember);background:#fdf6f0}

# CC Verdict / Triage Split and Appeal

**Status:** Draft v1.2
**Date:** 2026-10-05
**Repos touched:** `cityhall-new` (phase 1: declarative schema with one trigger, one RPC, one column; `set-triage` split; `TriageCard`; CC landing + Overall results; CC PDF override wording), `dsd` (phase 2: RDS `StatusSummary` + `ChecklistFinding` for appeals), then `cityhall-new` again (phase 2: CC PDF appeals)
**Repos NOT touched:** `cityhall` (old app), `substation`, `bureau`, `conductor2`, `inspector-general`

> **Revision note (v1.1, 2026-10-05):** Will answered Q1–Q8. Q1 CRC stays as is. Q2 any Noetic member. Q3 the formal-note sub-status is removed from the CC flow only, because formal reviews hold 1,044 rows using it (D6, D4 step 5). Q4 fail/warn/uncertain. Q5 no notifications. Q6/Q7 an appealed count goes in the UI's Overall results now (D10) and, with a per-finding indicator and the appeal text, in the CC PDF as **phase 2** (D11, dsd RDS work). Q8 no answer state or re-appeal: v1's open/answered state and the `triage_updated_at` column are dropped (D7). §3 and §5 split into phase 1 and phase 2.
>
> **Revision note (v1.2, 2026-10-05, grill session G1–G20, §6.2):** `verdict_override_by`/`_at` dropped as scope creep (G13), leaving one new column. **The D5 data migration is removed**: no existing `comment_triage` row is written (new D13, G14); old rows are read through a legacy rule instead. The trigger also covers DELETE, so a customer can't delete Noetic's override (G2). Appeals can be withdrawn, edited and switched with Formal note (G6–G8); Noetic's reason is optional and customer-facing (G10, G11). Phase 1 PDF is reduced to note-source plumbing with no visible change and keeps the neutral "a human reviewer" wording; the uncertain gate moves to phase 2 (G13, G17). Phase 2 starts after phase 1 ships (G18).

Builds on [verdict-override-refactor](../verdict-override-refactor/DESIGN-SPEC.md), which split one 5-value `triage_status` into two axes on `comment_triage`: `verdict_override` (what the correct status is) and `triage_status` (what the customer is doing about it). That spec gave both axes to the same people. This one gives them to different people.

---

## 1. Problem

On a completeness check (CC), anyone with write access to the project can do two different things to an item: correct its verdict (Pass / Fail / Warn / Uncertain), and triage it (To fix / Formal note + a note). One RLS policy covers both, so a customer org admin can overturn the agent's verdict on their own plan set, and a Noetic reviewer can write the customer's triage.

The wanted split:

| | Verdict override | Customer triage |
|---|---|---|
| Noetic member (`is_noetic_member`) | ✅ only them | ❌ |
| Customer with write access | ❌ | ✅ only them |
| Automated writers (service_role, `workflow_run`, postgres) | ✅ | ✅ |

And for CC, the customer's triage choices become **Formal note** and a new **Appeal**, both carrying a comment, both offered only on a non-passing verdict. Appeal is how a customer disputes a verdict now that they can't change it themselves, so it must show up for Noetic in the UI and in the CC PDF.

### 1.1 Verified facts

**Schema** (`cityhall-new/supabase/schemas/public/tables/comment_triage.sql`)
- Columns: `triage_status text NOT NULL DEFAULT 'new'`, `triage_sub_status`, `triage_note`, `verdict_override` (all nullable text), `updated_at`. `UNIQUE (review_comment_id)`. **No CHECK constraints** on any of the three status columns; allowed values live only in the column comment (L72). Adding `'appeal'` needs no constraint change.
- No `updated_by` / audit column, and no history table: who wrote an existing override is unknowable.
- One trigger: `set_comment_triage_updated_at` (L24-27).
- RLS: INSERT/UPDATE need `get_user_project_access_level ∈ (write, admin)` (L39-48); `workflow_run` has its own INSERT/SELECT/UPDATE policies scoped to its claimed project (L50-64).
- `get_user_project_access_level` returns `admin` for `is_noetic_admin` only (`functions/get_user_project_access_level.sql:19-21`). **A plain Noetic member (role `member`) has no write access to a customer project**, so they cannot pass the existing write policy today.
- `is_noetic_member` = any role in org slug `noetic`; `is_noetic_admin` = owner/admin only (`functions/is_noetic_member.sql`, `functions/is_noetic_admin.sql`). The app's `isStaff` is `is_noetic_member` (`src/lib/auth.ts:61`).
- `workflow_run` is a real Postgres role; its JWT has no `sub`, so `auth.uid()` is NULL (`substation/src/inngest/lib/run-token.ts:159-167`). service_role is detected as `auth.role() = 'service_role'` elsewhere (`tables/submission_version.sql:32`).
- cityhall-new owns prod migrations; schema is declarative (`AGENTS.md:111-125`): edit `supabase/schemas/**`, generate with `npx supabase@2.119.0 db schema declarative sync --no-apply -f <name>`, never hand-write a schema migration, list SECURITY DEFINER functions callable by `authenticated` in `supabase/definer-acl-allowlist.txt`. Jason pushes migrations.

**Writers.** In cityhall-new there is exactly one: server action `submitTriage` (`src/app/project/[projectId]/review/[reviewId]/actions.ts:27-44`) → `setTriage` (`src/lib/operations/set-triage.ts`), running as the signed-in user. `setTriage` **always** upserts `triage_status`, `triage_sub_status`, `triage_note`, and adds `verdict_override` only when a verdict was sent (L124-153). `TriageCard` sends status + note on every save, verdict only when changed (`triage-control.tsx:105-112`). No bulk triage exists. No bureau/conductor code writes `comment_triage` (`bureau/workflows/comment-resolution-check/README.md:54`).

**Masquerade.** `requireUser`/`createClient` become the customer (`src/lib/auth.ts:20-27`, `src/lib/supabase/server.ts:20-27`), so `auth.uid()` is the customer and `is_noetic_member` is false. An admin viewing as a customer gets the customer's side of this split for free.

**UI.** One control, `TriageCard` (`triage-control.tsx`), mounted in three places, each gated on `user_has_project_access(..., 'write')`:
- CC checklist landing `src/components/reviews/checklist-landing.tsx:184-194` (`offered = triageFor(review)`, `choices = verdictChoices(review)` at 143-144; N/A items get no verdict row, 193).
- `[discipline]/page.tsx:266-276` and `sheets/page.tsx:277-287`, used by CRC and formal (CC also reachable by URL).
- `triageFor` (`set-triage.ts:55-65`): post-cutover CC → `new`/`to-fix`/`formal-note`, `onlyAt: ["critical","major"]` (= fail, warn; `CC_VERDICT_OF`, `adapters/checklist.ts:94-99`). Everything else gets all five statuses and `onlyAt: null`.
- The verdict row draws only when `verdictChoices` is non-null: CC and CRC after their cutovers (`registry.ts:213-230`). Formal formats (`2026-04-simplified`, `2026-08-*`, `legacy`) have no verdicts.

**CC PDF.** Rendered by cityhall-new itself from `src/pdf` (`.../pdf/[kind]/route.ts:5-13,40-46`), as the signed-in user; substation's copy only serves the old app. The PDF reads all four columns (`cc-report-data.ts:160-182`). On post-cutover checks, `getNewSideAnnotations` (`cc-report-logic.ts:231-276`) prints an override line, then a disposition line only on fail/warn, only for values in `CC_DISPOSITION_VALUES = {to-fix, formal-note}` (175). **An unknown status such as `appeal` is silently dropped** today. The single `triage_note` is printed once, on the override line if overridden, otherwise on the disposition line (249-251).

**Prod data** (project `mgxqsrjutswbciyrltwd`, 2026-10-05):

| CC era (`completed_at` vs `2026-07-07T21:00Z`) | Reviews | Triage rows | Overrides | To-fix / formal-note | Overrides with a note |
|---|---|---|---|---|---|
| Before cutover | 42 | 142 | 0 | 57 | 0 |
| After cutover | 8 | 14 | 13 | 0 | 3 |

The post-cutover CC surface this spec changes is 8 reviews and 14 rows. CRC: 15 reviews, 545 overrides (415 with notes). Formal (`review`/`formal`): ~318 reviews, 0 overrides.

---

## 2. Decisions

**D1. Scope: post-cutover CC only.** Every rule in this spec applies to a `comment_triage` row whose review has `review_type = 'completeness_check'` and `completed_at > '2026-07-07T21:00:00Z'` (the same instant as `CC_VERDICT_TRIAGE_CUTOVER_AT`). Pre-cutover CC, CRC and every formal format behave exactly as today. Formal has no verdict to split, and pre-cutover CC is corrected through triage (`incorrect`/`na`), so splitting either would remove someone's only correction tool. CRC is deferred (Q1): customers use its override heavily (545 rows) and we can't tell who wrote them.

**D2. "Noetic" means `is_noetic_member`,** matching the app's `isStaff`, admins and plain members alike (Q2). Under masquerade it's false (§1.1), which is what we want (G3). Project visibility is **not** widened: `user_can_see_project` still admits only Noetic admins everywhere, so a plain Noetic member reaches the verdict control only on projects they've been granted. Today the Noetic org has 2 owners, 4 admins and 1 member, so in practice everyone who does overrides is an admin (G1).

**D3. Verdict writes go through a SECURITY DEFINER RPC, not the table policy.** `public.set_cc_verdict_override(p_review_comment_id uuid, p_verdict text, p_note text)`:
- Refuses unless `is_noetic_member(auth.uid())`.
- Resolves the review from the comment (never from the caller), refuses unless it is in D1's scope.
- Validates `p_verdict ∈ {pass, fail, warn, uncertain, not-applicable}` or NULL (NULL = clear the override; the app sends NULL when the pick equals the agent's verdict, as `setTriage` does today).
- `p_note` is **optional** (G10); blank is stored as NULL.
- Upserts on `review_comment_id`, writing only `verdict_override` and `verdict_override_note`. Triage columns are never in the payload.
- Added to `definer-acl-allowlist.txt`, `EXECUTE` revoked from `anon`/`PUBLIC` and granted to `authenticated` only.

This avoids widening the INSERT/UPDATE policies to all Noetic members, which would also hand them write access to formal reviews. A plain Noetic member can correct a CC verdict without gaining any other write on the project.

**D4. A trigger enforces the split on direct table writes.** `public.enforce_cc_verdict_triage_split()`, `BEFORE INSERT OR UPDATE OR DELETE` on `comment_triage`, SECURITY INVOKER:
1. **Bypass** when `auth.uid() IS NULL` or `current_user IN ('postgres', 'service_role', 'workflow_run', 'supabase_admin')`. This covers automated writers, migrations and the D3 RPC (definer → `current_user` is the owner).
2. **Out of scope** (D1) → allow unchanged. The review lookup goes through a small SECURITY DEFINER helper `cc_split_applies(review_id uuid) returns boolean`, so the check can't be hidden by `reviews` RLS.
3. **DELETE** of a row whose `verdict_override` or `verdict_override_note` is set, by a non-Noetic writer → raise `42501` "Only Noetic can remove a completeness check verdict." (G2). Today the DELETE policy lets anyone with project `admin` access (a customer org admin) delete the row, and Noetic's override with it. The app never deletes triage rows; a customer withdraws an appeal by an UPDATE (D7), so nothing a customer does in the app is refused here.
4. **Verdict columns** (`verdict_override`, `verdict_override_note`) changed (`IS DISTINCT FROM` OLD, or from NULL on INSERT) → raise `42501` "Only Noetic can change a completeness check verdict." The RPC is the only authenticated path.
5. **Triage columns** (`triage_status`, `triage_sub_status`, `triage_note`) changed (vs OLD, or vs the defaults `'new'`/NULL/NULL on INSERT) and `is_noetic_member(auth.uid())` → raise `42501` "Noetic can't triage a customer's completeness check."
6. Customer triage on CC must use the CC vocabulary (D6): `triage_status ∈ {new, formal-note, appeal}` and `triage_sub_status IS NULL`, else raise `22023`. Values already on a row are left alone unless the write changes them.

The comparisons are by value, so an upsert that rewrites unchanged columns (today's `setTriage`) passes. The trigger name sorts before or after `set_comment_triage_updated_at`; either order is harmless.

Why one row and a trigger, not two tables (G2, option A): moving CC's verdict to its own table would let RLS alone enforce the split, but CRC keeps its verdict in `comment_triage.verdict_override` (545 rows, Q1), so the verdict would live in two places by review type and every reader (CC/CRC/CRV PDFs, counts, adapters, IG) would have to know which. Revisit if CRC ever gets the same split.

**D5. The verdict gets its own note, and no existing data is written.** One new nullable column, `verdict_override_note text`. Today one `triage_note` serves both axes (`cc-report-logic.ts:249-250`); once two different people write the two axes, sharing it would let each overwrite the other's words. From now on customer text goes in `triage_note` and Noetic's reason in `verdict_override_note`.
- **No data migration** (D13). Existing rows keep their reason in `triage_note`. Readers apply one legacy rule: **the verdict's reason = `verdict_override_note`, or, when that is NULL and `triage_status = 'new'`, `triage_note`**. That covers the 3 post-cutover CC overrides that carry a note (all `triage_status = 'new'`) without touching them.
- No author or timestamp columns. v1 had `verdict_override_by`/`_at`; they were scope creep (G13): `_at` only served the dropped answered state and `_by` only PDF wording, and nothing records the customer's side either. Attribution for both sides can be its own change.

**D6. CC customer triage vocabulary: `new` / `formal-note` / `appeal`.**
- `to-fix` is no longer offered on CC (it still renders where it exists; none exist post-cutover).
- **The formal-note sub-status (Need to escalate / Will fix later) is removed from the CC flow only** (Q3). It can't go entirely: formal reviews hold 1,044 rows using it (358 escalate, 686 will-fix) and CRC 11. On CC the Follow-up select is not rendered, `setTriage` drops any sub-status, and D4 refuses one. Formal and CRC keep it unchanged.
- **Both require a non-empty comment.** `setTriage` refuses an empty note for `formal-note`/`appeal` on CC ("Add a comment to file an appeal.").
- **Offered only on fail, warn and uncertain** (`onlyAt: ["critical","major","minor"]`), judged on the *effective* verdict, so an item Noetic overrode to fail/warn/uncertain can be appealed too (G4). Uncertain items get triage for the first time (G16). Not offered on pass or N/A (Q4).
- Anyone with write access to the project can triage, as today (G9).
- `'appeal'` is added to the `TriageStatus` union and to a CC-only list. The generic five-value `TRIAGE_STATUSES` that formal and CRC render is **not** extended, so their menus, filters and badges are unchanged.

**D7. What an appeal is.** A customer saying "we think this verdict is wrong, and here's why": `triage_status = 'appeal'` + `triage_note`. It's a request to Noetic, not a change to the verdict. Noetic acts on it by setting a verdict override (optionally with a reason) or by leaving the verdict alone.
- **Edit:** the customer can change the comment and Save (G7).
- **Switch:** Formal note ↔ Appeal keeps the comment text; one status at a time (G8).
- **Withdraw:** the customer can withdraw (G6), which sets `triage_status = 'new'` and clears `triage_note`. Clearing matters: under D5's legacy rule a leftover customer note on a `new` row of an overridden item would read as Noetic's reason. This is the user clearing their own text, not a data migration.
- **No answer state, no re-appeal, no back-and-forth** (Q8). An item is appealed or not. If Noetic changes an appealed item between failing verdicts (fail → warn), the appeal stays visible and counted (G5). If Noetic overrides it to pass, the item stops being non-passing, D6 hides the triage tabs, and the stored appeal stays in the row but is not shown or counted (D10).
- **No notification** (Q5). Noetic finds appeals by opening a check and reading the appealed count and badges (G12).
- An admin viewing as a customer (masquerade) can file appeals as that customer; the writes are logged in `masquerade_audit` (G3).

**D8. `TriageCard` renders one side per viewer.** It gets an `actor: "staff" | "customer"` prop.
- **Staff** (`isStaff`, already read by all three pages): the verdict row + an optional "Reason" note (writes `verdict_override_note`) + Save, via a new `setVerdict` operation → `set_cc_verdict_override` RPC. Below it, the customer's triage read-only: "Appealed: *comment*" or "Formal note: *comment*". No triage tabs.
- **Customer:** the verdict read-only (agent verdict, or "Noetic changed this from Fail to Pass" + the reason when there is one), then the triage tabs `Formal note` / `Appeal` + required Comment + Save + Withdraw. No verdict row, no Follow-up select.
- Noetic's reason is **customer-facing** text, shown in the UI and printed in the PDF (G11).
- **Mount gate:** staff mount on `isStaff` (not on write access, which plain Noetic members lack); customers keep the `canTriage` write-access gate. Out-of-scope reviews (D1) keep today's card unchanged.

**D9. `setTriage` is split in two.**
- `setTriage` loses its `verdict` input. On CC it validates the D6 vocabulary and comment rule, drops any sub-status, and on `new` (withdraw) clears the note.
- New `setVerdict(supabase, { reviewCommentId, verdict, note })` calls the RPC and maps `42501` to "Only Noetic can change this verdict."
- `submitTriage` stays the customer action; a new `submitVerdict` server action is the staff one. Both call `requireUser()` + `createClient()`, so the DB is the only permission check, as today.

**D10. Appeals in the cityhall-new UI (phase 1).** Only these two places (G15):
- **Overall results** (`src/components/reviews/overall-results.tsx`): the appealed count joins the `aside` text beside the bar legend, to the left of N/A: `3 appealed · 70 N/A · 2 corrected`. Not a bar segment. Shown only when > 0, to customers and Noetic alike. `src/lib/reviews/check-results.ts` gains `appealed` (it already reads `comment_triage` for verdicts, L44-54; it now also reads `triage_status`).
- **Row badge** "Appealed" (amber tone) on the CC landing item (`checklist-landing.tsx:300-320`), plus Appeal in the landing's Notes filter (265-272), which comes automatically from D6's list.
- **Appealed count** = items whose effective verdict is fail, warn or uncertain and whose `triage_status = 'appeal'`.

**D11. CC PDF.** Phase 1 changes nothing a reader sees (G17); phase 2 adds appeals.
- **Phase 1 (cityhall-new, data plumbing only):** `cc-report-data.ts:160-182` selects `verdict_override_note`, and `getNewSideAnnotations` (`cc-report-logic.ts:231-276`) takes the override line's comment from D5's legacy rule and the disposition line's comment from `triage_note` only. Without this, a new Noetic reason would not print, and a customer's appeal text would print as "Comment:" under Noetic's override. Wording stays "a human reviewer determined…" (neutral, true for old and new rows; G13 option b). The fail/warn disposition gate, layout and annotations are otherwise unchanged; appeals are not printed (`appeal` stays out of `CC_DISPOSITION_VALUES`).
- **Phase 2 (dsd RDS release, then cityhall-new), after phase 1 ships (G18):**
  - **Summary count.** "N Appealed" joins the `StatusSummary` counts row, to the left of N/A (`completeness-check-report.tsx:308-312`). Not a `StackedStatusBar` segment. `StatusSummary` takes status chips today; an appeal count is not a status, so RDS needs a way to add a non-status count (design TBD with dsd).
  - **Appealed finding.** Each appealed `ChecklistFinding` gets a visual indicator next to the item number/title and the customer's appeal text under the finding: "Appeal: *triage_note*". Needs an RDS `ChecklistFinding` change.
  - The disposition gate widens from fail/warn to fail/warn/uncertain, matching D6, so formal notes and appeals on uncertain items print.
  - Iterated in the dsd RDS gallery, released with the `release-rds` flow, then wired in `cc-report-logic.ts` (`appeal` into `CcTriageStatus` and `CC_DISPOSITION_VALUES`, an appeal annotation) and `completeness-check-report.tsx`.

**D12. Known gaps accepted.**
- **Old cityhall app and substation's `POST comment-triage` route.** The route writes as **service_role** (`substation/src/lib/supabase.ts:14`), so it bypasses D4 entirely, and it lets read-level users write (it only checks `read`, L23-25). No current caller found in cityhall-new, IG or claude-plugins. Out of scope per Will (cityhall-new only); file the route as a separate bug and retire it.
- We can't tell who wrote the 13 existing CC overrides (11 on Pape-Dawson projects, 2 on Quiddity); the neutral PDF wording stays true for all of them.

**D13. No existing `comment_triage` data is deleted or modified by this feature** (G14). No data migration, no backfill, no clean-up. All 13 existing CC overrides, the 545 CRC overrides and every triage row stay exactly as they are; the only schema change to the table is one added nullable column and a trigger. D5's legacy read rule exists so old rows display correctly without being touched.

## 5. Rollout

- **Phase 1:** one cityhall-new PR, implemented in a new session from this spec (G20). Order: Jason pushes the declarative migration, then the app deploys. Between the two, the running app's CC card hits the trigger on exactly the writes this spec forbids (a customer's verdict save, a Noetic triage save, a CC sub-status) and shows the refusal message; everything else keeps working. With 8 post-cutover CC reviews in prod, that window is acceptable. Deploy within the hour.
- **Phase 2:** starts after phase 1 ships (G18): design iteration in the dsd RDS gallery → RDS release → cityhall-new PR. No schema change.

## 6. Decision log

### 6.1 Open questions from v1 (answered 2026-10-05)

- **Q1. CRC:** kept as is. The split applies to post-cutover CC only (D1).
- **Q2. "Noetic":** any Noetic member, admin or not (D2).
- **Q3. Formal-note sub-status:** removed from the CC flow only; formal (1,044 rows) and CRC keep it (D6).
- **Q4. What can be appealed:** fail, warn and uncertain (D6).
- **Q5. Notifications:** none (D7).
- **Q6. Appeal count:** yes. In the UI's Overall results in phase 1 (D10), in the PDF summary to the left of N/A in phase 2 (D11). Not a bar segment in either.
- **Q7. Appeals in the PDF:** phase 2: the summary count plus an indicator and the appeal text on each appealed finding (D11).
- **Q8. Re-appeal / answers:** out of scope; an item is appealed or not (D7).

### 6.2 Grill session (2026-10-05)

- **G1.** Don't widen project visibility to plain Noetic members; the verdict RPC still accepts them (D2).
- **G2.** Customers may delete only their own triage, never Noetic's override: keep one row, the trigger covers DELETE (D4, option A over a two-table split). *Option A is the recommendation; Will to confirm A vs B.*
- **G3.** Masquerade writes as the customer are acceptable (D7).
- **G4.** An item Noetic overrode can be appealed while its effective verdict is fail/warn/uncertain (D6).
- **G5.** An appeal stays visible and counted when Noetic moves the item fail → warn (D7).
- **G6.** Customers can withdraw an appeal (D7).
- **G7.** Customers can edit an appeal (D7).
- **G8.** Switching Formal note ↔ Appeal keeps the comment (D7).
- **G9.** Anyone with project write access in the customer org can triage (D6).
- **G10.** Noetic's reason is optional (D3, D8).
- **G11.** Noetic's reason is customer-facing (D8).
- **G12.** No staff appeal queue; the per-check count and badges are enough (D7).
- **G13.** `verdict_override_by` / `_at` dropped as scope creep; PDF keeps the neutral "a human reviewer" wording everywhere (D5, D11).
- **G14.** No existing `comment_triage` data is deleted or modified (D13).
- **G15.** Phase 1 UI appeal surfaces are Overall results and the item badge only (D10).
- **G16.** Uncertain items get triage for the first time (D6).
- **G17.** Phase 1 ships with no visible PDF change (D11).
- **G18.** Phase 2 starts after phase 1 ships, not in parallel (D11, §5).
- **G19.** Will tests manually (§4).
- **G20.** The spec is final for implementation in a new session (§5).

<script data-reader>
/* spec-kit v5 — spec reader. Renders the embedded markdown (#spec-md) with marked, assigns
   deep-link ids, builds the TOC, and highlights the :target.
   ids assigned:
     headings   → GitHub-style slug of the text, PLUS an alias  s<number> for numbered headings
                  ("### 3.2 Piece A" → #s3-2, "## 1. Problem" → #s1)
     tokens     → the first <strong> whose text starts with P0a / D12 / Q6 gets id="P0a" etc.
   So a companion page can link to  SPEC.html#s3-2 , #D12 , #P0a , #Q6 . */
(function(){
  const raw=document.getElementById('spec-md').textContent.replace(/<\\\/script/g,'</script').trim();
  const body=document.getElementById('spec-body');
  marked.use({gfm:true,breaks:false});
  // a run of **Label:** lines (the spec header block) is meant to stack: give each a hard break
  const md=raw.replace(/^(\*\*[^*\n]+:\*\*[^\n]*)$/gm,'$1  ');
  body.innerHTML=marked.parse(md);
  const used=new Set();
  const slug=t=>t.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  const uniq=id=>{let i=id,n=1;while(used.has(i))i=id+'-'+(n++);used.add(i);return i;};
  // headings
  body.querySelectorAll('h1,h2,h3,h4').forEach(h=>{
    const text=h.textContent.trim();
    h.id=uniq(slug(text));
    const m=text.match(/^(\d+(?:\.\d+)*)\.?\s/);
    if(m){const a=document.createElement('span');a.id=uniq('s'+m[1].replace(/\./g,'-'));a.className='anchor';h.before(a);}
  });
  // tokens: **D4.** / **P0a …** / **Q6.**
  body.querySelectorAll('strong,b').forEach(s=>{
    const m=s.textContent.trim().match(/^(P\d[a-z]?|D\d+|Q\d+)\b/);
    if(m&&!used.has(m[1])){s.id=m[1];used.add(m[1]);s.classList.add('tok');}
  });
  // tables scroll instead of the page
  body.querySelectorAll('table').forEach(t=>{t.classList.add('spectable');const w=document.createElement('div');w.className='spectable-scroll';t.before(w);w.appendChild(t);});
  // title + meta
  const h1=body.querySelector('h1'); if(h1){document.getElementById('reader-title').textContent=h1.textContent;document.title=h1.textContent;h1.remove();}
  const status=raw.match(/\*\*Status:\*\*\s*([^\n]+)/),date=raw.match(/\*\*Date:\*\*\s*([^\n]+)/);
  document.getElementById('reader-meta').textContent=[status&&status[1],date&&date[1]].filter(Boolean).join(' · ');
  // TOC from h2/h3
  const toc=document.getElementById('toc');
  body.querySelectorAll('h2,h3').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className='toc-'+h.tagName.toLowerCase();toc.appendChild(a);});
  // sibling .md links stay .md (GitHub renders them; a reader for them may not be built). If a
  // sibling reader IS built, link to it explicitly from the markdown as .html.
  // scroll to :target after ids exist
  if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView({block:'start'});}
})();
